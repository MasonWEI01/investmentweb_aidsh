/* ---------------- render ---------------- */
function render() {
  const main = `<div id="topbar">
      <button id="ham" class="tbtn" aria-label="menu">☰</button>

      <div class="langsw">
        <button data-lang="zh" class="on">繁中</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="tbtn" id="topdf">${bi('課件', 'Slides')}</button>
    </div>
    <aside id="side">${sideHTML()}</aside>
    <main id="main">
      ${homeHTML()}
      ${TOPICS.map(topicHTML).join('')}
      ${typeof cramHTML === 'function' ? cramHTML() : ''}
      ${quizHTML()}
      ${pdfHTML()}
      <div class="foot">
        ${bi('© 供個人複習使用 · 內容整理自 CCBS 4024 課件與 BKM《Essentials of Investments》13e', 'For personal revision · compiled from the CCBS 4024 decks and BKM, Essentials of Investments, 13e')}
      </div>
    </main>

    <button id="backtop" title="top">↑</button>`;

  document.getElementById('app').innerHTML = main;
  fillCounts();
  wireNav();
  wireLang();
  wireQuiz();
  wirePdf();
  wireScroll();
  wireFigures();
}

/* live counts, so the hero never drifts from the real content */
function fillCounts() {
  const set = (k, z, e) => {
    document.querySelectorAll('[data-cnt="' + k + '"]').forEach((el) => {
      el.innerHTML = bi(z, e);
    });
  };
  set('fig', document.querySelectorAll('figure.fig').length + ' 張圖解', document.querySelectorAll('figure.fig').length + ' diagrams');
  set('ex', document.querySelectorAll('.ex').length + ' 道例題', document.querySelectorAll('.ex').length + ' worked examples');
  set('q', document.querySelectorAll('.q').length + ' 題自測', document.querySelectorAll('.q').length + ' quiz items');
}

/* ---------------- language ---------------- */
function setLang(lang) {
  document.body.classList.remove('lang-zh', 'lang-en');
  document.body.classList.add('lang-' + lang);
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  document.querySelectorAll('.langsw button').forEach((b) => {
    b.classList.toggle('on', b.dataset.lang === lang);
  });
  const nq = document.getElementById('navq');
  if (nq) nq.placeholder = lang === 'zh' ? (nq.dataset.phz || '') : (nq.dataset.phe || '');
  try { localStorage.setItem('ccbs4024-lang', lang); } catch (e) {}
}

function wireLang() {
  document.querySelectorAll('.langsw button').forEach((b) => {
    b.addEventListener('click', () => setLang(b.dataset.lang));
  });
  let lang = 'zh';
  try { lang = localStorage.getItem('ccbs4024-lang') || 'zh'; } catch (e) {}
  setLang(lang);
}

/* ---------------- navigation ---------------- */
function wireNav() {
  document.querySelectorAll('[data-jump]').forEach((el) => {
    el.addEventListener('click', () => {
      const id = el.dataset.jump;
      const target = id === 'home' ? document.getElementById('home-overview') : document.getElementById(id);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      document.body.classList.remove('navopen');
    });
  });

  document.querySelectorAll('.navgroup').forEach((g) => {
    const head = g.querySelector('.navlink');
    if (!head || !g.querySelector('.navsub')) return;
    head.addEventListener('click', (ev) => {
      if (head.dataset.jump) return; // jump links handled above
      ev.preventDefault();
      g.classList.toggle('open');
    });
  });

  document.getElementById('ham').addEventListener('click', () => {
    document.body.classList.toggle('navopen');
  });
  document.addEventListener('click', (ev) => {
    if (document.body.classList.contains('navopen') && !ev.target.closest('#side') && !ev.target.closest('#ham')) {
      document.body.classList.remove('navopen');
    }
  });
  document.getElementById('topdf').addEventListener('click', () => {
    document.getElementById('pdf').scrollIntoView({ behavior: 'smooth' });
  });
  document.getElementById('backtop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  const q = document.getElementById('navq');
  if (q) {
    q.addEventListener('input', () => {
      const v = q.value.trim().toLowerCase();
      document.querySelectorAll('#side .navgroup').forEach((g) => {
        const txt = g.textContent.toLowerCase();
        const hit = !v || txt.includes(v);
        g.style.display = hit ? '' : 'none';
        if (v && hit && g.querySelector('.navsub')) g.classList.add('open');
      });
      document.querySelectorAll('#side .navlink').forEach((l) => {
        if (!l.closest('.navgroup')) l.style.display = v ? 'none' : '';
      });
    });
  }
}

/* ---------------- scrollspy / progress ---------------- */
function wireScroll() {
  const bar = document.querySelector('#progress i');
  const back = document.getElementById('backtop');
  const onScroll = () => {
    const h = document.documentElement;
    const max = h.scrollHeight - h.clientHeight;
    const p = max > 0 ? (h.scrollTop / max) * 100 : 0;
    if (bar) bar.style.width = p + '%';
    if (back) back.classList.toggle('show', h.scrollTop > 600);
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  const secs = Array.from(document.querySelectorAll('section.sec[id]'));
  const links = Array.from(document.querySelectorAll('#toc a[data-sec]'));
  const navlinks = Array.from(document.querySelectorAll('#side .navsub a'));

  const spy = () => {
    const y = window.scrollY + 120;
    let cur = secs[0];
    for (const s of secs) {
      if (s.offsetTop <= y) cur = s;
    }
    if (!cur) return;
    links.forEach((a) => a.classList.toggle('active', a.dataset.sec === cur.id));
    navlinks.forEach((a) => a.classList.toggle('active', a.getAttribute('href') === '#' + cur.id));

    const topicId = cur.id.split('-')[0];
    document.querySelectorAll('#side .navgroup').forEach((g) => {
      const on = g.dataset.g === topicId;
      g.classList.toggle('open', on);
      const head = g.querySelector('.navlink');
      if (head) head.classList.toggle('active', on && cur.id !== topicId);
    });
    document.querySelectorAll('#side .navlink[data-jump]').forEach((l) => {
      const id = l.dataset.jump;
      l.classList.toggle('active', (id === 'home' && topicId === 'home') || id === topicId || (id === 'quiz' && topicId === 'quiz') || (id === 'pdf' && topicId === 'pdf'));
    });
  };
  window.addEventListener('scroll', spy, { passive: true });
  spy();
}

/* ---------------- quiz engine ---------------- */
function wireQuiz() {
  const scoreEl = document.getElementById('qScore');
  const barEl = document.getElementById('qBar');
  const total = QUIZ.length;
  const answered = new Set();
  let right = 0;

  const paint = () => {
    if (scoreEl) scoreEl.textContent = right;
    if (barEl) barEl.style.width = (right / total) * 100 + '%';
  };

  document.querySelectorAll('.opt').forEach((opt) => {
    opt.addEventListener('click', () => {
      const qi = Number(opt.dataset.q);
      const k = Number(opt.dataset.k);
      const q = QUIZ[qi];
      const box = opt.parentElement;
      if (box.dataset.done === '1') return;
      box.dataset.done = '1';
      box.querySelectorAll('.opt').forEach((o) => {
        const ok = Number(o.dataset.k) === q.a;
        o.classList.toggle('right', ok);
        if (Number(o.dataset.k) === k && !ok) o.classList.add('wrong');
      });
      const ans = document.getElementById('ans' + qi);
      if (ans) ans.classList.add('show');
      if (!answered.has(qi)) {
        answered.add(qi);
        if (k === q.a) right += 1;
        paint();
      }
    });
  });

  document.querySelectorAll('[data-reveal]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const i = btn.dataset.reveal;
      const ans = document.getElementById('ans' + i);
      if (ans) ans.classList.toggle('show');
    });
  });

  const reset = document.getElementById('qReset');
  if (reset) {
    reset.addEventListener('click', () => {
      answered.clear();
      right = 0;
      paint();
      document.querySelectorAll('.opts').forEach((box) => {
        box.dataset.done = '0';
        box.querySelectorAll('.opt').forEach((o) => o.classList.remove('right', 'wrong', 'pick'));
      });
      document.querySelectorAll('.ans').forEach((a) => a.classList.remove('show'));
    });
  }
  paint();
}

/* ---------------- pdf switcher ---------------- */
function wirePdf() {
  const frame = document.getElementById('pdf-frame');
  const open = document.getElementById('pdf-open');
  document.querySelectorAll('[data-pdf]').forEach((b) => {
    b.addEventListener('click', () => {
      document.querySelectorAll('[data-pdf]').forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      const src = 'pdf/' + b.dataset.pdf;
      if (frame) frame.src = src;
      if (open) open.href = src;
    });
  });
}

/* ---------------- boot ---------------- */
document.addEventListener('DOMContentLoaded', render);
if (document.readyState !== 'loading') render();

</script>
