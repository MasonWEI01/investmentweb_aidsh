    name: { z: '資本配置線 CAL：E(Rₚ)=8%+0.3571σₚ', e: 'capital allocation line: E(Rₚ) = 8% + 0.3571σₚ' },
    explain: { z: 'CAL 是無風險資產 R_f 與風險組合 P 的所有組合。斜率 (18−8)/28=0.3571 就是 Sharpe ratio：每多承擔 1 個百分點風險，多拿 0.3571 個百分點預期報酬。',
      e: 'The CAL collects every mix of the risk-free asset and risky portfolio P. Its slope, (18 − 8)/28 = 0.3571, is the Sharpe ratio: each extra point of risk buys 0.3571 points of expected return.' }
  }, cal, { color: PAL.navy, sw: 2.8 });

  /* the risk-free asset */
  c.circle(X(0), Y(8), 5.2, { fill: PAL.green, stroke: '#fff', sw: 1.6 });
  c.text(116, 294, { z: 'R_f = 8%，σ = 0', e: 'R_f = 8%, σ = 0' },
    { size: 9.8, anchor: 'start', fill: PAL.green, weight: 600 });

  /* 70/30 complete portfolio */
  c.guide(X(19.6), Y(15), X(19.6), 312, PAL.faint);
  c.guide(X(19.6), Y(15), 104, Y(15), PAL.faint);
  c.circle(X(19.6), Y(15), 5.2, { fill: PAL.gold, stroke: '#fff', sw: 1.6 });
  c.text(X(19.6) + 12, Y(15) + 18, { z: '70/30：E=15%，σ=19.6%', e: '70/30: E = 15%, σ = 19.6%' },
    { size: 9.8, anchor: 'start', fill: '#8a6a1e', weight: 600 });

  /* the risky portfolio P */
  c.circle(X(28), Y(18), 5.4, { fill: PAL.navy, stroke: '#fff', sw: 1.6 });
  c.text(X(28) + 12, Y(18) + 18, { z: 'P：E=18%，σ=28%', e: 'P: E = 18%, σ = 28%' },
    { size: 9.8, anchor: 'start', fill: PAL.navy, weight: 600 });

  /* levered: w = 1.3 → 借 30% 買 P */
  c.circle(X(36.4), Y(21), 5.2, { fill: PAL.red, stroke: '#fff', sw: 1.6 });
  c.text(600, 76, { z: 'w=1.3：借 30% 加碼', e: 'w = 1.3: borrow 30% and lever up' },
    { size: 9.6, anchor: 'end', fill: PAL.red, weight: 600 });
  c.text(600, 92, { z: '（σ=36.4%，E=21%）', e: '(σ = 36.4%, E = 21%)' },
    { size: 9.4, anchor: 'end', fill: PAL.red });

  c.spot(S, {
    id: 'rf-rf', col: PAL.green,
    name: { z: 'R_f：E(R)=8%，σ=0', e: 'R_f: E(R) = 8%, σ = 0' },
    explain: { z: '無風險資產是 CAL 的截距，也是借貸利率。沒有它，投資只能停在 P；有了它，你可以按自己的風險偏好停在 R_f 與 P 之間。',
      e: 'The risk-free asset is the intercept of the CAL and the borrowing rate. Without it you could only hold P; with it you can stop anywhere between R_f and P according to your risk appetite.' },
    xv: 0, yv: 8
  }, 0, 8, { draw: false });
  c.spot(S, {
    id: 'rf-7030', col: PAL.gold,
    name: { z: '70/30 組合', e: 'the 70/30 portfolio' },
    explain: { z: 'w=0.7：70% 放 P、30% 放無風險資產。E(Rₚ)=0.7×18+0.3×8=15%，σₚ=0.7×28=19.6%——風險與報酬同比例縮小。',
      e: 'w = 0.7: 70% in P and 30% in the risk-free asset. E(Rₚ) = 0.7×18 + 0.3×8 = 15% and σₚ = 0.7×28 = 19.6%: risk and return shrink in the same proportion.' },
    xv: 19.6, yv: 15
  }, 19.6, 15, { draw: false });
  c.spot(S, {
    id: 'rf-P', col: PAL.navy,
    name: { z: 'P：E=18%，σ=28%', e: 'P: E = 18%, σ = 28%' },
    explain: { z: 'P 是 100% 風險資產：σ=28%、E=18%。CAL 穿過 P；不借貸時，P 就是風險資產配置的上限。',
      e: 'P is 100% in the risky asset: σ = 28% and E = 18%. The CAL passes through P; without borrowing, P is the upper limit of risky-asset exposure.' },
    xv: 28, yv: 18
  }, 28, 18, { draw: false });
  c.spot(S, {
    id: 'rf-levered', col: PAL.red,
    name: { z: 'w=1.3：E=21%，σ=36.4%', e: 'w = 1.3: E = 21%, σ = 36.4%' },
    explain: { z: 'w=1.3：以 8% 借 30% 的錢加碼 P。E=8+1.3×0.3571×28=21%，σ=1.3×28=36.4%。借款把報酬與風險同比例放大，Sharpe 不變。',
      e: 'w = 1.3: borrow 30% at 8% and add it to P. E = 8 + 1.3×0.3571×28 = 21% and σ = 1.3×28 = 36.4%. Leverage scales return and risk together, so the Sharpe ratio is unchanged.' },
    xv: 36.4, yv: 21
  }, 36.4, 21, { draw: false });

  /* sharpe card */
  c.rect(120, 96, 266, 58, { fill: 'rgba(255,255,255,.94)', stroke: PAL.line, rx: 9 });
  c.text(253, 118, { z: '直線斜率 = (18 − 8) ÷ 28 = 0.3571', e: 'slope = (18 − 8) ÷ 28 = 0.3571' },
    { size: 9.8, weight: 600, fill: PAL.ink });
  c.text(253, 138, { z: '= Sharpe ratio：每單位風險的額外報酬', e: '= Sharpe ratio: extra return per unit of risk' },
    { size: 9.2, fill: PAL.soft });

  c.text(200, 252, { z: '貸出（w < 1）', e: 'lending (w < 1)' },
    { size: 9.6, anchor: 'start', fill: PAL.soft });
  c.text(684, 152, { z: '借款（w > 1）', e: 'borrowing (w > 1)' },
    { size: 9.6, anchor: 'end', fill: PAL.soft });
  return c.out();
};

/* ------------------------------------------------------------
   8. 平均共變異數主導：σₚ² = (1/n)·平均變異 + (1 − 1/n)·平均共變
   ------------------------------------------------------------ */
FIGS['d-markowitz'] = () => {
  const c = CV(700, 300);
  const X0 = 178, W = 440;

  const S = c.plot({
    x0: X0, x1: X0 + W, y0: 78, y1: 242,
    xmin: 0, xmax: 100, ymin: 0, ymax: 1,
    labelX: { z: '佔 σₚ² 的比重（%）', e: 'share of σₚ² (%)' },
    labelY: { z: 'n（股票數）', e: 'n (number of stocks)' },
    unitX: '%', decX: 1, decY: 0
  });

  c.text(350, 40, { z: '等權重組合：σₚ² = (1/n)·平均變異數 + (1 − 1/n)·平均共變異數',
    e: 'equal-weight portfolio: σₚ² = (1/n)·avg variance + (1 − 1/n)·avg covariance' },
    { size: 11, weight: 600, fill: PAL.ink });

  const rows = [
    { n: 1, a: 1, lab: { z: '平均變異數 σ̄²（100%）', e: 'avg variance σ̄² (100%)' } },
    { n: 10, a: 0.1 },
    { n: 50, a: 0.02 }
  ];

  rows.forEach((r, i) => {
    const y = 78 + i * 62;
    const wA = W * r.a, wB = W - wA;
    c.text(44, y + 25, 'n = ' + r.n, { size: 11, mono: true, anchor: 'start', fill: PAL.ink, weight: 600 });
    c.rect(X0, y, wA, 40, { fill: PAL.gold, rx: 3 });
    c.rect(X0 + wA, y, wB, 40, { fill: PAL.green, rx: 3 });
    if (i === 0) {
      c.text(X0 + wA / 2, y + 24, r.lab, { size: 9.6, fill: '#fff', weight: 600 });
    } else {
      c.text(X0 + wA + wB / 2, y + 24, { z: '平均共變異數（' + Math.round((1 - r.a) * 100) + '%）',
        e: 'avg covariance (' + Math.round((1 - r.a) * 100) + '%)' },
        { size: 9.6, fill: '#fff', weight: 600 });
      c.text(X0 + Math.max(wA / 2, 10), y - 6, Math.round(r.a * 100) + '%',
        { size: 9.4, fill: '#8a6a1e', weight: 600 });
    }
  });

  const yOf = (yy) => (242 - (yy + 20)) / 164;
  const varEx = {
    1: { z: 'n=1：100% 是平均變異數（就是股票自己的 σ²），沒有任何共變異數可以攤。',
      e: 'n = 1: all of it is average variance (the share’s own σ²); there is no covariance to spread.' },
    10: { z: 'n=10：只有 1/n=10% 是平均變異數，90% 已經是平均共變異數；再加股票，能壓的只剩這 10%。',
      e: 'n = 10: only 1/n = 10% is average variance and 90% is already average covariance; more names can squeeze only that 10%.' },
    50: { z: 'n=50：平均變異數只剩 2%，98% 是平均共變異數——再怎麼加股票，主導項幾乎不動。',
      e: 'n = 50: average variance is down to 2% and 98% is average covariance; adding more names barely moves the dominant term.' }
  };
  const covEx = {
    10: { z: 'n=10 時 90% 的組合變異數來自共變異數：股票之間一起動的部分，才是分散不掉的市場風險。',
      e: 'At n = 10, 90% of portfolio variance comes from covariance: the part that moves together is the market risk diversification cannot remove.' },
    50: { z: 'n=50 時 98% 是共變異數。極限 n→∞ 時 1/n→0，σₚ² 幾乎等於平均共變異數，這就是系統風險。',
      e: 'At n = 50, 98% is covariance. In the limit n→∞, 1/n→0 and σₚ² becomes the average covariance: that is systematic risk.' }
  };
  rows.forEach((r, i) => {
    const y = 78 + i * 62;
    const gMeta = {
      id: 'mk-var-' + r.n, col: PAL.gold,
      name: { z: 'n=' + r.n + '：平均變異數 ' + Math.round(r.a * 100) + '%', e: 'n = ' + r.n + ': average variance ' + Math.round(r.a * 100) + '%' },
      explain: varEx[r.n], xv: r.a * 100, yv: r.n
    };
    [0.18, 0.5, 0.82].forEach((f) => c.spot(S, gMeta, r.a * 100 * f, yOf(y), { draw: false }));
    if (i > 0) {
      const cMeta = {
        id: 'mk-cov-' + r.n, col: PAL.green,
        name: { z: 'n=' + r.n + '：平均共變異數 ' + Math.round((1 - r.a) * 100) + '%', e: 'n = ' + r.n + ': average covariance ' + Math.round((1 - r.a) * 100) + '%' },
        explain: covEx[r.n], xv: (1 - r.a) * 100, yv: r.n
      };
      [0.2, 0.5, 0.8].forEach((f) => c.spot(S, cMeta, r.a * 100 + (1 - r.a) * 100 * f, yOf(y), { draw: false }));
    }
  });

  /* right-edge n → ∞ marker */
  c.line(X0 + W + 18, 226, X0 + W + 18, 92, { stroke: PAL.faint, sw: 1.3, dash: '4 4' });
  c.arrow(X0 + W + 18, 226, X0 + W + 18, 88, { stroke: PAL.faint, sw: 1.3 });
  c.text(X0 + W + 30, 160, { z: 'n → ∞', e: 'n → ∞' },
    { size: 9.6, anchor: 'start', fill: PAL.soft, weight: 600 });

  c.text(350, 262, { z: 'n → ∞：1/n → 0，σₚ² 只剩平均共變異數 —— 這就是市場（系統）風險，買更多股票也清不掉。',
    e: 'n → ∞: 1/n → 0, so σₚ² collapses to avg covariance — that is market risk, and buying more names never clears it.' },
    { size: 9.4, fill: PAL.soft });
  return c.out();
};

/* ------------------------------------------------------------
   9. 固定 50/50 權重，σₚ 如何隨 ρ 單調下降
   ------------------------------------------------------------ */
function t2Rho(rho) {
  const c = CV(700, 360);
  const X = (r) => 100 + (r + 1) / 2 * 560;
  const Y = (s) => 288 - s / 26 * 208;
  const A = (r) => 25 * Math.sqrt(Math.max((1 + r) / 2, 0));
  const B = (r) => Math.sqrt(Math.max(281.25 + 225 * r, 0));
  const rNow = Math.max(-0.9, Math.min(0.9, rho));

  const PL = c.plot({
    x0: 100, x1: 660, y0: 80, y1: 288,
    xmin: -1, xmax: 1, ymin: 0, ymax: 26,
    labelX: { z: '相關係數 ρ', e: 'correlation ρ' },
    labelY: { z: 'σₚ（%）', e: 'σₚ (%)' },
    unitY: '%', decX: 2, decY: 1
  });

  c.line(100, 288, 660, 288, { stroke: PAL.ink, sw: 1.3 });
  c.line(100, 80, 100, 288, { stroke: PAL.ink, sw: 1.3 });
  [[-1, '−1'], [-0.5, '−0.5'], [0, '0'], [0.5, '+0.5'], [1, '+1']].forEach(([r, t]) => {
    c.line(X(r), 288, X(r), 292, { stroke: PAL.ink, sw: 1.2 });
    c.text(X(r), 302, t, { size: 9.6, fill: PAL.soft });
  });
  [0, 5, 10, 15, 20, 25].forEach((v) => {
    c.line(96, Y(v), 100, Y(v), { stroke: PAL.ink, sw: 1.2 });
    c.text(92, Y(v) + 4, v + '%', { size: 9.6, fill: PAL.soft, anchor: 'end' });
  });
  c.text(380, 322, { z: '相關係數 ρ', e: 'correlation ρ' }, { size: 10.5, fill: PAL.soft });
  c.text(104, 70, { z: 'σₚ（%）', e: 'σₚ (%)' }, { size: 10.5, fill: PAL.soft, anchor: 'start' });
  c.text(380, 44, { z: '權重固定 50/50，只把 ρ 從 +1 移到 −1',
    e: 'weights fixed at 50/50, only ρ moves from +1 to −1' },
    { size: 11, weight: 600, fill: PAL.ink });

  const aPts = [], bPts = [];
  for (let i = 0; i <= 400; i++) {
    const r = -1 + i / 400 * 2;
    aPts.push([r, A(r)]);
    bPts.push([r, B(r)]);
  }
  c.series(PL, {
    id: 'rho-A',
    name: { z: '等風險（σ_A=σ_B=25%）：σₚ=25√((1+ρ)/2)', e: 'equal risk (σ_A = σ_B = 25%): σₚ = 25√((1+ρ)/2)' },
    explain: { z: '兩檔風險相同時，50/50 的 σₚ=25√((1+ρ)/2)。ρ=+1 完全正相關，σₚ=25%，一點都沒降；ρ=−1 完全負相關，σₚ=0，兩股互相抵銷。',
      e: 'When both assets have the same risk, the 50/50 σₚ = 25√((1+ρ)/2). At ρ = +1 they are perfectly positive and σₚ = 25% with no reduction; at ρ = −1 they are perfectly negative and σₚ = 0.' }
  }, aPts, { color: PAL.navy, sw: 2.8 });
  c.series(PL, {
    id: 'rho-B',
    name: { z: '風險不等（A 15%/B 30%）：ρ=−1 仍有 7.5% 地板', e: 'unequal risk (A 15% / B 30%): ρ = −1 still floors at 7.5%' },
    explain: { z: '50/50 且風險不等時，σₚ²=281.25+225ρ。ρ=−1 的 7.5% 是 |30−15|/2 的殘餘風險：兩檔風險大小不同，無法完全對沖。要 σₚ=0，必須 σ_A=σ_B 且 ρ=−1。',
      e: 'With 50/50 weights and unequal risks, σₚ² = 281.25 + 225ρ. The 7.5% at ρ = −1 is the residual |30 − 15|/2: risks of different size cannot cancel completely. σₚ = 0 needs σ_A = σ_B together with ρ = −1.' }
  }, bPts, { color: PAL.gold, sw: 2.4, dash: '7 5' });

  c.circle(X(1), Y(25), 4.6, { fill: PAL.navy, stroke: '#fff', sw: 1.6 });
  c.circle(X(-1), Y(0), 4.6, { fill: '#fff', stroke: PAL.navy, sw: 2 });
  c.circle(X(-1), Y(7.5), 4.4, { fill: PAL.gold, stroke: '#fff', sw: 1.6 });

  c.spot(PL, {
    id: 'rho-a1', col: PAL.navy,
    name: { z: 'ρ=+1：等風險組合', e: 'ρ = +1: equal-risk portfolio' },
    explain: { z: '完全正相關時，兩檔股票同漲同跌，50/50 的風險只是兩者的加權平均 25%——分散完全無效。',
      e: 'Under perfect positive correlation the two shares rise and fall together, so the 50/50 risk is just the weighted average, 25%: diversification achieves nothing.' },
    xv: 1, yv: 25
  }, 1, 25, { draw: false });
  c.spot(PL, {
    id: 'rho-a0', col: PAL.navy,
    name: { z: 'ρ=−1：等風險組合', e: 'ρ = −1: equal-risk portfolio' },
    explain: { z: '完全負相關且兩檔風險相同（都是 25%）時，50/50 的漲跌剛好抵銷，σₚ=0。這是分散的數學上限。',
      e: 'Under perfect negative correlation with equal risks (both 25%), the 50/50 moves cancel exactly and σₚ = 0. This is the mathematical limit of diversification.' },
    xv: -1, yv: 0
  }, -1, 0, { draw: false });
  c.spot(PL, {
    id: 'rho-bfloor', col: PAL.gold,
    name: { z: 'ρ=−1：風險不等組合', e: 'ρ = −1: unequal-risk portfolio' },
    explain: { z: 'A 15%、B 30% 時，即使 ρ=−1，50/50 仍有 |15−30|/2=7.5% 的殘餘風險。風險大小不同，就無法完全對沖。',
      e: 'With A at 15% and B at 30%, even ρ = −1 leaves |15 − 30|/2 = 7.5% residual risk at 50/50. Risks of different size cannot be fully hedged.' },
    xv: -1, yv: 7.5
  }, -1, 7.5, { draw: false });

  c.guide(104, 286, 132, 281, PAL.faint);
  c.text(136, 280, { z: 'σₚ = 0', e: 'σₚ = 0' },
    { size: 9.6, anchor: 'start', fill: PAL.navy, weight: 600 });
  c.text(176, 250, { z: 'A 15%/B 30%：ρ=−1 仍有 7.5% 地板',
    e: 'A 15% / B 30%: ρ = −1 still floors at 7.5%' },
    { size: 9.4, anchor: 'start', fill: '#8a6a1e' });
  c.text(176, 266, { z: '只有 σ_A = σ_B 且 ρ=−1 才可能 σₚ=0',
    e: 'σₚ = 0 needs σ_A = σ_B together with ρ = −1' },
    { size: 9.4, anchor: 'start', fill: '#8a6a1e' });

  /* 滑桿選定的 ρ：垂線、兩條曲線上的讀值點、右上角即時讀數 */
  const rTxt = (rNow > 0 ? '+' : rNow < 0 ? '−' : '') + Math.abs(rNow).toFixed(2);
  c.line(X(rNow), 288, X(rNow), 80, { stroke: PAL.faint, sw: 1.1, dash: '3 4', opacity: 0.85 });
  c.circle(X(rNow), Y(A(rNow)), 5.4, { fill: PAL.navy, stroke: '#fff', sw: 1.8 });
  c.circle(X(rNow), Y(B(rNow)), 5, { fill: PAL.gold, stroke: '#fff', sw: 1.6 });
  c.text(660, 68, {
    z: 'ρ=' + rTxt + '：σₚ(A)=' + T2D(A(rNow), 2) + '%，σₚ(B)=' + T2D(B(rNow), 2) + '%',
    e: 'ρ = ' + rTxt + ': σₚ(A) = ' + T2D(A(rNow), 2) + '%, σₚ(B) = ' + T2D(B(rNow), 2) + '%'
  }, { size: 9.6, anchor: 'end', fill: PAL.ink, weight: 600 });
  c.spot(PL, {
    id: 'rho-now-a', col: PAL.navy,
    name: { z: 'ρ=' + rTxt + '：等風險組合', e: 'ρ = ' + rTxt + ': equal-risk portfolio' },
    explain: { z: '把 ρ 從 +1 拖到 −1，等風險的 50/50 組合會從 25% 一路降到 0；拖到中間（ρ=0）時已降到 17.7%，分散效果一半以上在前半段出現。',
      e: 'Drag ρ from +1 to −1 and the equal-risk 50/50 portfolio falls from 25% all the way to 0. At ρ = 0 it is already down to 17.7%: more than half of the benefit arrives in the first half of the range.' },
    xv: rNow, yv: A(rNow)
  }, rNow, A(rNow), { draw: false });
  c.spot(PL, {
    id: 'rho-now-b', col: PAL.gold,
    name: { z: 'ρ=' + rTxt + '：風險不等組合', e: 'ρ = ' + rTxt + ': unequal-risk portfolio' },
    explain: { z: '風險不等時，ρ 從 +1 到 −1 只把 σₚ 從 22.5% 壓到 7.5%，而且永遠到不了 0；兩條曲線的差距就是「風險大小不同」造成的無法對沖部分。',
      e: 'With unequal risks, moving ρ from +1 to −1 only takes σₚ from 22.5% to 7.5%, and never to 0. The gap between the two curves is the part that unequal risk sizes make impossible to hedge.' },
    xv: rNow, yv: B(rNow)
  }, rNow, B(rNow), { draw: false });

  /* legend */
  c.line(100, 344, 128, 344, { stroke: PAL.navy, sw: 2.8 });
  c.text(136, 348, { z: 'σ_A = σ_B = 25%（等風險）', e: 'σ_A = σ_B = 25% (equal risk)' },
    { size: 9.6, anchor: 'start', fill: PAL.soft });
  c.line(390, 344, 418, 344, { stroke: PAL.gold, sw: 2.4, dash: '7 5' });
  c.text(426, 348, { z: 'A 15%/B 30%（風險不等）', e: 'A 15% / B 30% (unequal risk)' },
    { size: 9.6, anchor: 'start', fill: PAL.soft });
  return c.out();
}

const T2_RHO_DEF = 0.3;
FIGS['d-rho-sweep'] = () => t2Rho(PARAMS['d-rho-sweep'].def.rho);
PARAMS['d-rho-sweep'] = {
  params: [{ k: 'rho', z: '相關係數 ρ', e: 'correlation ρ', min: -0.9, max: 0.9, step: 0.05, dec: 2, def: T2_RHO_DEF }],
  def: { rho: T2_RHO_DEF },
  build: (v) => t2Rho(v.rho)
};


/* ===== figs-t3.js ===== */
/* ------------------------------------------------------------
   figs-t3.js — Topic 3 diagrams (portfolio theory → CAPM)
   All curves are sampled from explicit analytic functions and registered
   as interactive series: hover reads them, clicking explains them.
   Labels never move data points: only the text moves.
   ------------------------------------------------------------ */

/* ---------- shared analytic model (教學示意參數) ----------
   Minimum-variance frontier of risky assets, mean–SD space:
       E(σ) = EG + K·√(σ² − σG²)        (σ ≥ σG, upper branch)
       E(σ) = EG − K·√(σ² − σG²)        (lower, inefficient branch)
   Slope dE/dσ = Kσ / √(σ² − σG²), which → ∞ at σG and → K as σ → ∞.
   The tangent CAL from (0, rf) touches at
       q* = K·σG² / (EG − rf),  σ* = √(σG² + q*²),  S = (E* − rf)/σ*.
   ------------------------------------------------------------------ */
const T3_FR = { SG: 20, EG: 9, K: 0.45, RF: 4 };
T3_FR.q = (s) => Math.sqrt(Math.max(s * s - T3_FR.SG * T3_FR.SG, 0));
T3_FR.up = (s) => T3_FR.EG + T3_FR.K * T3_FR.q(s);
T3_FR.dn = (s) => T3_FR.EG - T3_FR.K * T3_FR.q(s);
T3_FR.slope = (s) => T3_FR.K * s / Math.max(T3_FR.q(s), 1e-12);
T3_FR.qP = T3_FR.K * T3_FR.SG * T3_FR.SG / (T3_FR.EG - T3_FR.RF);
T3_FR.sP = Math.sqrt(T3_FR.SG * T3_FR.SG + T3_FR.qP * T3_FR.qP);
T3_FR.eP = T3_FR.up(T3_FR.sP);
T3_FR.S = (T3_FR.eP - T3_FR.RF) / T3_FR.sP;
T3_FR.A = 100 * T3_FR.S / T3_FR.sP;               // ½Aσ² utility ⇒ E = U + (A/200)σ²
T3_FR.ic = (A, U, s) => U + (A / 200) * s * s;    // indifference curve, σ in %

/* bilingual explanations shared by several figures */
const T3_EX = {
  upper: {
    z: '效率前緣的上枝：同一個風險水平上，沒有其他組合能給出更高報酬。理性投資者只會在這一段裡挑。',
    e: 'Upper branch of the frontier: at each risk level no other mix earns more, so rational investors pick only from here.'
  },
  lower: {
    z: '無效率的下枝：同一個風險水平上報酬更低，被上枝完全支配，所以沒有人會主動選它。',
    e: 'Inefficient lower branch: same risk, lower return — dominated by the upper branch, so nobody chooses it.'
  },
  gmv: {
    z: 'GMV=全域最小變異數組合：整條前緣上風險最低的點，也是上枝與下枝的分界；σ=20%、E=9%。',
    e: 'GMV, the global minimum-variance portfolio: the lowest-risk point of the frontier and the join of its two branches.'
  },
  feasible: {
    z: '可行集合：所有由這兩項資產按不同權重組成的組合，都在這條曲線上（而非曲線內部）。',
    e: 'Feasible set: every weighted mix of the two assets sits on this curve, not inside it.'
  }
};

/* sampling grid: uniform i=0..N plus the exact labelled nodes */
function T3_grid(lo, hi, N, extra) {
  const a = [];
  for (let i = 0; i <= N; i++) a.push(lo + (hi - lo) * i / N);
  (extra || []).forEach((v) => a.push(v));
  a.sort((p, q) => p - q);
  return a;
}

/* axes + ticks + grid; declares the plot region and returns scalers */
function T3_axes(c, o) {
  const S = c.plot({
    x0: o.x0, x1: o.x1, y0: o.y0, y1: o.y1,
    xmin: o.xmin, xmax: o.xmax, ymin: o.ymin, ymax: o.ymax,
    labelX: o.xlab || null, labelY: o.ylab || null,
    unitX: o.xu == null ? '%' : o.xu,
    unitY: o.yu == null ? '%' : o.yu,
    decX: o.dx == null ? 1 : o.dx,
    decY: o.dy == null ? 1 : o.dy
  });
  const X = (v) => S.X(v);
  const Y = (v) => S.Y(v);
  if (o.grid) {
    (o.xticks || []).forEach((v) => c.line(X(v), o.y0, X(v), o.y1, { stroke: PAL.grid, sw: 0.8 }));
    (o.yticks || []).forEach((v) => c.line(o.x0, Y(v), o.x1, Y(v), { stroke: PAL.grid, sw: 0.8 }));
  }
  c.line(o.x0, o.y1, o.x1, o.y1, { stroke: PAL.ink, sw: 1.3 });
  c.line(o.x0, o.y0, o.x0, o.y1, { stroke: PAL.ink, sw: 1.3 });
  (o.xticks || []).forEach((v) => {
    c.line(X(v), o.y1, X(v), o.y1 + 4, { stroke: PAL.ink, sw: 1.1 });
    c.text(X(v), o.y1 + 15, o.xfmt ? o.xfmt(v) : String(v), { size: 9.6, fill: PAL.soft });
  });
  (o.yticks || []).forEach((v) => {
    c.line(o.x0 - 4, Y(v), o.x0, Y(v), { stroke: PAL.ink, sw: 1.1 });
    c.text(o.x0 - 7, Y(v) + 3.3, o.yfmt ? o.yfmt(v) : String(v), { size: 9.6, fill: PAL.soft, anchor: 'end' });
  });
  if (o.xlab) c.text((o.x0 + o.x1) / 2, o.y1 + 34, o.xlab, { size: 10.4, fill: PAL.soft });
  if (o.ylab) c.text(o.x0 - 40, o.y0 - 12, o.ylab, { size: 10.4, fill: PAL.soft, anchor: 'start' });
  return { X, Y, S };
}

/* the standard bullet: upper branch solid, lower branch dashed, GMV ringed */
function T3_bullet(c, A, o) {
  const X = A.X, Y = A.Y, S = A.S;
  const N = 320;
  const sTop = Math.sqrt(Math.pow((o.eMax - T3_FR.EG) / T3_FR.K, 2) + T3_FR.SG * T3_FR.SG);
  const sLo = Math.sqrt(Math.pow((T3_FR.EG - (o.eMin || 0)) / T3_FR.K, 2) + T3_FR.SG * T3_FR.SG);
  const upS = T3_grid(T3_FR.SG, Math.min(sTop, o.sMax), N, o.extra);
  const dnS = T3_grid(T3_FR.SG, Math.min(sLo, o.sMax), N, o.extra);
  if (o.fill) {
    const u = upS.map((s) => [X(s), Y(T3_FR.up(s))]);      // GMV → top
    const d = dnS.map((s) => [X(s), Y(T3_FR.dn(s))]);      // GMV → bottom
    const uEnd = u[u.length - 1], dEnd = d[d.length - 1];
    const dStr = 'M ' + dEnd[0] + ' ' + dEnd[1]
      + ' L ' + o.x1 + ' ' + dEnd[1]
      + ' L ' + o.x1 + ' ' + (o.yTop == null ? uEnd[1] : o.yTop)
      + ' L ' + uEnd[0] + ' ' + (o.yTop == null ? uEnd[1] : o.yTop)
      + u.slice().reverse().map((p) => ' L ' + p[0] + ' ' + p[1]).join('')
      + d.map((p) => ' L ' + p[0] + ' ' + p[1]).join('')
      + ' Z';
    c.path(dStr, { fill: o.fill, opacity: o.fillOp == null ? 0.42 : o.fillOp });
  }
  c.series(S, { id: 'up', name: { z: '效率前緣（上枝）', e: 'efficient frontier (upper)' }, explain: T3_EX.upper },
    upS.map((s) => [s, T3_FR.up(s)]), { color: PAL.navy, sw: 2.6 });
  if (o.lower !== false) {
    c.series(S, { id: 'dn', name: { z: '無效率段（下枝）', e: 'inefficient branch (lower)' }, explain: T3_EX.lower },
      dnS.map((s) => [s, T3_FR.dn(s)]), { color: PAL.faint, sw: 1.7, dash: '5 4' });
  }
  if (o.gmv !== false) {
    c.circle(X(T3_FR.SG), Y(T3_FR.EG), 6.5, { stroke: PAL.red, sw: 1.5, fill: '#fff' });
    c.circle(X(T3_FR.SG), Y(T3_FR.EG), 2.4, { fill: PAL.red });
    c.spot(S, { id: 'gmv', name: { z: 'GMV 最小變異組合', e: 'GMV portfolio' }, explain: T3_EX.gmv,
      xv: T3_FR.SG, yv: T3_FR.EG, col: PAL.red }, T3_FR.SG, T3_FR.EG, { draw: false });
  }
  return { sTop, sLo, upS, dnS };
}

/* ============================================================
   0. 相關係數 → 曲線形狀（Slide p.13–15）
   同一對資產（Intel/Coca-Cola），只改 ρ
   ============================================================ */
function t3RhoShapes() {
  const c = CV(720, 430);
  const A = T3_axes(c, {
    x0: 92, x1: 660, y0: 62, y1: 356,
    xmin: 0, xmax: 55, ymin: 0, ymax: 30,
    xticks: [0, 10, 20, 30, 40, 50], yticks: [0, 5, 10, 15, 20, 25, 30],
    xfmt: (v) => v, yfmt: (v) => v, grid: true,
    xlab: { z: '標準差 σₚ（%）', e: 'Standard deviation σₚ (%)' },
    ylab: { z: 'E(Rₚ)（%）', e: 'E(Rₚ) (%)' }
  });
  const S = A.S, X = A.X, Y = A.Y;

  /* 同一對資產：Intel σ=50%、E=26%；Coca-Cola σ=25%、E=6% */
  const SA = 50, SB = 25, EA = 26, EB = 6;
  const sig = (w, r) => Math.sqrt(Math.max(
    w * w * SA * SA + (1 - w) * (1 - w) * SB * SB + 2 * w * (1 - w) * r * SA * SB, 0));
  const er = (w) => EA * w + EB * (1 - w);
  const curve = (r) => {
    const a = [];
    for (let i = 0; i <= 320; i++) { const w = i / 320; a.push([sig(w, r), er(w)]); }
    return a;
  };
  const wMin = (r) => {
    const v = (SB * SB - r * SA * SB) / (SA * SA + SB * SB - 2 * r * SA * SB);
    return Math.min(1, Math.max(0, v));
  };

  const rows = [
    { r: 1, col: PAL.faint, sw: 2.2, key: 'rho1',
      name: { z: 'ρ = +1：完全正相關', e: 'ρ = +1: perfect positive correlation' },
      ex: { z: '完全正相關：兩項資產同漲同跌，σₚ 只是加權平均，曲線退化成直線——分散完全失效，σ 永遠在 25% 與 50% 之間。', e: 'Perfect positive correlation: the assets move together, so σₚ is just a weighted average and the set collapses to a straight line — no diversification at all; σ never falls below 25%.' } },
    { r: 0.5, col: PAL.blue, sw: 1.9, key: 'rho05',
      name: { z: 'ρ = +0.5：高度正相關', e: 'ρ = +0.5: high positive correlation' },
      ex: { z: '高度正相關：曲線只微微向左凹，最小變異組合幾乎貼在可樂那一端（σ 只比 25% 低一點），分散效益有限。', e: 'High positive correlation: only a slight leftward bow; the minimum-variance mix sits almost at the Coke end, so diversification helps little.' } },
    { r: 0, col: PAL.navy, sw: 2.4, key: 'rho0',
      name: { z: 'ρ = 0：零相關（中性雙曲線）', e: 'ρ = 0: zero correlation (neutral hyperbola)' },
      ex: { z: '零相關：曲線是中性雙曲線，GMV 在 w_I = 20%、σ = 22.4%，已低於兩資產中較低風險的 25%——交叉項為 0 仍有分散效益。', e: 'Zero correlation: the neutral hyperbola; the GMV sits at w_I = 20%, σ = 22.4%, below the lower-risk asset at 25% — a zero cross term still diversifies.' } },
    { r: -0.5, col: PAL.violet, sw: 1.9, key: 'rhom05',
      name: { z: 'ρ = −0.5：中度負相關', e: 'ρ = −0.5: moderate negative correlation' },
      ex: { z: '中度負相關：曲線明顯向左凹，GMV 的風險降到 16.4%，同一報酬下可承擔更少風險。', e: 'Moderate negative correlation: the curve bows clearly left and the GMV risk drops to 16.4% — less risk for the same return.' } },
    { r: -1, col: PAL.red, sw: 2.4, key: 'rhom1',
      name: { z: 'ρ = −1：完全負相關（碰縱軸）', e: 'ρ = −1: perfect negative correlation (touches the axis)' },
      ex: { z: '完全負相關：曲線碰到縱軸。w_I = 1/3 時 σ = 0，可造出零風險組合，E ≈ 12.7%。', e: 'Perfect negative correlation: the curve touches the vertical axis. At w_I = 1/3, σ = 0 — a zero-risk portfolio with E ≈ 12.7%.' } }
  ];

  rows.forEach((d) => {
    c.series(S, { id: d.key, name: d.name, explain: d.ex }, curve(d.r), { color: d.col, sw: d.sw });
  });

  /* legend（左上空白區） */
  c.rect(100, 66, 196, 98, { fill: PAL.cream, opacity: 0.92, stroke: PAL.line, sw: 0.8, rx: 8 });
  const legend = ['ρ = +1（直線）', 'ρ = +0.5', 'ρ = 0（雙曲線）', 'ρ = −0.5', 'ρ = −1（碰縱軸）'];
  rows.forEach((d, i) => {
    const y = 84 + i * 17;
    c.line(110, y - 3.4, 126, y - 3.4, { stroke: d.col, sw: 2.2 });
    c.text(132, y, legend[i], { size: 9.4, fill: PAL.ink, anchor: 'start' });
  });

  /* 三個關鍵點：ρ=0 的 GMV、ρ=−1 的零風險組合 */
  const g0 = [sig(wMin(0), 0), er(wMin(0))];
  c.circle(X(g0[0]), Y(g0[1]), 5.4, { fill: '#fff', stroke: PAL.navy, sw: 1.6 });
  c.circle(X(g0[0]), Y(g0[1]), 2, { fill: PAL.navy });
  c.spot(S, { id: 'gmv0', col: PAL.navy, xv: g0[0], yv: g0[1],
    name: { z: 'ρ = 0 的 GMV：σ = 22.4%', e: 'GMV at ρ = 0: σ = 22.4%' },
    explain: { z: '零相關下的最小變異組合：w_I = 20%，σ = 22.4%、E = 10%。它比可樂自己的 25% 更低，差額就是分散效益。', e: 'Minimum-variance mix under zero correlation: w_I = 20%, σ = 22.4%, E = 10%. It beats Coke at 25% — that gap is the diversification benefit.' } },
    g0[0], g0[1], { draw: false });

  const gz = [0, er(wMin(-1))];
  c.circle(X(gz[0]), Y(gz[1]), 5.6, { fill: '#fff', stroke: PAL.red, sw: 1.8 });
  c.circle(X(gz[0]), Y(gz[1]), 2, { fill: PAL.red });
  c.spot(S, { id: 'zero', col: PAL.red, xv: gz[0], yv: gz[1],
    name: { z: '零風險組合：σ = 0', e: 'Zero-risk portfolio: σ = 0' },
    explain: { z: '只有 ρ = −1 才可能：w_I = 1/3 時 σ = 0，E ≈ 12.7%。注意它不是無風險資產（R_F = 4%），報酬仍來自風險資產。', e: 'Possible only when ρ = −1: at w_I = 1/3, σ = 0 and E ≈ 12.7%. It is not the risk-free asset (R_F = 4%) — its return still comes from risky assets.' } },
    gz[0], gz[1], { draw: false });

  /* 註解（只標兩個最容易被漏看的特徵，其餘交給 hover/點擊） */
  c.text(X(1.0), Y(2.5), 'ρ = −1 才能造出 σ = 0 的零風險組合', { size: 9.6, fill: PAL.red, anchor: 'start', weight: 600 });
  c.text(X(29), Y(2.5), 'ρ = +1：退化成直線，σ ≥ 25%', { size: 9.6, fill: PAL.soft, anchor: 'start' });
  c.text(X(0) - 9, Y(12.67) + 3.3, 'σ = 0', { size: 9.2, fill: PAL.red, anchor: 'end' });

  return c.out();
}
FIGS['d-rho-shapes'] = () => t3RhoShapes();

/* ============================================================
   3. 無異曲線與效率前緣的切點（最優風險組合）— A 可調
   ============================================================ */
function t3Ic(A) {
  const c = CV(720, 420);
  const ax = T3_axes(c, {
    x0: 92, x1: 660, y0: 52, y1: 352,
    xmin: 0, xmax: 55, ymin: 0, ymax: 32,
    xticks: [0, 10, 20, 30, 40, 50], yticks: [0, 4, 8, 12, 16, 20, 24, 28, 32],
    grid: true,
    xlab: { z: '標準差 σ（%）', e: 'Standard deviation σ (%)' },
    ylab: { z: 'E(R)（%）', e: 'E(R) (%)' }
  });
  const S = ax.S;
  T3_bullet(c, ax, { sMax: 54.4, eMax: 32, x1: 660 });

  /* the optimal risky portfolio for this risk aversion: slope of the IC
     equals the slope of the frontier, A·σ/100 = K·σ/√(σ²−σG²). */
  const sStar = Math.sqrt(T3_FR.SG * T3_FR.SG + Math.pow(100 * T3_FR.K / A, 2));
  const eStar = T3_FR.up(sStar);
  const U = eStar - (A / 200) * sStar * sStar;

  const ics = [
    { U: U - 3.6, lab: 'IC₁' },
    { U: U, lab: 'IC₂' },
    { U: U + 3.6, lab: 'IC₃' }
  ];
  const N = 260;
  ics.forEach((o, k) => {
    const sEnd = Math.sqrt(Math.max((32 - o.U) * 200 / A, 0.01));
    const s = T3_grid(2, Math.min(sEnd, 55), N, [sStar]);
    c.series(S, {
      id: 'ic' + k, color: PAL.violet, sw: k === 1 ? 2.4 : 1.9,
      name: { z: o.lab + '：效用 U = ' + o.U.toFixed(2), e: o.lab + ': utility U = ' + o.U.toFixed(2) },
      explain: {
        z: '無異曲線：U = E − (A/200)σ² 的等值線，同一條線上每個組合帶給投資者的效用相同。U 越高=越往外/往上。',
        e: 'An indifference curve: all mixes with the same utility U = E − (A/200)σ². Higher U sits higher up.'
      }
    }, s.map((v) => [v, T3_FR.ic(A, o.U, v)]), k === 1 ? { color: PAL.violet, sw: 2.4 } : { color: PAL.violet, sw: 1.9 });
    c.text(126, ax.Y(T3_FR.ic(A, o.U, 4.4)) - 3, o.lab, { size: 10, fill: PAL.violet, anchor: 'start', weight: 700 });
  });

  /* exact tangency */
  const tS = T3_FR.slope(sStar);
  const iS = A * sStar / 100;
  c.circle(ax.X(sStar), ax.Y(eStar), 6.2, { stroke: PAL.gold, sw: 2, fill: '#fff' });
  c.circle(ax.X(sStar), ax.Y(eStar), 2.2, { fill: PAL.gold });
  c.spot(S, {
    id: 'pstar', col: PAL.gold,
    name: { z: 'P*：A = ' + A.toFixed(2) + ' 時的最優風險組合', e: 'P*: optimal risky portfolio at A = ' + A.toFixed(2) },
    explain: {
      z: '切點=無異曲線與前緣斜率相等的位置：E′ = A·σ/100 = ' + iS.toFixed(3) + '，前緣斜率 = ' + tS.toFixed(3) + '。A 越大（越怕風險），切點越靠左、σ* 越小。',
      e: 'Tangency: the indifference curve slope A·σ/100 equals the frontier slope K·σ/√(σ²−σG²). A larger A moves P* left.'
    },
    xv: sStar, yv: eStar
  }, sStar, eStar, { draw: false });
  c.text(452, 348, { z: 'P*=IC₂ 與效率前緣的切點', e: 'P* = where IC₂ touches the efficient frontier' }, { size: 9, fill: PAL.amber, anchor: 'start', weight: 600 });

  /* utility arrow */
  c.arrow(118, 150, 148, 120, { stroke: PAL.violet, sw: 1.3 });
  c.text(156, 116, { z: '效用遞增', e: 'higher utility' }, { size: 9.4, fill: PAL.violet, anchor: 'start' });

  /* analytic badge */
  c.text(452, 300, { z: '切點斜率', e: 'slope at the tangency' }, { size: 9, fill: PAL.soft, anchor: 'start' });
  c.text(452, 316, 'E′=' + tS.toFixed(4) + ' = IC′=' + iS.toFixed(4), { size: 9, fill: PAL.amber, anchor: 'start', mono: true });
  c.text(452, 332, 'A=' + A.toFixed(2) + '  σ*=' + sStar.toFixed(1) + '%  E*=' + eStar.toFixed(1) + '%', { size: 9, fill: PAL.soft, anchor: 'start', mono: true });
  return c.out();
}
FIGS['d-ic'] = () => t3Ic(PARAMS['d-ic'].def.A);
PARAMS['d-ic'] = {

  def: { A: 1.25 },
  build: (v) => t3Ic(v.A)
};

  const S = ax.S;
  T3_bullet(c, ax, { sMax: 55, eMax: 30, x1: 660 });

  const RF = T3_FR.RF;
  const mFlat = (T3_FR.EG - RF) / T3_FR.SG;                 // through the GMV
  const mSteep = 0.75;

  c.series(S, { id: 'cal-flat', color: PAL.faint, sw: 1.8,

    explain: { z: 'P* 是市場上唯一的「最優風險組合」：所有投資者都持有它，差別只在把多少比例的資金放進去（分離定理）。',

  c.text(96, 326, { z: 'r_f = 4%', e: 'r_f = 4%' }, { size: 9.6, fill: PAL.soft, anchor: 'start' });

/* ============================================================
   7. 單指數模型與證券特性線 SCL（右圖 β 可調）
   ============================================================ */
function t3Scl(BE) {
  const c = CV(760, 380);
  const m = [-13, -10, -7, -4, -2, 0.5, 3, 5, 7, 10, 13, 15, -5.5, 8];
  const e = [3.2, -2.1, 1.8, -2.6, 1.2, 0.8, -1.4, 2.2, -0.6, -3.1, 2.4, -1.8, 3.0, 1.1];
  const AL = -0.3;

  const L = T3_axes(c, {
    x0: 70, x1: 372, y0: 64, y1: 308,
    xmin: -20, xmax: 20, ymin: -26, ymax: 30,
    xticks: [-20, -10, 0, 10, 20], yticks: [-20, -10, 0, 10, 20, 30],
    xlab: { z: '市場超額報酬 Rₘᵉ（%）', e: 'market excess return Rₘᵉ (%)' },
    ylab: { z: 'Rᵢᵉ（%）', e: 'Rᵢᵉ (%)' }
  });
  c.line(L.X(-20), L.Y(0), L.X(20), L.Y(0), { stroke: PAL.faint, sw: 1, dash: '3 3' });
  c.line(L.X(0), L.Y(-26), L.X(0), L.Y(30), { stroke: PAL.faint, sw: 1, dash: '3 3' });

  const BE0 = 1.566;
  const m0 = (-26 - AL) / BE0, m1 = (30 - AL) / BE0;
  c.series(L.S, { id: 'scl', color: PAL.navy, sw: 2.4,
    name: { z: 'SCL：證券特性線（斜率=β）', e: 'SCL: security characteristic line (slope β)' },
    explain: { z: '把個股超額報酬對市場超額報酬迴歸，得到的直線就是 SCL：截距 α 衡量「市場沒動時的超額表現」，斜率 β 衡量「市場每動 1%，個股動多少」。',
      e: 'Regressing the stock excess return on the market excess return gives the SCL: intercept α, slope β.' }
  }, [[m0, AL + BE0 * m0], [m1, AL + BE0 * m1]], { color: PAL.navy, sw: 2.4 });

  for (let i = 0; i < m.length; i++) {
    c.circle(L.X(m[i]), L.Y(AL + BE0 * m[i] + e[i]), 3.6, { fill: PAL.blue, opacity: 0.55 });
    c.spot(L.S, { id: 'sc' + i, col: PAL.blue, draw: false, marker: false,
      name: { z: '第 ' + (i + 1) + ' 個月的實際點', e: 'actual month ' + (i + 1) },
      explain: { z: '實際點偏離 SCL 的垂直距離就是殘差 e（非系統風險的部分）：市場超額報酬 ' + m[i] + '%，個股 ' + (AL + BE0 * m[i] + e[i]).toFixed(1) + '%。',
        e: 'The vertical gap from the SCL is the residual e — the firm-specific part. Market ' + m[i] + '%, stock ' + (AL + BE0 * m[i] + e[i]).toFixed(1) + '%.' },
      xv: m[i], yv: AL + BE0 * m[i] + e[i] }, m[i], AL + BE0 * m[i] + e[i]);
  }
  c.circle(L.X(0), L.Y(AL), 4.4, { stroke: PAL.red, sw: 1.8, fill: '#fff' });
  c.spot(L.S, { id: 'alpha', col: PAL.red, draw: false,
    name: { z: 'α = −0.3%（截距）', e: 'α = −0.3% (intercept)' },
    explain: { z: 'α 是市場超額報酬為 0 時個股的超額報酬：−0.3% 表示這段期間它比模型應有的表現差 0.3%，是選股/定價的殘餘。',
      e: 'At zero market excess return the stock earns −0.3%: it underperformed what the model predicts by 0.3%.' },
    xv: 0, yv: AL }, 0, AL);

  /* beta triangle: two points on the fitted line, m = -10 and m = +6 */
  const p1 = [L.X(-10), L.Y(AL - 10 * BE0)], p2 = [L.X(6), L.Y(AL + 6 * BE0)];
  c.line(p1[0], p1[1], p2[0], p1[1], { stroke: PAL.amber, sw: 1.1, dash: '4 3' });
  c.line(p2[0], p1[1], p2[0], p2[1], { stroke: PAL.amber, sw: 1.1, dash: '4 3' });

  c.text(112, 170, { z: 'α = −0.3%（截距）', e: 'α = −0.3% (intercept)' }, { size: 9.4, fill: PAL.red, anchor: 'start' });
  c.line(196, 175, 214, 190, { stroke: PAL.red, sw: 0.9 });
  c.text(206, 278, { z: 'ΔRₘᵉ = 16%', e: 'ΔRₘᵉ = 16%' }, { size: 9, fill: PAL.amber, anchor: 'start' });
  c.text(276, 200, { z: 'β = 1.566', e: 'β = 1.566' }, { size: 9.4, fill: PAL.amber, anchor: 'start', weight: 700 });
  c.text(368, 152, { z: 'SCL 斜率=β', e: 'SCL slope = β' }, { size: 9.6, fill: PAL.navy, anchor: 'end' });

  c.text(221, 362, { z: '左：Cisco 對 S&P500 的回歸（散點為教學示意）；β=ΔRᵢᵉ/ΔRₘᵉ', e: 'left: Cisco on the S&P 500 (points illustrative); β = ΔRᵢᵉ/ΔRₘᵉ' }, { size: 8.8, fill: PAL.faint });

  /* right: SCLs by beta, same alpha */
  c.line(412, 64, 412, 308, { stroke: PAL.line, sw: 1, dash: '2 4' });
  const R = T3_axes(c, {
    x0: 448, x1: 748, y0: 64, y1: 308,
    xmin: -1, xmax: 3, ymin: -2, ymax: 12,
    xticks: [0, 1, 2, 3], yticks: [0, 4, 8, 12],
    xlab: { z: 'Rₘᵉ（%）', e: 'Rₘᵉ (%)' },
    ylab: { z: 'Rᵢᵉ（%）', e: 'Rᵢᵉ (%)' }
  });
  c.line(R.X(-1), R.Y(0), R.X(3), R.Y(0), { stroke: PAL.faint, sw: 1, dash: '3 3' });
  c.line(R.X(0), R.Y(-2), R.X(0), R.Y(12), { stroke: PAL.faint, sw: 1, dash: '3 3' });
  c.text(470, R.Y(9.4), { z: '灰線：β=0.5/1/2 參考', e: 'grey: β = 0.5, 1, 2 reference' }, { size: 8.6, fill: PAL.faint, anchor: 'start' });
  [0.5, 1, 2].forEach((b) => {
    if (Math.abs(b - BE) < 0.05) return;                   // the live line below covers it
    const v0 = b * -1, v1 = b * 3;
    c.line(R.X(-1), R.Y(v0), R.X(3), R.Y(v1), { stroke: PAL.soft, sw: 1.4, opacity: 0.5 });
  });
  c.text(746, R.Y(5.0) - 6, 'β=2', { size: 8.6, fill: PAL.soft, anchor: 'end' });
  c.text(746, R.Y(1.6) - 6, 'β=0.5', { size: 8.6, fill: PAL.soft, anchor: 'end' });
  c.series(R.S, { id: 'scl-live', color: PAL.navy, sw: 2.6,
    name: { z: 'β = ' + BE.toFixed(2) + ' 的 SCL', e: 'SCL with β = ' + BE.toFixed(2) },
    explain: { z: 'β 越大，同樣的市場波動帶來越大的個股波動：β = ' + BE.toFixed(2) + ' 表示市場超額報酬每 1%，這檔股票平均動 ' + BE.toFixed(2) + '%。',
      e: 'A larger β amplifies market moves: β = ' + BE.toFixed(2) + ' means the stock moves ' + BE.toFixed(2) + '% per 1% of market excess return.' }
  }, [[-1, -BE], [3, 3 * BE]], { color: PAL.navy, sw: 2.6 });
  c.spot(R.S, { id: 'beta', col: PAL.navy, name: { z: '市場 +1% → 個股 +' + BE.toFixed(2) + '%', e: 'market +1% → stock +' + BE.toFixed(2) + '%' },
    explain: { z: '斜率就是 β。它決定這檔股票要求多少風險溢酬：CAPM 說 E = r_f + β×市場風險溢酬。',
      e: 'The slope is β, which sets the required risk premium: CAPM says E = r_f + β × market risk premium.' },
    xv: 1, yv: BE }, 1, BE);
  c.text(R.X(0.45) + 4, R.Y(BE * 0.45) - 9, 'β=' + BE.toFixed(2), { size: 9.4, fill: PAL.navy, anchor: 'start', weight: 700 });
  c.text(580, 362, { z: '同一 α=0、不同 β：斜率就是系統風險', e: 'same α = 0, different β: the slope is the systematic risk' }, { size: 8.8, fill: PAL.faint });
  return c.out();
}
FIGS['d-scl'] = () => t3Scl(PARAMS['d-scl'].def.be);
PARAMS['d-scl'] = {
  params: [{ k: 'be', z: 'β（斜率）', e: 'β (slope)', min: 0.2, max: 2.5, step: 0.05, dec: 2, def: 1.566 }],
  def: { be: 1.566 },

};

/* ============================================================
   9. 分離定理：同一個 P*，不同的 y
   ============================================================ */
FIGS['d-separation'] = () => {
  const c = CV(740, 430);
  const ax = T3_axes(c, {
    x0: 92, x1: 700, y0: 60, y1: 380,
    xmin: 0, xmax: 52, ymin: 0, ymax: 32,
    xticks: [0, 10, 20, 30, 40, 50], yticks: [0, 8, 16, 24, 32],
    grid: true,
    xlab: { z: '標準差 σ（%）', e: 'Standard deviation σ (%)' },
    ylab: { z: 'E(R)（%）', e: 'E(R) (%)' }
  });
  const S = ax.S;
  T3_bullet(c, ax, { sMax: 52, eMax: 32, x1: 700 });

  c.series(S, { id: 'cal', color: PAL.gold, sw: 2.6,
    name: { z: 'CAL：每個人都沿著它選 y', e: 'CAL: everyone picks y along this line' },
    explain: { z: '分離定理：風險組合 P* 由市場決定（人人相同），投資者只決定 y——把多少比例放進 P*、其餘放 r_f 或借入。y 決定你落在 CAL 的哪一點。',
      e: 'Separation: P* is the same for everyone; each investor only chooses y, the fraction in P*, moving along the CAL.' }
  }, [[0, T3_FR.RF], [52, T3_FR.RF + T3_FR.S * 52]], { color: PAL.gold, sw: 2.6 });

  /* two investors, same tangency, different y along the CAL */
  const inv = [
    { y: 1.15, col: PAL.violet, z: 'y = 1.15：較不懼風險，借錢加碼 P*', e: 'y = 1.15: less risk-averse, borrows to lever P*' },
    { y: 0.42, col: PAL.violet, z: 'y = 0.42：較怕風險，只把一部分放進 P*', e: 'y = 0.42: more risk-averse, holds a smaller slice of P*' }
  ].map((o) => {
    const s = o.y * T3_FR.sP;
    const e = T3_FR.RF + T3_FR.S * s;
    const A = 100 * T3_FR.S / s;                        // exact tangency at this y
    const U = e - (A / 200) * s * s;
    return Object.assign({}, o, { s, e, A, U });
  });

  inv.forEach((o, k) => {
    const sEnd = Math.sqrt(Math.max((32 - o.U) * 200 / o.A, 0.01));
    const ss = T3_grid(1.2, Math.min(sEnd, 52), 260, [o.s]);
    c.series(S, { id: 'ic' + (k + 1), color: PAL.violet, sw: 1.9,
      name: { z: '投資者 ' + (k + 1) + '：y=' + o.y.toFixed(2) + '、A=' + o.A.toFixed(2), e: 'investor ' + (k + 1) + ': y=' + o.y.toFixed(2) + ', A=' + o.A.toFixed(2) },
      explain: { z: '風險趨避程度 A = ' + o.A.toFixed(2) + ' 的無異曲線：它與 CAL 相切於 σ=' + o.s.toFixed(1) + '%、E=' + o.e.toFixed(2) + '% 的地方，也就是這位投資者選的 y=' + o.y.toFixed(2) + '。A 越大（越怕風險），切點越靠左、y 越小。',
        e: 'The indifference curve for A = ' + o.A.toFixed(2) + ' touches the CAL at σ=' + o.s.toFixed(1) + '%, E=' + o.e.toFixed(2) + '%, i.e. y=' + o.y.toFixed(2) + '. Larger A shifts the touch point left.' }
    }, ss.map((v) => [v, T3_FR.ic(o.A, o.U, v)]), { color: PAL.violet, sw: 1.9 });

    c.circle(ax.X(o.s), ax.Y(o.e), 5.4, { stroke: PAL.violet, sw: 2, fill: '#fff' });
    c.circle(ax.X(o.s), ax.Y(o.e), 2.1, { fill: PAL.violet });
    c.spot(S, { id: 'y' + (k + 1), col: PAL.violet, draw: false,
      name: { z: o.z, e: o.e },
      explain: { z: 'y = ' + o.y.toFixed(2) + ' 的完整組合：σ = y×σ* = ' + o.s.toFixed(1) + '%、E = r_f + y×(E*−r_f) = ' + o.e.toFixed(2) + '%。' + (o.y > 1 ? 'y > 1 代表以 r_f 借錢加碼（借入段）。' : 'y < 1 代表把部分資金放在無風險資產（貸出段）。'),
        e: 'A complete portfolio with y = ' + o.y.toFixed(2) + ': σ = ' + o.s.toFixed(1) + '%, E = ' + o.e.toFixed(2) + '%.' + (o.y > 1 ? ' y > 1 means borrowing at r_f.' : ' y < 1 means lending at r_f.') },
      xv: o.s, yv: o.e }, o.s, o.e, { draw: false });
  });

  c.circle(ax.X(T3_FR.sP), ax.Y(T3_FR.eP), 6.4, { stroke: PAL.gold, sw: 2.4, fill: '#fff' });
  c.circle(ax.X(T3_FR.sP), ax.Y(T3_FR.eP), 2.4, { fill: PAL.gold });
  c.spot(S, { id: 'pstar', col: PAL.gold, draw: false,
    name: { z: 'P*：大家共用同一個風險組合（σ=' + T3_FR.sP.toFixed(1) + '%、E=' + T3_FR.eP.toFixed(1) + '%）', e: 'P*: the same risky portfolio for everyone (σ=' + T3_FR.sP.toFixed(1) + '%, E=' + T3_FR.eP.toFixed(1) + '%)' },
    explain: { z: 'P* 是效率前緣的切點，也是市場組合的雛形：每個投資者的差別只在 y，不在「買什麼」。',
      e: 'P* is the tangency point and the seed of the market portfolio: investors differ in y, not in what they hold.' },
    xv: T3_FR.sP, yv: T3_FR.eP }, T3_FR.sP, T3_FR.eP, { draw: false });

  const a = inv[0], b = inv[1];
  c.text(ax.X(a.s) - 14, ax.Y(a.e) - 12, { z: 'y = ' + a.y.toFixed(2) + '（較不懼風險）→ 借入', e: 'y = ' + a.y.toFixed(2) + ' (less risk-averse) → borrow' }, { size: 9.4, fill: PAL.violet, anchor: 'end', weight: 600 });
  c.text(ax.X(a.s) - 14, ax.Y(a.e) + 2, { z: 'σ=' + a.s.toFixed(1) + '%、E=' + a.e.toFixed(1) + '%', e: 'σ=' + a.s.toFixed(1) + '%, E=' + a.e.toFixed(1) + '%' }, { size: 9, fill: PAL.soft, anchor: 'end' });
    

  c.text(ax.X(T3_FR.SG) + 10, ax.Y(T3_FR.EG) + 16, 'GMV', { size: 9, fill: PAL.red, anchor: 'start', weight: 700 });
  c.text(560, 186, { z: 'P*：同一個風險組合', e: 'P*: the same risky portfolio' }, { size: 9.8, fill: PAL.amber, anchor: 'start', weight: 600 });
  c.text(560, 200, { z: '（人人持有，只差比例）', e: '(same assets, different weight)' }, { size: 8.8, fill: PAL.soft, anchor: 'start' });

  c.text(100, 352, { z: '分離定理：P* 由市場決定', e: 'separation: P* is set by the market' }, { size: 9.4, fill: PAL.navy, anchor: 'start' });
  c.text(100, 368, { z: '你只決定 y（沿 CAL 借或貸）：例 y=1.15 借入、y=0.42 貸出', e: 'you only choose y: e.g. y = 1.15 borrows, y = 0.42 lends' }, { size: 9.4, fill: PAL.soft, anchor: 'start' });
  return c.out();
};


/* ===== figs-t4.js ===== */
/* ------------------------------------------------------------
   figs-t4.js — Topic 4 diagrams
   All curves are sampled from explicit functions (≥200 points);
   every plotted point is a real function evaluation.
   Canvas width ≤ 760.

   Interaction: every figure declares a plot panel and registers its
   curves / points (c.series, c.spot) so hover reads exact values and a
   click opens the bilingual explanation. d-arb also has a slider: the
   mispricing Δ rebuilds the whole figure.
   ------------------------------------------------------------ */

/* shared helpers (no numeric data is hand-placed below) */
const T4H = {
  sml: (b, rf, mrp) => rf + b * mrp,            // E(r) = rf + β·MRP
  resid: (s, n) => s / Math.sqrt(n),            // σ(e_p) of an equal-weighted, independent book
  fx: (v, d) => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(d == null ? 1 : d) + '%',
  pc: (v, d) => v.toFixed(d == null ? 1 : d) + '%'
};

/* 1. 套利與一價定律：兩地價差 → 淨投資零 → 價格收斂
   滑桿：錯價幅度 Δ（B 的報價 − A 的報價），整張圖的數字與位置都跟著變 */
function t4Arb(gap) {
  const c = CV(720, 448);
  const PX = (p) => 66 + (p - 98) * 74.75;      // 價格 $98–$106 映射到 x 66–664
  const pA = 100, pB = pA + gap, sh = 1000;
  const live = (pB - pA) * sh;                  // 鎖住的無風險利潤
  const mid = (PX(pA) + PX(pB)) / 2;
  const pr = (v) => '$' + (Number.isInteger(v) ? v.toFixed(0) : v.toFixed(1));
  const dtxt = (v) => (Number.isInteger(v) ? v.toFixed(0) : v.toFixed(1));
  const money = (v) => (v < 0 ? '−$' : '+$') + Math.abs(v).toLocaleString('en-US');

  /* 互動座標：價格軸（x）+ 交易股數（y）；兩個圓點都落在「1 千股」這條水平線上 */
  const S = c.plot({
    x0: 66, x1: 664, y0: 258, y1: 318,
    xmin: 98, xmax: 106, ymin: 1, ymax: 2,
    labelX: { z: '價格（$/股）', e: 'price ($ a share)' },
    labelY: { z: '交易股數（千股）', e: 'shares traded (thousands)' },
    decX: 1, decY: 1
  });

  c.text(360, 28, { z: '同一檔股票、兩個交易所：買低賣高，淨投資為零卻鎖住 $' + live.toLocaleString('en-US'), e: 'One stock, two exchanges: buy low, sell high — zero net investment, $' + live.toLocaleString('en-US') + ' locked in' }, { size: 12, weight: 700 });

  /* --- 兩個交易所的報價卡 --- */
  const card = (x, head, px, col, note) => {
    c.rect(x, 48, 208, 112, { fill: '#fbf8ee', stroke: PAL.line, rx: 10 });
    c.text(x + 104, 72, head, { size: 10.5, fill: PAL.soft, weight: 600 });
    c.text(x + 104, 112, px, { size: 26, weight: 700, fill: col, serif: true });
    c.text(x + 104, 140, note, { size: 9.5, fill: PAL.faint });
  };
  card(56, { z: '交易所 A', e: 'Exchange A' }, pr(pA), PAL.green, { z: '價格偏低：買進', e: 'too cheap: buy here' });
  card(456, { z: '交易所 B', e: 'Exchange B' }, pr(pB), PAL.red, { z: '價格偏高：放空', e: 'too dear: sell here' });

  c.tag(360, 84, { z: '① A 買進', e: '① buy on A' }, { size: 10, color: PAL.green, fill: '#eef7f4', stroke: '#bfe6dd' });
  c.tag(360, 122, { z: '② B 放空', e: '② short on B' }, { size: 10, color: PAL.red, fill: '#fdeceb', stroke: '#f2c7c4' });

  /* --- 現金流帳：三欄 --- */
  c.rect(56, 172, 608, 80, { fill: '#ffffff', stroke: PAL.line, rx: 10 });
  c.line(258, 184, 258, 240, { stroke: PAL.line, sw: 1 });
  c.line(458, 184, 458, 240, { stroke: PAL.line, sw: 1 });
  c.text(157, 196, { z: '① 買進 1,000 股', e: '① buy 1,000 shares' }, { size: 9.5, fill: PAL.soft });
  c.text(157, 222, money(-pA * sh), { size: 14, weight: 700, fill: PAL.navy, serif: true });
  c.text(358, 196, { z: '② 放空 1,000 股', e: '② short 1,000 shares' }, { size: 9.5, fill: PAL.soft });
  c.text(358, 222, money(pB * sh), { size: 14, weight: 700, fill: PAL.red, serif: true });
  c.text(561, 196, { z: '③ 淨額=淨投資', e: '③ net of the two legs' }, { size: 9.5, fill: PAL.soft });
  c.text(561, 222, money(live), { size: 14, weight: 700, fill: PAL.green, serif: true });
  c.text(561, 242, { z: '淨投資 ≤ 0', e: 'net investment ≤ 0' }, { size: 8.5, fill: PAL.green });

  /* --- 收斂箭頭（價格軸上方）：兩邊一起往中間推 --- */
  c.arrow(PX(pA) + 12, 284, mid - 4, 284, { stroke: PAL.green, sw: 1.8, bend: [(PX(pA) + 12 + mid) / 2, 272] });
  c.arrow(PX(pB) - 12, 284, mid + 4, 284, { stroke: PAL.red, sw: 1.8, bend: [(PX(pB) - 12 + mid) / 2, 272] });
  c.text(mid, 266, { z: '套利買賣把價差推平', e: 'the arbitrage shuts the gap' }, { size: 9.5, fill: PAL.red, weight: 600 });

  /* --- 價格軸 --- */
  c.line(66, 318, 664, 318, { stroke: PAL.ink, sw: 1.3 });
  const ticks = [98, 100, 105];
  if (ticks.indexOf(pB) < 0) ticks.push(pB);
  ticks.sort((a, b) => a - b).forEach((p) => {
    c.line(PX(p), 318, PX(p), 323, { stroke: PAL.ink, sw: 1.1 });
    if (p === 98 || p === 105) c.text(PX(p), 338, '$' + p, { size: 9, fill: PAL.soft });
  });
  c.circle(PX(pA), 318, 5.5, { fill: PAL.green, stroke: '#fff', sw: 1.4 });
  c.circle(PX(pB), 318, 5.5, { fill: PAL.red, stroke: '#fff', sw: 1.4 });
  c.text(PX(pA), 308, pr(pA), { size: 10.5, weight: 700, fill: PAL.green });
  c.text(PX(pB), 308, pr(pB), { size: 10.5, weight: 700, fill: PAL.red });

  /* 價差尺寸線（軸下） */
  c.guide(PX(pA), 318, PX(pA), 352, PAL.faint);
  c.guide(PX(pB), 318, PX(pB), 352, PAL.faint);
  c.line(PX(pA), 350, PX(pB), 350, { stroke: PAL.soft, sw: 1.2 });
  c.line(PX(pA), 346, PX(pA), 354, { stroke: PAL.soft, sw: 1.2 });
  c.line(PX(pB), 346, PX(pB), 354, { stroke: PAL.soft, sw: 1.2 });
  c.text(mid, 368, { z: '價差 = $' + dtxt(pB - pA) + '/股 × 1,000 股 = $' + live.toLocaleString('en-US'), e: 'gap = $' + dtxt(pB - pA) + ' a share × 1,000 shares = $' + live.toLocaleString('en-US') }, { size: 9.5, fill: PAL.soft });

  c.text(360, 398, { z: '淨投資為零（甚至為負）+ 無風險利潤 → 這就是套利', e: 'zero (or negative) net investment + a risk-free profit — that is arbitrage' }, { size: 10.5, weight: 700, fill: PAL.ink });
  c.text(360, 418, { z: '一價定律：同一資產（同一現金流）在兩個市場必須同價', e: 'Law of One Price: one asset, one cash-flow stream, one price' }, { size: 9.5, fill: PAL.soft });
  c.text(360, 436, { z: 'APT 命題 ③：運作良好的市場不允許套利機會持續存在', e: 'APT proposition ③: well-functioning markets let no arbitrage persist' }, { size: 9, fill: PAL.faint });

  /* --- 兩條腿：註冊成可點的解說點（圓點已經畫好，只登記互動） --- */
  c.spot(S, {
    id: 'arb-a', col: PAL.green,
    name: { z: '交易所 A：$100 買進 1,000 股', e: 'Exchange A: buy 1,000 shares at $100' },
    explain: {
      z: '買腿：在比較便宜的 A 以 $100 買進 1,000 股，付出 $100,000。讀法：橫軸向右是更貴、向左是更便宜，A 落在 B 的左邊，所以資金由 A 流向 B。重要性在於這一步同時把 A 的價格往上推——套利自己就是收斂的力量，價格被推平後利潤就消失。',
      e: 'The buy leg: 1,000 shares at $100 on the cheaper exchange, costing $100,000. Reading it: the axis gets dearer to the right; A sits left of B, so the cash flows from A to B. Buying here is also what lifts A’s price — the arbitrage is itself the force that closes the gap, and with it the profit.'
    },
    xv: pA, yv: 1
  }, pA, 1, { draw: false });

  c.spot(S, {
    id: 'arb-b', col: PAL.red,
    name: { z: '交易所 B：$' + dtxt(pB) + ' 放空 1,000 股', e: 'Exchange B: short 1,000 shares at $' + dtxt(pB) },
    explain: {
      z: '賣腿：在比較貴的 B 以 $' + dtxt(pB) + ' 放空 1,000 股（借券賣出），立刻收到 $' + (pB * sh).toLocaleString('en-US') + '。放空不是看壞，而是「先把貴的賣掉、之後再買回」。兩腿合起來淨投資 ≤ 0，價差就是鎖住的利潤；B 被賣壓壓低、A 被買盤推高，最後同價。',
      e: 'The sell leg: short 1,000 shares at $' + dtxt(pB) + ' on the dearer exchange, collecting $' + (pB * sh).toLocaleString('en-US') + ' at once. Shorting here is not a bearish view — sell dear now, buy back later. The two legs need no net investment and lock in the gap; selling pushes B down, buying pushes A up, until they meet.'
    },
    xv: pB, yv: 1
  }, pB, 1, { draw: false });

  return c.out();
}
FIGS['d-arb'] = () => t4Arb(PARAMS['d-arb'].def.gap);
PARAMS['d-arb'] = {

/* 2. 複製組合與 α=0：SML 上方的 G 與它的複製組合 */
FIGS['d-mimic'] = () => {
  const c = CV(720, 400);
  const rf = 3, eM = 11, mrp = eM - rf;          // 自建例題 5 的參數

  const rRep = T4H.sml(bG, rf, mrp);              // 複製組合 = 3 + 0.7×8 = 8.6
  const alpha = rG - rRep;                        // +1.2
  const X = (b) => 108 + (b / 1.3) * 544;

  /* 網格 */

    c.line(X(b), 312, X(b), 317, { stroke: PAL.ink, sw: 1.1 });

  });
  c.line(108, 312, 656, 312, { stroke: PAL.ink, sw: 1.3 });
  c.line(108, 312, 108, 86, { stroke: PAL.ink, sw: 1.3 });
  c.text(378, 350, { z: 'β（對市場組合的曝險，無單位）', e: 'β (exposure to the market portfolio, unitless)' }, { size: 10, fill: PAL.soft });
  c.text(66, 78, { z: 'E(r)（年化 %）', e: 'E(r) (annual, %)' }, { size: 10, fill: PAL.soft, anchor: 'start' });

  /* SML：由顯式函數取 240 點，登記成可讀值的曲線 */

    explain: {
      z: 'SML 是「一個 β 只能有一種要求報酬」的線：β=0 拿 3%、β=1 拿 11%，中間按比例。讀法：先找這檔股票的 β，往上看線的高度，就是它「應該」給你的報酬；點在線的上方=被低估（α>0），下方=被高估。',
      e: 'The SML says one β can command only one required return: 3% at β = 0, 11% at β = 1, linear in between. Read a stock’s β, look up to the line — that is what it ought to return. Above the line means underpriced (α > 0), below means overpriced.'
    }

  c.text(640, 54, { z: 'SML：E(r) = 3% + 8%×β', e: 'SML: E(r) = 3% + 8%×β' }, { size: 9.5, fill: '#8a6a1e', weight: 700, anchor: 'end' });

  /* 讀值虛線 */

  c.guide(108, Y(rG), X(bG), Y(rG), PAL.faint);

  c.text(360, 376, { z: 'α>0 ⇒ G 被低估；套利的買盤把 G 的價格推高，α 隨之消失', e: 'α > 0 ⇒ G is underpriced; arbitrage bids it up until α disappears' }, { size: 9.5, fill: PAL.soft });

  c.spot(S, {

    name: { z: 'r_f：β=0 的 3%', e: 'r_f: 3% at β = 0' },
    explain: {
      z: 'SML 的截距：β=0 表示完全不碰市場風險，此時只拿 3% 的時間價值（耐心與通脹補償）。它是所有「要求報酬」的起點——任何股票至少要有這 3%，之後才開始為風險加價。',
      e: 'The intercept of the SML: β = 0 means no market risk at all, so you earn only the 3% time value of money. Every required return starts here; only the part above 3% is payment for risk.'
    },
    xv: 0, yv: rf
  }, 0, rf, { draw: false });

  c.spot(S, {
    id: 'mim-rep', col: PAL.navy,
    name: { z: '複製組合：0.7 市場 + 0.3 T-bill = 8.6%', e: 'replica: 0.7 market + 0.3 T-bills = 8.6%' },
    explain: {
      z: '複製組合=0.7 的市場組合 + 0.3 的 T-bill：β 剛好也是 0.7，但沒有 α，所以要求報酬正好 8.6%。它是「G 應該值多少」的實物對照——放空 G、買進它，1.2% 就鎖住了，這也是為什麼 α 不能長期存在。',
      e: 'The replica — 0.7 in the market portfolio, 0.3 in T-bills — carries the same β = 0.7 but no α, so it earns exactly 8.6%. It is the physical benchmark for what G should cost: short G, buy this, and the 1.2% is locked in. That is why α cannot last.'
    },
    xv: bG, yv: rRep
  }, bG, rRep, { draw: false });

  c.spot(S, {
    id: 'mim-g', col: PAL.red,
    name: { z: 'G：β=0.7 卻給 9.8%（α=+1.2%）', e: 'G: β = 0.7 but earns 9.8% (α = +1.2%)' },
    explain: {
      z: 'G 的 β 只有 0.7，卻承諾 9.8%，比它應該給的 8.6% 多 ' + alpha.toFixed(1) + ' 個百分點——這就是 α。α>0 的意思是「同樣的系統性風險，你拿到更多報酬」，翻譯成價格就是「G 現在太便宜」。套利的買盤會把價格推高，α 隨之消失。',
      e: 'G has β = 0.7 yet promises 9.8%, ' + alpha.toFixed(1) + ' points above the 8.6% it should pay — that excess is α. α > 0 means more return for the same systematic risk, which in price terms means G is too cheap. Arbitrage bids it up and α fades.'
    },
    xv: bG, yv: rG
  }, bG, rG, { draw: false });

  return c.out();
};

  c.text(94, 60, { z: 'σ(eₚ)（%）', e: 'σ(eₚ) (%)' }, { size: 10, fill: PAL.soft, anchor: 'end' });

      z: '這條線是等權重、殘差彼此獨立時的殘差標準差：30% ÷ √n。讀法：往右是更多檔股票，往上/往下是殘差風險的大小。斜率一路變平——前 4 檔就砍掉一半，之後每多一檔能省下的愈來愈少。它壓下去的只有「特有風險」，市場風險 β 一格都沒少。',
      e: 'Residual risk of an equal-weighted book with independent residuals: 30% ÷ √n. Read right for more holdings, up and down for the size of the residual. The slope flattens quickly — the first four holdings halve it, each extra name saves less. Only the specific risk dies; market risk β does not move at all.'
    }

  c.text(528, 108, { z: 'n 變 4 倍，殘差只減半', e: 'quadruple n, halve the residual' }, { size: 9, fill: PAL.soft });
  c.text(528, 126, { z: '分散掉的是 e，不是 β 風險', e: 'what dies is e, never the β risk' }, { size: 9, fill: PAL.red });

  c.text(360, 332, { z: '充分分散（n 大、權重小）⇒ eₚ → 0 ⇒ Rₚᵉ = αₚ + βₚ Rₘᵉ', e: 'well diversified (large n, small weights) ⇒ eₚ → 0 ⇒ Rₚᵉ = αₚ + βₚ Rₘᵉ' }, { size: 9.5, fill: PAL.soft });

  /* --- 四個可點的解說點 --- */
  const marks = [
    [1, 30, {
      z: '1 檔：殘差風險就是這檔股票自己的 30%，一點都沒分散掉。這是「以為買了一檔好股票就等於有一個組合」的代價——單一公司的壞消息沒有別人的好消息可以抵銷。',
      e: 'One holding: the full 30% of that single stock’s own risk, undiversified — the cost of mistaking one good stock for a portfolio. Its bad news has no other company’s good news to offset it.'
    }, 'n1'],
    [4, 15, {
      z: '4 檔：30% ÷ √4 = 15%。檔數變 4 倍、風險只減半——這就是 √n 的算術：分散有效，但邊際報酬遞減。實務上這一步的性價比最高。',
      e: 'Four holdings: 30% ÷ √4 = 15%. Quadruple the names, halve the risk — √n arithmetic. Diversification works, but with diminishing returns; in practice this first step buys the most.'
    }, 'n4'],
    [25, 6, {
      z: '25 檔：30% ÷ 5 = 6%。這在實務上已經算「夠分散」：再往上加，曲線幾乎躺平，而研究成本、交易成本、追蹤誤差還在增加。',
      e: 'Twenty-five holdings: 30% ÷ 5 = 6%. In practice this is already diversified enough; beyond it the curve is nearly flat while research, trading and tracking costs keep rising.'
    }, 'n25'],
    [100, 3, {
      z: '100 檔：30% ÷ 10 = 3%。剩下的殘差可以再壓，但永遠壓不到 0 以下——真正壓不掉、也不該壓掉的是市場風險 β，那才是會要求報酬的風險。',
      e: 'A hundred holdings: 30% ÷ 10 = 3%. The residual can be pushed lower but never to zero — what remains, and must remain, is market risk β, the risk that actually earns a premium.'
    }, 'n100']
  ];
  marks.forEach((m) => {
    c.spot(S, {
      id: m[3], col: PAL.blue,
      name: { z: m[0] + ' 檔：σ(eₚ) = ' + m[1] + '%', e: m[0] + ' names: σ(eₚ) = ' + m[1] + '%' },
      explain: m[2], xv: m[0], yv: m[1]
    }, m[0], m[1], { draw: false });
  });

  return c.out();
};

/* 4. 二因子分解：r_f 4% + β₁×MRP₁ 3% + β₂×MRP₂ 6% = 13% */
FIGS['d-factor2'] = () => {
  const c = CV(720, 330);
  const rf = 4, e1 = 10, e2 = 12, b1 = 0.5, b2 = 0.75;
  const p1 = e1 - rf, p2 = e2 - rf;                 // 6% / 8%
  const t1 = b1 * p1, t2 = b2 * p2;                 // 3% / 6%
  const tot = rf + t1 + t2;                         // 13%

  c.text(360, 28, { z: '二因子 APT：要求報酬 = 無風險 + 兩份「β × 因子溢酬」', e: 'Two-factor APT: required return = risk-free + two «β × factor premium» terms' }, { size: 12, weight: 700 });

  const X0 = 100, W = 520;
  /* 互動座標：x 是累計要求報酬，y 是「這一段自己的值」（0–12 只為了把三個點放進柱身） */
  const S = c.plot({
    x0: X0, x1: X0 + W, y0: 78, y1: 134,
    xmin: 0, xmax: tot, ymin: 0, ymax: 12,
    labelX: { z: '累計要求報酬（%）', e: 'cumulative required return (%)' },
    labelY: { z: '這一段的值（%）', e: 'value of this segment (%)' },
    unitX: '%', unitY: '%', decX: 1, decY: 1
  });

  const segs = [
    { v: rf, label: { z: 'r_f', e: 'r_f' }, note: { z: '無風險', e: 'risk-free' }, fill: '#dfe6ef' },
    { v: t1, label: { z: 'β₁×λ₁', e: 'β₁×λ₁' }, note: { z: '0.5×6%', e: '0.5×6%' }, fill: PAL.goldL },
    { v: t2, label: { z: 'β₂×λ₂', e: 'β₂×λ₂' }, note: { z: '0.75×8%', e: '0.75×8%' }, fill: '#c9d8fb' }
  ];
  let x = X0, acc = 0;
  const mids = [];
  segs.forEach((s) => {
    const w = (s.v / tot) * W;
    c.rect(x, 78, w, 56, { fill: s.fill, stroke: '#fff', sw: 1.5, rx: 0 });
    c.text(x + w / 2, 102, s.label, { size: 10, fill: PAL.soft, weight: 600 });
    c.text(x + w / 2, 126, T4H.pc(s.v), { size: 15, weight: 700, fill: PAL.ink, serif: true });
    c.text(x + w / 2, 160, s.note, { size: 8.5, fill: PAL.faint });
    mids.push({ cum: acc + s.v / 2, v: s.v, lab: s.label, xm: x + w / 2 });
    x += w;
    acc += s.v;
  });
  c.text(X0 + W + 14, 108, T4H.pc(tot), { size: 20, weight: 700, fill: PAL.navy, anchor: 'start', serif: true });
  c.text(X0 + W + 14, 130, 'E(r_G)', { size: 9, fill: PAL.soft, anchor: 'start' });

  /* 累積刻度 */
  c.line(X0, 172, X0 + W, 172, { stroke: PAL.ink, sw: 1.2 });
  [0].concat([rf, rf + t1, tot]).forEach((v) => {
    const px = X0 + (v / tot) * W;
    c.line(px, 172, px, 177, { stroke: PAL.ink, sw: 1.1 });
    c.text(px, 190, v === 0 ? '0' : T4H.pc(v), { size: 9, fill: PAL.soft });
  });

  c.text(X0, 218, { z: 'E(r_G) = r_f + β₁[E(r_M1) − r_f] + β₂[E(r_M2) − r_f]', e: 'E(r_G) = r_f + β₁[E(r_M1) − r_f] + β₂[E(r_M2) − r_f]' }, { size: 10.5, anchor: 'start', fill: PAL.navy, weight: 600 });

  c.rect(X0, 236, W, 84, { fill: '#fbf8ee', stroke: PAL.line, rx: 9 });
  c.text(360, 258, { z: 'r_f = 4%；因子 1 溢酬 λ₁ = 10% − 4% = 6%；因子 2 溢酬 λ₂ = 12% − 4% = 8%', e: 'r_f = 4%; factor-1 premium λ₁ = 10% − 4% = 6%; factor-2 premium λ₂ = 12% − 4% = 8%' }, { size: 9, fill: PAL.ink });
  c.text(360, 280, { z: '每個因子都有一個「因子組合」：對該因子 β=1、對其他因子 β=0', e: 'each factor has a factor portfolio: β = 1 on that factor, β = 0 on the rest' }, { size: 9, fill: PAL.soft });
  c.text(360, 302, { z: '因子溢酬 = E(因子組合) − r_f，因此可以直接觀察（用指數或產業組合當代理）', e: 'factor premium = E(factor portfolio) − r_f, so it is directly observable via indices or sector portfolios' }, { size: 9, fill: PAL.soft });

  /* --- 三段各一個可點的解說點 --- */
  const ex = [
    {
      z: '第一段是無風險利率 4%：不承擔任何風險也拿得到，是整條堆疊的底座。讀法：從累計 0 走到 4%，這一段的寬度就是那 4 個百分點；它不會因為你多承擔風險而變大。',
      e: 'The first segment is the 4% risk-free rate — yours without taking any risk, the floor of the stack. Read it from cumulative 0 to 4%; its width is those four points, and it never grows with risk.'
    },
    {
      z: '第二段 3% = β₁ 0.5 × λ₁ 6%：承擔第一種系統性風險的報價。β₁ 加倍，這段就變 6%——段長直接反映曝險大小，而且可以單獨檢查：λ₁ 是市場給的價，β₁ 是你自己的選擇。',
      e: 'The second segment, 3% = β₁ 0.5 × λ₁ 6%, is the price of the first systematic risk. Double β₁ and it becomes 6%: the length is the exposure, and the two halves can be checked apart — λ₁ is the market’s price, β₁ your own choice.'
    },
    {
      z: '第三段 6% = β₂ 0.75 × λ₂ 8%。三段接起來的 13% 就是 E(r_G)：每一段都能單獨解釋、單獨檢查，這是多因子模型相對單因子最大的好處——不會把所有東西塞進一個 α。',
      e: 'The third segment, 6% = β₂ 0.75 × λ₂ 8%. Stacked, the three give E(r_G) = 13%, and each piece can be explained on its own — the great virtue of a multi-factor model over a single-factor one, which buries everything else in α.'
    }
  ];
  mids.forEach((m, i) => {
    c.spot(S, {
      id: 'fac' + (i + 1), col: [PAL.soft, PAL.gold, PAL.blue][i],
      name: { z: m.lab.z + ' 段：' + T4H.pc(m.v), e: m.lab.e + ' segment: ' + T4H.pc(m.v) },
      explain: ex[i], xv: m.cum, yv: m.v
    }, m.cum, m.v, { draw: false });
  });

  return c.out();
};

      e: 'The starting point: returns split into a common factor plus the stock’s own residual, Rᵢᵉ = αᵢ + βᵢRₘᵉ + eᵢ. Nothing is assumed about investors yet — no mean–variance preferences, no homogeneous expectations, no borrowing limits.'

/* ===== interact.js ===== */
/* ------------------------------------------------------------
   interact.js — the hands on top of every figure.

   Each registered figure carries a JSON sidecar (data-plot) on its <svg>,
   written by svgkit.js.  This file turns that sidecar into three things:

     1. hover  -> crosshair + exact readings of every curve at that x
     2. click  -> a bilingual explanation panel under the chart, anchored
                  on a named point or on the curve itself
     3. slider -> figures registered in PARAMS rebuild as the slider moves

   Plain DOM throughout: no libraries, no network.  With JS off the charts
   render exactly as they always did.
   ------------------------------------------------------------ */

const IX = (function () {
  const NS = 'http://www.w3.org/2000/svg';
  const BX = (z, e) => `<span class="only-zh">${z}</span><span class="only-en">${e}</span>`;
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const nm = (n, fallback) => {
    if (n && typeof n === 'object') return { z: n.z || '', e: n.e || n.z || '' };
    if (typeof n === 'string') return { z: n, e: n };
    return fallback || { z: '', e: '' };
  };

  const dec = (p, axis) => (axis === 'x' ? (p.dx == null ? 1 : p.dx) : (p.dy == null ? 1 : p.dy));
  const num = (v, d) => (isFinite(v) ? (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d) : '—');
  const readX = (p, v) => num(v, dec(p, 'x')) + (p.ux || '');
  const readY = (p, v) => num(v, dec(p, 'y')) + (p.uy || '');

  /* value of a sampled polyline at x, linearly interpolated */
  function at(pts, x) {
    if (!pts || !pts.length) return null;
    if (x <= pts[0][0]) return pts[0][1];
    const n = pts.length;
    if (x >= pts[n - 1][0]) return pts[n - 1][1];
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (pts[mid][0] <= x) lo = mid; else hi = mid;
    }
    const a = pts[lo], b = pts[hi];
    if (b[0] === a[0]) return a[1];
    return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
  }

  function wireFig(fig) {
    const id = fig.dataset.fig;
    const spec = PARAMS[id];
    const state = { vals: null, panel: null, hit: null };
    const capEl = fig.querySelector('figcaption');
    const capHTML = capEl ? capEl.outerHTML : '';
    const first = fig.querySelector('svg');
    if (!first) return;
    const baseSvg = first.outerHTML;
    state.vals = spec ? Object.assign({}, spec.def) : null;

    let tipEl = null;
    let cross = null;

    const hideTip = () => {
      if (tipEl) tipEl.classList.remove('on');
      if (cross) cross.setAttribute('opacity', '0');
    };

    function closePanel() {
      if (state.panel) {
        state.panel.classList.remove('on');
        state.panel.innerHTML = '';
      }
      fig.querySelectorAll('.ix-s.on, .ix-spot.on').forEach((el) => el.classList.remove('on'));
    }

    function controlsHTML() {
      if (!spec) return '';
      return '<div class="ix-ctl">' + spec.params.map((p) => {
        const v = state.vals[p.k];
        const show = p.fmt ? p.fmt(v) : num(v, p.dec == null ? 2 : p.dec) + (p.unit || '');
        return '<label class="ix-row" data-k="' + p.k + '">'
          + '<span class="ix-lb">' + BX(p.z, p.e) + '</span>'
          + '<input type="range" min="' + p.min + '" max="' + p.max + '" step="' + p.step
          + '" value="' + v + '" data-k="' + p.k + '" aria-label="' + esc(p.e) + '">'
          + '<output data-k="' + p.k + '">' + show + '</output></label>';
      }).join('') + '<button class="ix-reset" type="button">' + BX('重設', 'Reset') + '</button></div>';
    }

    function paint() {
      fig.innerHTML = (spec ? spec.build(state.vals) : baseSvg) + controlsHTML()
        + '<p class="ix-hint">' + BX('把滑鼠移進圖裡讀取數值；點擊曲線或圓點閱讀解釋。',
          'Move the pointer in the chart to read values; click a curve or a dot for its meaning.') + '</p>'
        + capHTML;
      tipEl = null;
      cross = null;
      state.panel = null;
      state.hit = null;
      setup(fig.querySelector('svg'));
      wireControls();
    }

    function wireControls() {
      if (!spec) return;
      const rb = fig.querySelector('.ix-reset');
      if (rb) rb.addEventListener('click', () => {
        spec.params.forEach((p) => { state.vals[p.k] = spec.def[p.k]; });
        paint();
      });
      fig.querySelectorAll('.ix-ctl input').forEach((inp) => {
        inp.addEventListener('input', () => {
          const k = inp.dataset.k;
          state.vals[k] = parseFloat(inp.value);
          const p = spec.params.find((x) => x.k === k);
          const out = inp.parentNode.querySelector('output');
          if (out) out.textContent = p.fmt ? p.fmt(state.vals[k])
            : num(state.vals[k], p.dec == null ? 2 : p.dec) + (p.unit || '');
          const old = fig.querySelector('svg');
          const box = document.createElement('div');
          box.innerHTML = spec.build(state.vals);
          old.replaceWith(box.firstElementChild);
          hideTip();
          closePanel();
          setup(fig.querySelector('svg'));
        });
      });
    }

    function openPanel(kind, item, p, xv, yv) {
      const cap = fig.querySelector('figcaption');
      if (!state.panel) {
        state.panel = document.createElement('div');
        state.panel.className = 'ix-panel';
        fig.insertBefore(state.panel, cap || null);
      }
      fig.querySelectorAll('.ix-s.on, .ix-spot.on').forEach((el) => el.classList.remove('on'));
      fig.querySelectorAll('[data-s="' + item.id + '"]').forEach((el) => el.classList.add('on'));

      const name = nm(item.n);
      const body = item.ex || {};
      const lx = p.lx || { z: 'x', e: 'x' };
      const ly = p.ly || { z: 'y', e: 'y' };
      const reading = kind === 'spot'
        ? '<p class="ix-read">' + BX('座標', 'Coordinates') + '：'
          + esc(lx.z) + ' = ' + esc(readX(p, item.xv)) + '，'
          + esc(ly.z) + ' = ' + esc(readY(p, item.yv)) + '</p>'
        : '<p class="ix-read">' + BX('此刻讀值', 'Reading here') + '：'
          + esc(lx.z) + ' = ' + esc(readX(p, xv)) + '，'
          + esc(ly.z) + ' = ' + esc(readY(p, yv)) + '</p>';

      state.panel.innerHTML = '<div class="ix-head"><span class="ix-dot" style="background:'
        + (item.col || 'var(--ink)') + '"></span><b class="ix-title">' + BX(name.z, name.e) + '</b>'
        + '<button class="ix-x" type="button" aria-label="close">×</button></div>'
        + '<div class="ix-body">' + BX(body.z || '', body.e || '') + reading + '</div>';
      state.panel.classList.add('on');
      state.panel.querySelector('.ix-x').addEventListener('click', closePanel);
    }

    function setup(svg) {
      if (!svg || !svg.dataset.plot) return;
      let meta;
      try { meta = JSON.parse(svg.dataset.plot); } catch (e) { return; }

      if (!tipEl) {
        tipEl = document.createElement('div');
        tipEl.className = 'ix-tip';
        fig.appendChild(tipEl);
      }
      cross = document.createElementNS(NS, 'g');
      cross.setAttribute('class', 'ix-cross');
      cross.setAttribute('opacity', '0');
      cross.innerHTML = '<line class="ix-v"></line><line class="ix-h"></line>';
      svg.appendChild(cross);

      const panels = meta.p.map((p) => {
        const o = Object.assign({}, p);
        o.X = (v) => o.x0 + (v - o.xmin) / (o.xmax - o.xmin) * (o.x1 - o.x0);
        o.Y = (v) => o.y1 - (v - o.ymin) / (o.ymax - o.ymin) * (o.y1 - o.y0);
        o.invX = (px) => o.xmin + (px - o.x0) / (o.x1 - o.x0) * (o.xmax - o.xmin);
        o.invY = (py) => o.ymin + (o.y1 - py) / (o.y1 - o.y0) * (o.ymax - o.ymin);
        o.series = meta.s.filter((s) => s.p === o.id);
        o.spots = meta.k.filter((s) => s.p === o.id);
        return o;
      });

      const toLocal = (evt) => {
        const m = svg.getScreenCTM();
        if (!m) return null;
        const pt = svg.createSVGPoint ? svg.createSVGPoint() : new DOMPoint();
        pt.x = evt.clientX; pt.y = evt.clientY;
        return pt.matrixTransform(m.inverse());
      };
      const scale = () => {
        const vb = svg.viewBox.baseVal;
        const r = svg.getBoundingClientRect();
        return r.width && vb && vb.width ? r.width / vb.width : 1;
      };
      const panelAt = (pt) => {
        let best = null, bestD = Infinity;
        panels.forEach((p) => {
          const dx = Math.max(p.x0 - pt.x, 0, pt.x - p.x1);
          const dy = Math.max(p.y0 - pt.y, 0, pt.y - p.y1);
          const d = Math.hypot(dx, dy);
          if (d < bestD) { bestD = d; best = p; }
        });
        return bestD < 90 ? best : null;
      };

      function track(evt) {
        if (!meta.p.length) return null;
        const pt = toLocal(evt);
        if (!pt) { hideTip(); return null; }
        const p = panelAt(pt);
        if (!p) { hideTip(); return null; }

        const span = p.xmax - p.xmin;
        const xv = Math.max(p.xmin + span * 1e-6, Math.min(p.xmax - span * 1e-6, p.invX(pt.x)));
        const k = scale();
        let near = null, nd = 16 / k;
        p.spots.forEach((sp) => {
          const d = Math.hypot(pt.x - sp.cx, pt.y - sp.cy);
          if (d < nd) { nd = d; near = sp; }
        });

        let rows, cy;
        if (!near && p.series.length === 0) { hideTip(); cross.setAttribute('opacity', '0'); return null; }
        if (near) {
          rows = [
            { col: near.col, n: p.lx || { z: 'x', e: 'x' }, v: readX(p, near.xv) },
            { col: near.col, n: p.ly || { z: 'y', e: 'y' }, v: readY(p, near.yv) }
          ];
          cy = near.cy;
        } else {
          rows = [];
          p.series.forEach((s) => {
            const yv = at(s.pts, xv);
            if (yv != null) rows.push({ col: s.col, n: nm(s.n), v: readY(p, yv), py: p.Y(yv) });
          });
          if (!rows.length) { hideTip(); return null; }
          const ref = rows.reduce((a, b) => (Math.abs(b.py - pt.y) < Math.abs(a.py - pt.y) ? b : a));
          cy = ref.py;
        }

        if (p.series.length === 0) { cross.setAttribute('opacity', '0'); }
        else {
        cross.querySelector('.ix-v').setAttribute('x1', near ? near.cx : p.X(xv));
        cross.querySelector('.ix-v').setAttribute('x2', near ? near.cx : p.X(xv));
        cross.querySelector('.ix-v').setAttribute('y1', p.y0);
        cross.querySelector('.ix-v').setAttribute('y2', p.y1);
        cross.querySelector('.ix-h').setAttribute('x1', p.x0);
        cross.querySelector('.ix-h').setAttribute('x2', p.x1);
        cross.querySelector('.ix-h').setAttribute('y1', cy);
        cross.querySelector('.ix-h').setAttribute('y2', cy);
        cross.setAttribute('opacity', '1');
        }

        const head = near
          ? '<div class="ix-th"><span class="ix-dot" style="background:' + near.col + '"></span><b>'
            + BX(esc(nm(near.n).z), esc(nm(near.n).e)) + '</b></div>'
          : '<div class="ix-th">' + BX(esc(p.lx ? p.lx.z : 'x'), esc(p.lx ? p.lx.e : 'x')) + ' = <b>' + esc(readX(p, xv)) + '</b></div>';
        tipEl.innerHTML = head + rows.map((r) => '<div class="ix-tr"><span class="ix-sw" style="background:'
          + r.col + '"></span><span class="ix-l">' + BX(esc(r.n.z), esc(r.n.e)) + '</span><b>' + esc(r.v) + '</b></div>').join('');
        tipEl.classList.add('on');
        fig.classList.add('ix-used');

        const rect = fig.getBoundingClientRect();
        const localX = evt.clientX - rect.left;
        const right = localX + 16 + tipEl.offsetWidth > rect.width - 8;
        tipEl.style.left = Math.min(Math.max(6, right ? localX - tipEl.offsetWidth - 16 : localX + 16),
          Math.max(6, rect.width - tipEl.offsetWidth - 6)) + 'px';
        tipEl.style.top = Math.min(Math.max(6, evt.clientY - rect.top - 14),
          Math.max(6, rect.height - tipEl.offsetHeight - 6)) + 'px';

        state.hit = { p, xv, near };
        return state.hit;
      }

      svg.addEventListener('pointermove', track);
      svg.addEventListener('pointerleave', hideTip);
      svg.addEventListener('pointerdown', (evt) => { if (evt.pointerType === 'touch') track(evt); });
      svg.addEventListener('pointercancel', hideTip);

      svg.addEventListener('click', (evt) => {
        const hit = track(evt);
        if (!hit) { closePanel(); return; }
        const { p, xv, near } = hit;
        if (near) { openPanel('spot', near, p, near.xv, near.yv); return; }
        const k = scale();
        const local = toLocal(evt);
        let best = null, bd = 14 / k;
        p.series.forEach((s) => {
          const yv = at(s.pts, xv);
          if (yv == null) return;
          const d = Math.abs(p.Y(yv) - local.y);
          if (d < bd) { bd = d; best = { s, yv }; }
        });
        if (best) openPanel('curve', best.s, p, xv, best.yv);
        else closePanel();
      });

      svg.addEventListener('keydown', (evt) => {
        if (evt.key !== 'Enter' && evt.key !== ' ') return;
        const g = evt.target && evt.target.closest ? evt.target.closest('.ix-spot') : null;
        if (!g) return;
        const sp = meta.k.find((x) => x.id === g.dataset.s);
        const p = sp && panels.find((x) => x.id === sp.p);
        if (sp && p) { evt.preventDefault(); openPanel('spot', sp, p, sp.xv, sp.yv); }
      });

      fig.onkeydown = (evt) => { if (evt.key === 'Escape') { closePanel(); hideTip(); } };
    }

    paint();
  }

  function wireAll(root) {
    (root || document).querySelectorAll('figure.fig[data-fig]').forEach((fig) => {
      if (fig.dataset.ix === '1') return;
      fig.dataset.ix = '1';
      try { wireFig(fig); } catch (e) { if (window.console) console.warn('figure', fig.dataset.fig, e); }
    });
  }

  return { wireAll: wireAll };
})();

function wireFigures() { IX.wireAll(document); }

          "z": "<b>1.8 股票市場為什麼重要（p.22–23）</b>　課件給四條傳導管道：① 股價透過<b>財富效果</b>影響消費，進而影響 <b>GDP</b>；② 股市是企業<b>籌資的來源</b>，市場繁榮時增發股票更容易；③ 股票佔<b>家庭財富的很大比重</b>；④ 股市<b>波動</b>提高不確定性，家庭與企業會<b>延後支出</b>。p.23 把<b>恒生指數</b>與<b>標普 500</b> 的每日收盤價（2000–2026）畫在一起：兩者長期同向，但短期差距可以很大——這就是「單一市場分散不掉」的<b>系統性風險</b>的視覺版。",
          "e": "<b>1.8 Why the stock market matters (p.22–23)</b>　Four channels: (1) share prices affect spending through a <b>wealth effect</b> and hence <b>GDP</b>; (2) the market is a <b>source of corporate funds</b>, and raising equity is easier in a boom; (3) equities are a <b>large share of household wealth</b>; (4) market <b>volatility</b> raises uncertainty, so households and firms <b>postpone spending</b>. p.23 plots daily closes of the <b>Hang Seng Index</b> against the <b>S&amp;P 500</b> (2000–2026): broadly co-moving over decades, yet capable of large short-run gaps — a visual of the <b>systematic risk</b> that no single market can diversify away.",

        }

          "t": "p",
          "z": "<b>1.9 股價指數：怎麼把很多價格變成一個數字（p.24–28）</b>　<b>股票指數（stock index）</b>=一組代表性股票價格的<b>平均</b>。它有三個用途：① 指數上升代表<b>大多數</b>股價上升（不是每一隻）；② 作為「市場組合（market portfolio）」的<b>代理變數</b>——Topic 3 的 CAPM 需要它；③ 用來<b>判定系統性風險</b>（哪一部分風險分散不掉）。",
          "e": "<b>1.9 Stock indexes: many prices into one number (p.24–28)</b>　A <b>stock index</b> is an <b>average</b> of the prices of a representative set of shares. Three uses: (1) a rising index means <b>most</b> prices rose (not every one); (2) it proxies the <b>market portfolio</b> — Topic 3’s CAPM needs it; (3) it is used to identify <b>systematic risk</b>, the part that cannot be diversified away.",

          "z": "<b>1.11 平均年報酬：算術平均 vs 幾何平均（p.34–39）</b>　<b>算術平均（AM）</b>=把各年報酬加起來除以年數 T；<b>幾何平均（GM）</b>=把它們複合成「每期固定成長率」再開 T 次方。<b>性質</b>：除非每一年報酬都相同，否則 <b>«§t{AM} > §t{GM}»</b>；兩者差距隨波動<b>變大</b>。課件 p.37–38 用 2005–2021 年（17 年）標普 500 的年度報酬：加總 <b>204.4</b>、«§t{AM} = §fr{204.4}{17} = 12.0235%»；複合因子 5.553826、«§t{GM} = 5.553826^{§fr{1}{17}} − 1 = 10.6113%»。$100 變成 <b>$555.38</b>——用 AM 去複利會得到 «100 §times 1.120235^{17} §approx $689»，<b>高估了</b>。",

        {
          "t": "p",
          "z": "<b>1.13 未來報酬：機率分佈、期望值與變異數（p.43–48）</b>　未來報酬用<b>機率分佈（probability distribution）</b>描述：每個可能結果 «R_i» 有一個機率 «p_i»，機率加總為 1。<b>期望報酬</b> «E(R) = §sum p_i R_i»；<b>變異數</b> = «§sum p_i [R_i − E(R)]^2»；<b>標準差</b> = 變異數開根號，單位與報酬相同，所以叫 <b>volatility</b>。",
          "e": "<b>1.13 Future returns: probability distributions (p.43–48)</b>　Future returns are described by a <b>probability distribution</b>: each outcome «R_i» has probability «p_i», and the probabilities sum to one. <b>Expected return</b> «E(R) = §sum p_i R_i»; <b>variance</b> = «§sum p_i [R_i − E(R)]^2»; the <b>standard deviation</b> is its root, in the same units as the return, hence the name <b>volatility</b>.",
          "lead": true
        },

          "e": "<b>1.14 Estimation error, standard error and 95% confidence intervals (p.49–55)</b>　A historical average is only an <b>estimate</b>; another sample would give another number. That uncertainty is <b>estimation error</b>. The <b>standard error (SE)</b> is the standard deviation of the sample mean itself — the spread of its <b>sampling distribution</b>: SE = SD of the data ÷ «§sqrt{n}», assuming yearly returns are <b>independent and identically distributed</b>.",
          "lead": true
        },
        {
          "t": "p",

          "e": "The 95% interval (p.52–54): «§t{mean} ± 1.96 §t{SE}», rounded in practice to <b>«±2 §t{SE}»</b>. The deck’s full example: <b>96 years</b>, mean <b>12.2%</b>, SD <b>19.7%</b> → <b>«§t{SE} = §fr{19.7}{§sqrt{96}} = 2.0106%»</b>; <b>«2 §times §t{SE} = 4.0212%»</b>; interval <b>«12.2 ± 4.0 = 8.2% §to 16.2%»</b>. Conclusion (p.55): <b>even 96 years of data cannot pin down the expected return</b> — an eight-point-wide interval, wider than the annual excess return most strategies deliver."

        "z": "3.13 CAPM 的實證失敗",
        "e": "3.13 Where the CAPM fails empirically"
      },
      "blocks": [
        {
          "t": "p",
          "z": "<b>3.13　CAPM 的實證失敗（p.66–68）</b>：① <b>忽略其他因子</b>：規模、帳面市值比、利率、政治事件都影響報酬。1926 年以來，小型股平均每年比大型股多 <b>3.7%</b>，價值股比成長股多 <b>5.2%</b>——這些都不是 β 能解釋的。② <b>β 難以估計</b>：要用歷史資料，且對「市場組合」的假設很敏感。③ <b>真正的市場組合無法觀察</b>：房地產、人力資本、私營企業都買不到，所以只能用股指期貨當代理。④ <b>假設太嚴</b>：同質預期、報酬常態分配都不現實。",
          "e": "<b>3.13　Where the CAPM fails empirically (p.66–68)</b>: (1) <b>It ignores other factors</b> — size, book-to-market, interest rates and political events all move returns. Since 1926 small stocks beat large ones by <b>3.7%</b> a year and value stocks beat growth stocks by <b>5.2%</b> — neither is explained by β. (2) <b>β is hard to estimate</b>: it needs history and is sensitive to the assumed market portfolio. (3) <b>The true market portfolio is unobservable</b>: real estate, human capital and private firms cannot be bought, so an index is used as a proxy. (4) <b>The assumptions are too strict</b>: homogeneous expectations and normal returns are unrealistic.",
          "lead": true
        }
      ],
      "idx": "3.13",
      "noHead": true

        <span class="k">${'ABCD'[k]}</span><span>${bi(o.z, o.e)}</span>
      </div>`).join('');
      return `<div class="q" id="q${i}">
        <div class="qh"><span class="bt ${T.id}">T${T.n}</span><span class="qn">${n}. ${bi(q.q.z, q.q.e)}</span></div>
        <div class="opts">${opts}</div>
        <div class="qfoot"><button class="btn" data-reveal="${i}">${bi('顯示答案', 'Show answer')}</button></div>
        <div class="ans" id="ans${i}"><span class="lbl">${bi('解析', 'Why')}</span>${bi(q.w.z, q.w.e)}</div>
      </div>`;
    }).join('');
    return `<h4 style="margin:24px 0 12px;font-family:var(--serif);font-size:18px">Topic ${T.n} · ${T.title.z} / ${T.title.e}</h4>${items}`;
  }).join('');

  return `<section class="sec" id="quiz">
    <div class="sec-head"><span class="idx">Q</span><h3>${bi('自測題庫', 'Self-test bank')}</h3></div>
    <div class="prose">
      <div class="quiz-summary">
        <span class="score"><span id="qScore">0</span> / <span id="qTotal">${QUIZ.length}</span></span>
        <span class="bar"><i id="qBar"></i></span>
        <button class="btn ghost" id="qReset">${bi('重新作答', 'Reset')}</button>
      </div>
      <p class="small only-zh">點選選項即可立即判定；答錯會顯示解析。做完一輪再回頭看錯題，效果最好。</p>
      <p class="small only-en">Click an option to mark it instantly; a wrong pick reveals the reasoning. Best used as a full pass, then a review of the misses.</p>
      ${groups}
    </div>
  </section>`;
}

        <span class="only-zh">　（若瀏覽器封鎖內嵌 PDF，請改用新分頁）</span><span class="only-en">　(If the browser blocks embedded PDFs, use the new tab)</span></p>
