<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投資學 Investments · CCBS 4024 學習網站</title>
<style>
/* ============================================================
   CCBS 4024 Investments — study site stylesheet
   Design: warm paper + deep navy sidebar + gold accent
   ============================================================ */

:root{
  --paper:#f7f5f0;
  --card:#ffffff;
  --ink:#14181f;
  --ink-soft:#3d4552;
  --muted:#6b7280;
  --line:#e6e1d6;
  --line-soft:#f0ece3;
  --navy:#0c1f34;
  --navy-2:#122c47;
  --gold:#b08d3e;
  --gold-soft:#f3ead6;
  --blue:#1d4ed8;
  --blue-soft:#eef3fe;
  --green:#0f766e;
  --green-soft:#e9f7f4;
  --red:#b91c1c;
  --red-soft:#fdeceb;
  --violet:#6d28d9;
  --serif:"Songti TC","Noto Serif TC","Source Han Serif TC",Georgia,"Times New Roman",serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sh:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.12);
  --side:268px;
  --toc:224px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:88px}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16.5px;line-height:1.75;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
img,svg{max-width:100%}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:#f5e3bd}

/* ---------------- reading progress ---------------- */
#progress{position:fixed;inset:0 0 auto 0;height:3px;background:transparent;z-index:200}
#progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#e0b657);transition:width .1s linear}

/* ---------------- shell ---------------- */
#app{display:grid;grid-template-columns:var(--side) minmax(0,1fr) var(--toc);gap:0}
@media (max-width:1240px){#app{grid-template-columns:var(--side) minmax(0,1fr)}#tocWrap{display:none}}
@media (max-width:900px){#app{grid-template-columns:minmax(0,1fr)}}

/* ---------------- sidebar ---------------- */
#side{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  background:linear-gradient(180deg,var(--navy) 0%,#0a1a2c 60%,#081624 100%);
  color:#cfd8e3;padding:22px 0 40px;z-index:60;
  border-right:1px solid rgba(255,255,255,.06);
}
#side::-webkit-scrollbar{width:8px}
#side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}
.brand{padding:0 22px 18px;border-bottom:1px solid rgba(255,255,255,.09);margin-bottom:14px}
.brand .code{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.brand h1{font-family:var(--serif);font-size:23px;line-height:1.25;margin:6px 0 2px;color:#fff;font-weight:700}
.brand .sub{font-size:12px;color:#8fa3bb;letter-spacing:.02em}

.navsearch{margin:0 16px 14px;position:relative}
.navsearch input{
  width:100%;padding:8px 10px 8px 30px;border-radius:9px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);color:#eaf0f7;font-size:13px;font-family:var(--sans);outline:none
}
.navsearch input::placeholder{color:#7b8ea8}
.navsearch input:focus{border-color:var(--gold);background:rgba(255,255,255,.1)}
.navsearch .ico{position:absolute;left:9px;top:7px;width:15px;height:15px;opacity:.55}

.navwrap{padding:0 12px}
.navgroup{margin-bottom:6px}
.navlink{
  display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;
  color:#c3cfdd;font-size:14px;line-height:1.4;cursor:pointer;transition:.15s;position:relative
}
.navlink:hover{background:rgba(255,255,255,.07);color:#fff;text-decoration:none}
.navlink.active{background:var(--gold);color:#1a1206;font-weight:700;box-shadow:0 6px 18px -8px rgba(176,141,62,.9)}
.navlink.active .num{background:rgba(0,0,0,.16);color:#fff}
.navlink .num{
  flex:0 0 auto;width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.12);
  font-family:var(--mono);font-size:11px;display:grid;place-items:center;color:#b9c8da;font-weight:600
}
.navlink .lbl{flex:1;min-width:0}
.navsub{margin:2px 0 8px 14px;padding-left:10px;border-left:1px solid rgba(255,255,255,.12);overflow:hidden;max-height:0;transition:max-height .28s ease}
.navgroup.open .navsub{max-height:520px}
.navsub a{
  display:block;padding:5px 9px;font-size:12.6px;color:#8fa3bb;border-radius:6px;
  line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.navsub a:hover{color:#fff;background:rgba(255,255,255,.06);text-decoration:none}
.navsub a.active{color:var(--gold);font-weight:600;background:rgba(176,141,62,.12)}
.navsec{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#6b809c;padding:12px 11px 5px;font-weight:700}
.sidefoot{margin:18px 16px 0;padding-top:14px;border-top:1px solid rgba(255,255,255,.09);font-size:11.5px;color:#6b809c;line-height:1.6}

/* ---------------- topbar (mobile + tools) ---------------- */
#topbar{
  position:sticky;top:0;z-index:55;display:flex;align-items:center;gap:12px;
  padding:10px 26px;background:rgba(247,245,240,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);grid-column:1/-1
}
#app>#topbar{grid-column:1/-1}
#topbar .crumb{font-size:12.5px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#topbar .crumb b{color:var(--ink-soft);font-weight:600}
.tbtn{
  border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:8px;
  padding:5px 10px;font-size:12.5px;font-family:var(--sans);cursor:pointer;display:inline-flex;
  align-items:center;gap:6px;transition:.15s
}
.tbtn:hover{border-color:var(--gold);color:var(--ink)}
.tbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.langsw{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.langsw button{
  border:0;background:transparent;padding:5px 11px;font-size:12.5px;font-family:var(--sans);
  color:var(--muted);cursor:pointer;transition:.15s;letter-spacing:.02em
}
.langsw button.on{background:var(--navy);color:#fff;font-weight:600}
#ham{display:none}
@media (max-width:900px){
  #ham{display:inline-flex}
  #side{position:fixed;left:0;top:0;width:288px;transform:translateX(-100%);transition:transform .25s ease;box-shadow:22px 0 60px -20px rgba(0,0,0,.5)}
  body.navopen #side{transform:none}
  body.navopen::after{content:"";position:fixed;inset:0;background:rgba(8,16,26,.45);z-index:50}
  #topbar{padding:9px 14px}
}

/* ---------------- main ---------------- */
#main{min-width:0;padding:34px 44px 90px;max-width:900px;justify-self:center;width:100%}
@media (max-width:900px){#main{padding:22px 18px 70px}}

/* hero */
.hero{
  position:relative;overflow:hidden;border-radius:18px;padding:34px 34px 30px;margin-bottom:34px;
  background:radial-gradient(120% 140% at 100% 0%,#17395c 0%,var(--navy) 55%,#081624 100%);color:#e9eef5;
  box-shadow:var(--sh)
}
.hero::after{
  content:"";position:absolute;right:-70px;top:-70px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(176,141,62,.35),transparent 65%)
}
.hero .kick{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.hero h1{font-family:var(--serif);font-size:clamp(24px,3.2vw,36px);line-height:1.28;margin:10px 0 8px;color:#fff;font-weight:700}
.hero p{margin:0;color:#a9bcd0;font-size:14.5px;line-height:1.7;max-width:62ch}
.hero .metas{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.hero .metas span{
  font-size:12px;padding:4px 11px;border-radius:99px;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.13);color:#cfdcea
}

/* topic header */
.topic-head{margin:0 0 26px;padding-top:8px;position:relative}
.topic-head .badge-num{
  font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--gold);
  text-transform:uppercase;display:flex;align-items:center;gap:10px
}
.topic-head .badge-num::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-soft),transparent)}
.topic-head h2{
  font-family:var(--serif);font-size:clamp(23px,2.6vw,31px);line-height:1.3;margin:10px 0 6px;font-weight:700;letter-spacing:-.01em
}
.topic-head .en{font-family:var(--sans);font-size:13.5px;color:var(--muted);letter-spacing:.03em}
.topic-head .lead{margin:14px 0 0;color:var(--ink-soft);font-size:15.5px}
.topic-head .lead p{margin:0 0 8px}

/* section */
section.sec{margin:0 0 44px;scroll-margin-top:86px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.sec-head .idx{
  font-family:var(--mono);font-size:12px;color:#fff;background:var(--navy);
  padding:3px 8px;border-radius:6px;letter-spacing:.06em;font-weight:600;flex:0 0 auto
}
.sec-head h3{font-family:var(--serif);font-size:21px;margin:0;font-weight:700;line-height:1.35;letter-spacing:-.005em}
.sec-head .en{font-size:12.5px;color:var(--muted);font-weight:400;font-family:var(--sans);letter-spacing:.02em}

/* prose */
.prose p{margin:0 0 14px;text-wrap:pretty}
.prose ul,.prose ol{margin:0 0 16px;padding-left:22px}
.prose li{margin:0 0 7px;text-wrap:pretty}
.prose li::marker{color:var(--gold)}
.prose b,.prose strong{font-weight:700;color:#000}
.prose .hl{background:linear-gradient(180deg,transparent 58%,#f7e6bd 58%);padding:0 1px;font-weight:600}
.mono{font-family:var(--mono);font-size:.92em;color:#243447;background:#f4f1e9;border:1px solid var(--line);border-radius:5px;padding:0 4px;white-space:nowrap}
.tbl td,.tbl th{font-variant-numeric:tabular-nums}
.kb{/* english keyword shown in zh mode */
  font-family:var(--sans);font-size:.86em;color:#7a6a45;background:var(--gold-soft);
  border:1px solid #e8dcc0;border-radius:5px;padding:0 5px;margin-left:4px;white-space:nowrap;font-weight:500
}
body.lang-en .kb{display:none}

/* term list */
.terms{display:grid;gap:12px}
.term{
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  box-shadow:0 1px 0 rgba(16,24,40,.02)
}
.term .t{font-weight:700;font-size:15.5px;margin-bottom:4px;display:flex;flex-wrap:wrap;align-items:baseline;gap:7px}
.term .t .zh{font-family:var(--serif);font-size:16.5px}
.term .t .en-t{font-family:var(--sans);font-size:12.5px;color:var(--gold);font-weight:600;letter-spacing:.02em;text-transform:none}
.term .d{color:var(--ink-soft);font-size:14.8px;line-height:1.7}
.term .d p{margin:0 0 6px}
.term .d p:last-child{margin:0}
.term.formula-term{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}

/* table */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 20px;font-size:14.5px}
.tbl th,.tbl td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl thead th{background:#f4f1e9;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:#5c5344;font-weight:700;white-space:nowrap}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#fcfaf4}
.tbl td.num,.tbl th.num{font-family:var(--mono);font-size:13.5px;text-align:right;white-space:nowrap}
.tbl .rowhead{font-weight:600;color:var(--ink);white-space:nowrap;min-width:88px}
@media (max-width:700px){.tbl th,.tbl td{padding:9px 11px;font-size:13.5px}.tbl .rowhead{min-width:0}}
.tbl-wrap{overflow-x:auto;margin-bottom:20px;border-radius:12px}
.tbl-wrap .tbl{margin:0;min-width:520px}

/* formula */
.formula{
  background:linear-gradient(180deg,#fdfbf4,#fbf8ee);border:1px solid #eae1cb;border-left:4px solid var(--gold);
  border-radius:12px;padding:16px 18px;margin:0 0 20px
}
.formula .fname{font-weight:700;font-size:14.5px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.formula .fname .n-en{font-size:12px;color:var(--gold);font-weight:600}
.math{font-family:"Times New Roman",var(--serif);font-size:1.32rem;line-height:2.05;color:#111;letter-spacing:.01em;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
@media (max-width:700px){.math{font-size:1.14rem;line-height:1.95;white-space:nowrap}}
.math i,.math .var{font-style:italic;font-family:"Times New Roman",Georgia,serif}
.math sub,.math sup{font-size:.62em;font-style:normal}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .16em;line-height:1.28;font-size:.94em}
.fr .num{display:block;padding:0 .34em}
.fr .den{display:block;border-top:1.4px solid currentColor;padding:0 .34em}
.sqrt{display:inline-flex;align-items:flex-start;line-height:1.1}
.sqrt>.sq{display:inline-block;border-top:1.3px solid currentColor;padding:1px .22em 0 .1em;margin-left:.02em}
.ovl{border-top:1.2px solid currentColor;padding-top:1px}

/* inline math: same compiler as display formulas, sized to sit in a sentence */
.im{font-family:"Times New Roman",var(--serif);font-size:1.04em;white-space:nowrap}
.im i,.im .var{font-style:italic;font-family:"Times New Roman",Georgia,serif}
.im sub,.im sup{font-size:.6em;font-style:normal;line-height:0}
.im .fr{font-size:.8em;vertical-align:middle;margin:0 .12em}
.im .fr .den{border-top-width:1.2px}
.im .sqrt>.sq{border-top-width:1.1px}
.im .sp2,.im .sp4,.im .sp6{display:inline-block;width:.28em}
.im .up,.up{font-style:normal}
.sp2{display:inline-block;width:.28em}
.sp4{display:inline-block;width:1.1em}
.sp6{display:inline-block;width:1.9em}
.vars{margin-top:11px;padding-top:10px;border-top:1px dashed #e3d8bd;font-size:13.6px;color:#4b4636;display:grid;gap:4px}
.vars .v{display:flex;gap:8px;align-items:baseline}
.vars .v .s{font-family:"Times New Roman",serif;font-style:italic;font-size:15px;min-width:26px;color:#7a5c1e;font-weight:600}
.vars .v .m{flex:1}
.fnote{margin-top:10px;font-size:13.6px;color:#5b5748;background:rgba(255,255,255,.6);border-radius:8px;padding:9px 12px;border:1px solid #ece3cd}
.fnote b{color:#7a5c1e}

/* figure */
figure.fig{margin:0 0 22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 10px;box-shadow:var(--sh)}
figure.fig svg{display:block;width:100%;height:auto}
figure.fig figcaption{margin-top:10px;font-size:12.8px;color:var(--muted);line-height:1.6;text-align:center;padding:0 10px 4px}
figure.fig figcaption b{color:var(--ink-soft);font-weight:600}

/* example */
.ex{
  background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 22px;overflow:hidden;
  box-shadow:0 1px 2px rgba(16,24,40,.03)
}
.ex-top{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:11px 16px;background:#f4f1e9;border-bottom:1px solid var(--line)}
.ex-top .no{font-family:var(--mono);font-size:11.5px;font-weight:700;color:#fff;background:var(--navy);padding:2px 8px;border-radius:6px;letter-spacing:.04em}
.ex-top .src{font-size:11.5px;color:#7a6a45;background:#fff;border:1px solid #e4d9bf;padding:1px 8px;border-radius:99px;font-family:var(--mono)}
.ex-top .ttl{font-weight:700;font-size:14.8px;flex:1;min-width:0}
.ex-body{padding:15px 17px}
.ex-q{margin:0 0 12px;color:var(--ink);font-size:15px}
.ex-q .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;display:block;margin-bottom:4px}
.ex-given{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 13px}
.ex-given span{font-family:var(--mono);font-size:12.5px;background:#f2f4f8;border:1px solid #e4e8f0;border-radius:6px;padding:2px 9px;color:#33405a}
ol.steps{margin:0 0 13px;padding:0;list-style:none;counter-reset:st}
ol.steps li{
  position:relative;padding:0 0 11px 34px;counter-increment:st;font-size:14.9px;line-height:1.7;color:var(--ink-soft)
}
ol.steps li::before{
  content:counter(st);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;
  background:var(--gold-soft);color:#7a5c1e;font-family:var(--mono);font-size:11.5px;font-weight:700;
  display:grid;place-items:center;border:1px solid #e8dcc0
}
ol.steps li:last-child{padding-bottom:0}
ol.steps li i{font-family:"Times New Roman",serif;font-size:1.06em}
ol.steps .calc{font-family:var(--mono);font-size:13.4px;background:#f7f8fb;border:1px solid #e8ecf4;border-radius:6px;padding:1px 7px;color:#1f2a44;white-space:nowrap;display:inline-block;margin:2px 0}
.ex-ans{
  background:var(--green-soft);border:1px solid #c7e8e0;border-radius:10px;padding:10px 13px;
  font-size:15px;color:#0b4f49;display:flex;gap:9px;align-items:flex-start
}
.ex-ans .k{font-weight:700;font-family:var(--mono);font-size:12px;letter-spacing:.1em;background:#0f766e;color:#fff;padding:1px 7px;border-radius:5px;flex:0 0 auto;margin-top:2px}
.ex-take{margin:12px 0 0;font-size:13.8px;color:#5b5748;background:#fbf8ee;border:1px dashed #e6dcc2;border-radius:9px;padding:9px 12px}
.ex-take b{color:#7a5c1e}

/* mistake */
.mis{display:grid;gap:0;margin:0 0 16px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:12px;overflow:hidden}
.mis-row{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:11px 15px;font-size:14.8px;align-items:flex-start}
.mis-row .mk{font-family:var(--mono);font-weight:700;font-size:13px;line-height:1.5;text-align:center}
.mis-row.bad{background:#fdf6f5;color:#7f1d1d}
.mis-row.bad .mk{color:var(--red)}
.mis-row.good{background:#f4fbf8;color:#0b4f49;border-top:1px dashed #d8ece7}
.mis-row.good .mk{color:var(--green)}
.mis-why{padding:9px 15px 11px 51px;font-size:13.6px;color:var(--muted);border-top:1px solid var(--line-soft);background:#fcfcfa}
.mis-why b{color:var(--ink-soft)}

/* tips */
.tips{display:grid;gap:10px;margin:0 0 18px}
.tip{
  display:grid;grid-template-columns:24px minmax(0,1fr);gap:11px;padding:12px 15px;font-size:14.8px;
  background:var(--blue-soft);border:1px solid #dbe4f8;border-radius:11px;color:#172554;line-height:1.7
}
.tip .i{font-size:14px;line-height:1.5}
.tip.warn{background:#fffaf0;border-color:#f2e3c4;color:#713f12}
.tip.good{background:var(--green-soft);border-color:#c7e8e0;color:#0b4f49}

/* callout */
.callout{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:13px 15px;border-radius:11px;margin:0 0 18px;font-size:14.8px;line-height:1.7}
.callout.info{background:var(--blue-soft);border:1px solid #dbe4f8;color:#1e3a8a}
.callout.warn{background:#fff8ea;border:1px solid #f0e2c0;color:#6b4708}
.callout.good{background:var(--green-soft);border:1px solid #c7e8e0;color:#0b4f49}
.callout .i{line-height:1.5}

/* two-col cards */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0 0 20px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.minicard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.minicard h5{margin:0 0 7px;font-size:14px;letter-spacing:.02em;color:var(--gold);font-weight:700;text-transform:none}
.minicard p{margin:0;font-size:14.4px;color:var(--ink-soft);line-height:1.7}

/* ---------------- TOC (right) ---------------- */
#tocWrap{position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 20px 40px 0;border-left:1px solid var(--line)}
#tocWrap::-webkit-scrollbar{width:6px}
#tocWrap::-webkit-scrollbar-thumb{background:#d9d2c2;border-radius:99px}

  display:block;font-size:12.8px;color:#6b7280;padding:3.5px 10px;border-left:2px solid transparent;

#toc a:hover{color:var(--ink);background:#fff;text-decoration:none}
#toc a.active{color:var(--navy);font-weight:600;border-left-color:var(--gold);background:#fff}

.quiz-summary .bar{flex:1;min-width:120px;height:7px;border-radius:99px;background:#eee9dd;overflow:hidden}
.quiz-summary .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#d8b45f);transition:width .3s}
.q{
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin:0 0 13px;
  box-shadow:0 1px 2px rgba(16,24,40,.03)

.bt.t1{background:#e8f0fe;color:#1d4ed8}.bt.t2{background:#e9f7f4;color:#0f766e}
.bt.t3{background:#f3e8ff;color:#6d28d9}.bt.t4{background:#fef3c7;color:#92400e}
.q .qn{font-size:15.2px;line-height:1.65;font-weight:500}

.opt:hover{background:#fcfaf4;border-color:#e0d6c0}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:700}
.opt.pick{border-color:var(--blue);background:#f5f8ff}
.opt.right{border-color:#5fbfa8;background:var(--green-soft)}
.opt.wrong{border-color:#e6a19c;background:var(--red-soft)}
.opt .k.right,.opt.right .k{color:var(--green)}
.qfoot{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.ans{display:none;margin-top:11px;padding:10px 13px;background:#fbf8ee;border:1px dashed #e6dcc2;border-radius:9px;font-size:14px;color:#4b4636;line-height:1.7}
.ans.show{display:block}
.ans .lbl{font-weight:700;color:#7a5c1e;margin-right:6px}

.card2 h4{margin:0 0 12px;font-family:var(--serif);font-size:17.5px}

  border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:8px;
  padding:6px 14px;font-size:13.5px;font-family:var(--sans);cursor:pointer;transition:.15s;
  display:inline-flex;align-items:center;gap:6px;text-decoration:none
}
.btn:hover{border-color:var(--gold);color:var(--ink);text-decoration:none}
.btn.active{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.btn.ghost{background:transparent}
.btn.solid{background:var(--navy);color:#fff;border-color:var(--navy)}

.openlink{margin:10px 0 0;font-size:13px;color:var(--muted)}

.foot{margin:46px 0 0;padding-top:18px;border-top:1px solid var(--line);font-size:12.4px;color:var(--muted);line-height:1.75;text-align:center}

  position:fixed;right:26px;bottom:26px;z-index:70;width:42px;height:42px;border-radius:50%;
  background:var(--navy);color:#fff;border:0;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 8px 24px -6px rgba(12,31,52,.5);opacity:0;pointer-events:none;transition:.2s;font-size:16px

.small{font-size:13px;color:var(--muted)}
.center{text-align:center}
.nowrap{white-space:nowrap}

/* ---------------- interactive figures ----------------
   figure.fig gains: crosshair, hover readout, click-to-explain panel,

  position:absolute;z-index:6;pointer-events:none;opacity:0;transition:opacity .12s;

  background:rgba(255,255,255,.97);border:1px solid #dfd8c8;

}
.ix-tip.on{opacity:1}
.ix-th{font-size:12px;color:var(--ink-soft);margin-bottom:4px;display:flex;align-items:center;gap:5px}

.ix-tr b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:650;color:var(--ink)}
.ix-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;color:var(--ink-soft)}
.ix-swatch,.ix-dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;display:inline-block}
.ix-sw{flex:0 0 auto;width:14px;height:3px;border-radius:2px;display:inline-block}
.ix-cross{pointer-events:none}
.ix-cross line{stroke:var(--gold);stroke-width:1;stroke-dasharray:3 4;opacity:.85}
.ix-s.on{stroke-width:3.4}
.ix-spot{cursor:pointer;outline:none}
.ix-spot.on circle:first-child{stroke-width:3.4}
.ix-spot:focus-visible circle:first-child{stroke:var(--gold);stroke-width:3.4}
.ix-hint{margin:9px 8px 2px;font-size:12.2px;color:var(--muted);text-align:center;transition:opacity .3s}
figure.fig.ix-used .ix-hint{opacity:0;height:0;margin:0;overflow:hidden}
.ix-ctl{
  display:grid;gap:7px;margin:12px 6px 4px;padding:10px 12px;border-radius:10px;
  background:#fbf9f3;border:1px solid var(--line-soft)
}
.ix-row{display:grid;grid-template-columns:minmax(96px,auto) 1fr 68px;align-items:center;gap:10px;font-size:12.6px;color:var(--ink-soft)}
.ix-lb{white-space:nowrap}
.ix-ctl input[type=range]{width:100%;accent-color:var(--gold);height:18px}
.ix-ctl output{font-variant-numeric:tabular-nums;text-align:right;font-weight:650;color:var(--gold);font-size:12.8px}
.ix-panel{
  display:none;margin:12px 2px 2px;padding:11px 14px 12px;border-radius:11px;
  background:#fbf9f3;border:1px solid var(--line-soft);border-left:3px solid var(--gold)
}
.ix-panel.on{display:block;animation:ixIn .18s ease-out}
@keyframes ixIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.ix-head{display:flex;align-items:center;gap:7px;font-size:13.4px}
.ix-title{font-weight:650;color:var(--ink)}
.ix-x{margin-left:auto;border:0;background:transparent;font-size:17px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:6px}
.ix-x:hover{background:#efe9dc;color:var(--ink)}
.ix-body{margin-top:7px;font-size:13.4px;line-height:1.8;color:var(--ink-soft)}
.ix-read{margin:8px 0 0;padding-top:7px;border-top:1px dashed #e3d9c3;font-size:12.6px;color:#7a6640}
@media (max-width:720px){
  .ix-row{grid-template-columns:1fr 1fr 72px;font-size:12.2px}
  .ix-lb{grid-column:1 / -1}
  .ix-tip{max-width:190px;font-size:11.4px}
}
@media print{
  .ix-ctl,.ix-hint,.ix-tip,.ix-cross{display:none!important}
  .ix-panel{display:block!important;break-inside:avoid}
}

.ix-reset{justify-self:end;border:1px solid var(--line);background:#fff;border-radius:7px;padding:2px 12px;
  font:12px/1.4 var(--sans);color:var(--muted);cursor:pointer;align-self:center}

}
.kplead:first-child{margin-top:4px}
section.sec + section.sec .kplead{margin-top:30px}

<body>
<div id="progress"><i></i></div>
<div id="app"></div>
<script>
/* ===== lib.js ===== */
/* ------------------------------------------------------------
   lib.js — escaping, bilingual helpers, math compiler, block renderers
   Bilingual strategy: both languages live in the DOM; <body class="lang-zh|lang-en">
   shows one and hides the other. This keeps SVG text equally switchable.
   ------------------------------------------------------------ */

const esc = (s) => String(s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');

/* inline bilingual word: 中文 + 英文關鍵詞（英文只在中英對照時顯示） */
function bi(z, e) {
  return `<span class="only-zh">${z}</span><span class="only-en">${e}</span>`;
}
/* 重點詞彙：中文 + 英文標註（繁中版顯示英文，英文版只顯示英文） */
function term(z, en) {
  return `<span class="only-zh">${z}</span><span class="only-en">${en}</span>`
    + `<span class="kb only-zh">${en}</span>`;
}

/* ---------------- math compiler ----------------
   syntax:
     \fr{a}{b}   fraction
     \t{text}    upright text
     _{sub} / _x subscript,  ^{sup} / ^x superscript
     latin runs and greek letters are italicised automatically
   ------------------------------------------------ */
const GREEK = 'αβγδεζηθικλμνξοπρστυφχψωΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ∑∏∂∆√∞≈≠≤≥±×÷·∈';

/* named commands → glyphs (looked up after reading the whole command word) */
const SYM = {
  sigma: '<i>σ</i>', rho: '<i>ρ</i>', mu: '<i>μ</i>', alpha: '<i>α</i>', beta: '<i>β</i>',
  gamma: '<i>γ</i>', delta: '<i>δ</i>', Delta: '<i>Δ</i>', epsilon: '<i>ε</i>', varepsilon: '<i>ε</i>',
  theta: '<i>θ</i>', lambda: '<i>λ</i>', pi: '<i>π</i>', tau: '<i>τ</i>', phi: '<i>φ</i>',
  psi: '<i>ψ</i>', omega: '<i>ω</i>', Omega: '<i>Ω</i>', Sigma: '<i>Σ</i>',
  approx: '≈', times: '×', cdot: '·', div: '÷', pm: '±', mp: '∓',
  leq: '≤', le: '≤', geq: '≥', ge: '≥', neq: '≠', ne: '≠',
  infty: '∞', propto: '∝', partial: '∂', nabla: '∇', angle: '∠', perp: '⊥',
  cdots: '⋯', ldots: '…', dots: '…', to: '→', rightarrow: '→', leftarrow: '←',
  in: '∈', notin: '∉', subset: '⊂', cup: '∪', cap: '∩',
  bullet: '•', prime: '′', therefore: '∴', because: '∵',
  Rightarrow: '⇒', Leftarrow: '⇐', Leftrightarrow: '⇔', iff: '⇔', mapsto: '↦',
  star: '⋆', dag: '†', equiv: '≡', sim: '∼', ll: '≪', gg: '≫', circ: '∘'
};

function math(src) {
  let i = 0;
  const n = src.length;
  function group() {           // expects src[i] === '{'
    let depth = 0, start = i + 1;
    while (i < n) {
      if (src[i] === '{') depth++;
      else if (src[i] === '}') { depth--; if (depth === 0) { const out = src.slice(start, i); i++; return out; } }
      i++;
    }
    return src.slice(start);
  }
  function seq() {
    let out = '';
    while (i < n) {
      const c = src[i];
      if (c === '}') break;
      if (c === '\\') {
        const m = /^\\([A-Za-z]+)/.exec(src.slice(i));
        if (m) {
          const name = m[1];
          const adv = m[0].length;
          if (name === 'fr' || name === 'frac' || name === 'dfrac') {
            i += adv; while (src[i] === ' ') i++;
            const a = group(); while (src[i] === ' ') i++;
            const b = group();
            out += `<span class="fr"><span class="num">${math(a)}</span><span class="den">${math(b)}</span></span>`;
            continue;
          }
          if (name === 't' || name === 'text' || name === 'mathrm' || name === 'operatorname') {
            i += adv; while (src[i] === ' ') i++;
            const a = group();
            out += `<span class="up">${esc(a)}</span>`;
            continue;
          }
          if (name === 'sqrt' || name === 'bar' || name === 'hat' || name === 'overline') {
            i += adv; while (src[i] === ' ') i++;
            const a = group();
            out += name === 'sqrt'
              ? `<span class="sqrt">√<span class="sq">${math(a)}</span></span>`
              : `<span class="ovl">${math(a)}</span>`;
            continue;
          }
          if (name === 'sum') { i += adv; out += '<i>∑</i>'; continue; }
          if (name === 'prod') { i += adv; out += '<i>∏</i>'; continue; }
          if (name === 'quad') { i += adv; out += '<span class="sp4"></span>'; continue; }
          if (name === 'qquad') { i += adv; out += '<span class="sp6"></span>'; continue; }
          if (name === 'left' || name === 'right' || name === 'big' || name === 'Big' ||
              name === 'displaystyle' || name === 'limits' || name === 'nolimits' || name === 'it') {
            i += adv; continue;
          }
          if (SYM[name] != null) { i += adv; out += SYM[name]; continue; }
          i += adv; continue;                       // unknown command → ignore the word
        }
        i++;                                        // \ followed by a single char
        const ch = src[i];
        if (ch === ',' || ch === ';' || ch === ':' || ch === ' ') { i++; out += '<span class="sp2"></span>'; continue; }
        if (ch === '!') { i++; continue; }
        if ('{}()%&#_$'.includes(ch)) { i++; out += esc(ch); continue; }
        out += esc(ch || ''); i++;
        continue;
      }
      if (c === '_' || c === '^') {
        const tag = c === '_' ? 'sub' : 'sup';
        i++;
        let body;
        if (src[i] === '{') body = group();
        else { body = src[i] || ''; i++; }
        out += `<${tag}>${math(body)}</${tag}>`;
        continue;
      }
      if (/[A-Za-z]/.test(c)) {
        let j = i; while (j < n && /[A-Za-z]/.test(src[j])) j++;
        const run = src.slice(i, j);
        // 保留常見函數名直立
        if (/^(Cov|Var|SD|AM|GM|Max|Min|and|or)$/.test(run)) out += `<span class="up">${run}</span>`;
        else out += `<i>${run}</i>`;
        i = j;
        continue;
      }
      if (GREEK.includes(c)) { out += `<i>${c}</i>`; i++; continue; }
      out += esc(c);
      i++;
    }
    return out;
  }
  return seq();
}

/* ---------------- inline math ----------------
   Anywhere in a bilingual string, wrap TeX in \( ... \) — e.g.
   \( \sigma_p = \sqrt{w^2\sigma_A^2+(1-w)^2\sigma_B^2} \)
   The same mini-compiler used for display formulas renders it, so a page uses
   one notation everywhere: HTML <sub>/<sup> only for non-mathematical text.
   ---------------------------------------------------------------- */
function tm(s) {
  if (s == null) return '';
  s = String(s);
  if (s.indexOf('«') < 0) return s;
  let out = '', i = 0;
  while (i < s.length) {
    const k = s.indexOf('«', i);
    if (k < 0) { out += s.slice(i); break; }
    const j = s.indexOf('»', k + 1);
    if (j < 0) { out += s.slice(i); break; }
    const inner = s.slice(k + 1, j);
    /* «…» is reused in older prose as English quotation marks (t4/quiz/app).
       Treat it as a quote, not math, when it has no TeX command and reads as
       words: spaces plus multi-letter Latin text. Math runs always contain a
       control word (§) or are pure notation. */
    if (inner.indexOf('§') < 0 && /[A-Za-z]{2,}/.test(inner) && /\s/.test(inner)) {
      out += s.slice(i, k) + '“' + inner + '”';
      i = j + 1;
      continue;
    }
    const tex = inner.replace(/§/g, '\\');
    out += s.slice(i, k) + `<span class="im">${math(tex)}</span>`;
    i = j + 1;
  }
  return out;
}

/* ---------------- block renderers ---------------- */
const T = (pair) => `${bi(tm(pair.z), tm(pair.e))}`;          // generic bilingual
const hp = (pair) => pair;                            // readability pass-through

function rbTable(b) {
  const heads = b.head.map((h, k) => `<th class="${(b.numCols || []).includes(k) ? 'num' : ''}">${T(h)}</th>`).join('');
  const rows = b.rows.map((r) => '<tr>' + r.map((cell, k) => {
    const obj = typeof cell === 'string' ? { z: cell, e: cell } : cell;
    const cls = (b.numCols || []).includes(k) ? 'num' : (k === 0 ? 'rowhead' : '');
    return `<td class="${cls}">${T(obj)}</td>`;
  }).join('') + '</tr>').join('');
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${heads}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function rbFormula(b) {
  const vars = (b.vars || []).map((v) =>
    `<div class="v"><span class="s">${math(v.s)}</span><span class="m">${T(v)}</span></div>`).join('');
  return `<div class="formula">
  <div class="fname">${T(b.name)}${b.en ? `<span class="n-en">${b.en}</span>` : ''}</div>
  <div class="math">${math(b.mt)}</div>
  ${vars ? `<div class="vars">${vars}</div>` : ''}
  ${b.note ? `<div class="fnote">${T(b.note)}</div>` : ''}
</div>`;
}

function rbFig(b) {
  const fn = FIGS[b.id];
  const svg = fn ? fn() : `<div class="small">[missing figure: ${b.id}]</div>`;
  return `<figure class="fig" data-fig="${b.id}">${svg}${b.cap ? `<figcaption>${T(b.cap)}</figcaption>` : ''}</figure>`;
}

function rbExample(b) {
  const given = (b.given || []).map((g) => `<span>${T(g)}</span>`).join('');
  const steps = (b.steps || []).map((s) => `<li>${s.raw ? s.raw : T(s)}</li>`).join('');
  return `<div class="ex">
  <div class="ex-top">
    <span class="no">EX ${b.no || ''}</span>
    ${b.src ? `<span class="src">${esc(b.src)}</span>` : ''}
    <span class="ttl">${T(b.title)}</span>
  </div>
  <div class="ex-body">
    <div class="ex-q"><span class="lab">${bi('題目', 'Question')}</span>${T(b.q)}</div>
    ${given ? `<div class="ex-given">${given}</div>` : ''}
    ${steps ? `<ol class="steps">${steps}</ol>` : ''}
    <div class="ex-ans"><span class="k">ANS</span><span>${T(b.ans)}</span></div>
    ${b.take ? `<div class="ex-take"><b>${bi('要點', 'Key point')}</b> ${T(b.take)}</div>` : ''}
  </div>
</div>`;
}

function rbMistake(b) {
  return `<div class="mis">
  <div class="mis-row bad"><span class="mk">✗</span><span>${T(b.wrong)}</span></div>
  <div class="mis-row good"><span class="mk">✓</span><span>${T(b.right)}</span></div>
  ${b.why ? `<div class="mis-why"><b>${bi('為什麼', 'Why')}</b> ${T(b.why)}</div>` : ''}
</div>`;
}

function rbTips(b) {
  const cls = b.kind === 'warn' ? ' warn' : b.kind === 'good' ? ' good' : '';
  const ic = b.kind === 'warn' ? '⚠' : b.kind === 'good' ? '✓' : '◆';
  return `<div class="tips">` + b.items.map((it) =>
    `<div class="tip${cls}"><span class="i">${ic}</span><span>${T(it)}</span></div>`).join('') + `</div>`;
}

function rbCallout(b) {
  const ic = b.kind === 'warn' ? '⚠' : b.kind === 'good' ? '✓' : 'ℹ';
  return `<div class="callout ${b.kind || 'info'}"><span class="i">${ic}</span><span>${T(b)}</span></div>`;
}

function rbTerms(b) {
  const cards = b.items.map((it) => `<div class="term">
    <div class="t"><span class="zh">${it.z}</span><span class="en-t only-zh">${it.en || ''}</span></div>
    <div class="d">${T(it.d)}</div>
  </div>`).join('');
  return `<div class="terms">${cards}</div>`;
}

function rbGrid(b) {
  return `<div class="grid2">` + b.items.map((it) =>
    `<div class="minicard"><h5>${T(it.h)}</h5><p>${T(it.p)}</p></div>`).join('') + `</div>`;
}

function renderBlock(b) {
  switch (b.t) {
    case 'p': return `<p${b.lead ? ' class="kplead"' : ''}>${T(b)}</p>`;
    case 'ul': return `<ul>${b.items.map((x) => `<li>${T(x)}</li>`).join('')}</ul>`;
    case 'ol': return `<ol>${b.items.map((x) => `<li>${T(x)}</li>`).join('')}</ol>`;
    case 'tbl': return rbTable(b);
    case 'f': return rbFormula(b);
    case 'fig': return rbFig(b);
    case 'ex': return rbExample(b);
    case 'mis': return rbMistake(b);
    case 'tips': return rbTips(b);
    case 'callout': return rbCallout(b);
    case 'terms': return rbTerms(b);
    case 'grid': return rbGrid(b);
    case 'hr': return '<div class="topic-divider"></div>';
    case 'raw': return b.html;
    default: return `<div class="small">[block ${b.t}]</div>`;
  }
}

/* wrap a list of blocks in .prose */
const renderBlocks = (blocks) => `<div class="prose">${blocks.map(renderBlock).join('')}</div>`;


/* ===== svgkit.js ===== */
/* ------------------------------------------------------------
   svgkit.js — tiny SVG drawing kit for bilingual diagrams
   Every label is emitted as two <tspan> (zh / en) toggled by CSS,
   so switching language switches the text inside every figure too.
   ------------------------------------------------------------ */

const FIGS = {};                 // id -> () => svg string
const PARAMS = {};               // id -> { params:[...], build(vals), def:{...} }
let MK = 0;

const PAL = {
  ink: '#14181f', soft: '#5b6472', faint: '#98a1ae',
  line: '#d9d3c5', grid: '#eeeae0',
  navy: '#0c1f34', gold: '#b08d3e', goldL: '#e8d7b0',
  blue: '#1d4ed8', blueL: '#c9d8fb',
  green: '#0f766e', greenL: '#bfe6dd',
  red: '#b91c1c', redL: '#f2c7c4',
  violet: '#6d28d9', violetL: '#ddd0f7',
  amber: '#b45309', amberL: '#f3ddb8',
  cream: '#fbf8ee'
};

function CV(w, h) {
  MK += 1;
  const uid = 'f' + MK;
  const defs = [];
  let body = '';
  const api = { w, h };

  const styleOf = (o) => {
    const fam = o.mono ? 'var(--mono)' : o.serif ? 'var(--serif)' : 'var(--sans)';
    return `font-family:${fam};`
      + `font-size:${o.size || 12.5}px;`
      + (o.weight ? `font-weight:${o.weight};` : '')
      + (o.italic ? 'font-style:italic;' : '')
      + (o.ls ? `letter-spacing:${o.ls};` : '');
  };

  /* bilingual text; pass {z,e} or a plain string */
  api.text = function (x, y, t, o = {}) {
    const attrs = [
      `x="${x}"`, `y="${y}"`,
      `text-anchor="${o.anchor || 'middle'}"`,
      `fill="${o.fill || PAL.ink}"`,
      o.opacity ? `opacity="${o.opacity}"` : '',
      o.transform ? `transform="${o.transform}"` : '',
      `style="${styleOf(o)}"`
    ].filter(Boolean).join(' ');
    let inner;
    if (t && typeof t === 'object') {
      inner = `<tspan class="only-zh">${t.z}</tspan><tspan class="only-en">${t.e}</tspan>`;
    } else inner = t;
    body += `<text ${attrs}>${inner}</text>`;
    return api;
  };

  api.rect = function (x, y, ww, hh, o = {}) {
    body += `<rect x="${x}" y="${y}" width="${ww}" height="${hh}" rx="${o.rx == null ? 6 : o.rx}"`
      + ` fill="${o.fill || 'none'}"`
      + (o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.sw || 1.3}"` : '')
      + (o.dash ? ` stroke-dasharray="${o.dash}"` : '')
      + (o.opacity ? ` opacity="${o.opacity}"` : '') + '/>';
    return api;
  };

  api.line = function (x1, y1, x2, y2, o = {}) {
    body += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.stroke || PAL.line}"`
      + ` stroke-width="${o.sw || 1.4}"`
      + (o.dash ? ` stroke-dasharray="${o.dash}"` : '')
      + (o.opacity ? ` opacity="${o.opacity}"` : '')
      + (o.cap ? ` stroke-linecap="${o.cap}"` : '') + '/>';
    return api;
  };

  api.path = function (d, o = {}) {
    body += `<path d="${d}" fill="${o.fill || 'none'}"`
      + (o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.sw || 1.8}"` : '')
      + (o.dash ? ` stroke-dasharray="${o.dash}"` : '')
      + (o.opacity ? ` opacity="${o.opacity}"` : '')
      + (o.cap ? ` stroke-linecap="${o.cap}" stroke-linejoin="round"` : '') + '/>';
    return api;
  };

  api.circle = function (cx, cy, r, o = {}) {
    body += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${o.fill || 'none'}"`
      + (o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.sw || 1.4}"` : '')
      + (o.opacity ? ` opacity="${o.opacity}"` : '') + '/>';
    return api;
  };

  api.poly = function (pts, o = {}) {
    body += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="${o.fill || 'none'}"`
      + (o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.sw || 2}"` : '')
      + (o.dash ? ` stroke-dasharray="${o.dash}"` : '')
      + ' stroke-linejoin="round" stroke-linecap="round"/>';
    return api;
  };

  api.arrow = function (x1, y1, x2, y2, o = {}) {
    const id = `ar${uid}x${o.k || Math.round(x1 + y1 + x2 + y2)}`;
    if (!defs.includes(id)) {
      defs.push(id);
      api._marks = api._marks || '';
      api._marks += `<marker id="${id}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">`
        + `<path d="M 0 0 L 10 5 L 0 10 z" fill="${o.stroke || PAL.soft}"/></marker>`;
    }
    const bend = o.bend;
    const d = bend
      ? `M ${x1} ${y1} Q ${bend[0]} ${bend[1]} ${x2} ${y2}`
      : `M ${x1} ${y1} L ${x2} ${y2}`;
    body += `<path d="${d}" fill="none" stroke="${o.stroke || PAL.soft}" stroke-width="${o.sw || 1.6}"`
      + ` marker-end="url(#${id})" ${o.dash ? `stroke-dasharray="${o.dash}"` : ''}`
      + ` stroke-linecap="round" ${o.opacity ? `opacity="${o.opacity}"` : ''}/>`;
    return api;
  };

  /* pill label */
  api.tag = function (x, y, t, o = {}) {
    const pad = o.pad == null ? 9 : o.pad;
    const fs = o.size || 11;
    const wGuess = (typeof t === 'string' ? t.length : Math.max(t.z.length, t.e.length)) * (fs * (o.wide ? 1.02 : 0.62)) + pad * 2;
    const hh = o.h || fs + 12;
    body += `<rect x="${x - wGuess / 2}" y="${y - hh / 2}" width="${wGuess}" height="${hh}" rx="${hh / 2}"`
      + ` fill="${o.fill || '#f4f1e9'}"${o.stroke ? ` stroke="${o.stroke}"` : ''}/>`;
    api.text(x, y + fs * 0.36, t, { size: fs, fill: o.color || PAL.soft, weight: o.weight || 600, mono: o.mono });
    return api;
  };

  /* dashed guide */
  api.guide = function (x1, y1, x2, y2, color = PAL.faint) {
    return api.line(x1, y1, x2, y2, { stroke: color, sw: 1, dash: '3 4', opacity: 0.85 });
  };

  api.raw = function (s) { body += s; return api; };

  /* ---------------- interactive plates ----------------
     A plot declares the pixel box it occupies and the data domain inside
     it. Curves and points register themselves against it, and the whole
     registry is written as a JSON sidecar on the <svg> element, so hover
     can report exact readings without re-deriving the maths in the page. */

  api._panels = [];
  api._series = [];
  api._spots = [];

  api.plot = function (o) {
    const S = {
      id: o.id || 'p' + (api._panels.length + 1),
      x0: o.x0, x1: o.x1, y0: o.y0, y1: o.y1,
      xmin: o.xmin, xmax: o.xmax, ymin: o.ymin, ymax: o.ymax,
      lx: o.labelX || null, ly: o.labelY || null,
      ux: o.unitX || '', uy: o.unitY || '',
      dx: o.decX == null ? 1 : o.decX,
      dy: o.decY == null ? 1 : o.decY
    };
    S.X = function (v) { return S.x0 + (v - S.xmin) / (S.xmax - S.xmin) * (S.x1 - S.x0); };
    S.Y = function (v) { return S.y1 - (v - S.ymin) / (S.ymax - S.ymin) * (S.y1 - S.y0); };
    api._panels.push(S);
    return S;
  };

  const round3 = (n) => Math.round(n * 1000) / 1000;

  /* a named curve, given in data coordinates */
  api.series = function (S, meta, pts, o = {}) {
    const xy = pts.map((p) => [round3(S.X(p[0])), round3(S.Y(p[1]))]);
    body += `<polyline class="ix-s" data-s="${meta.id}" points="${xy.map((p) => p.join(',')).join(' ')}"`
      + ` fill="none" stroke="${o.color || PAL.ink}" stroke-width="${o.sw || 2.4}"`
      + (o.dash ? ` stroke-dasharray="${o.dash}"` : '')
      + ' stroke-linejoin="round" stroke-linecap="round"/>';
    // decimated, rounded copy for the tooltip: enough resolution to read
    // smoothly, small enough to keep the whole site a single file
    const step = Math.max(1, Math.ceil(pts.length / 110));
    const keep = [];
    for (let i = 0; i < pts.length; i += step) keep.push([round3(pts[i][0]), round3(pts[i][1])]);
    const last = pts[pts.length - 1];
    const kept = keep[keep.length - 1];
    if (!kept || kept[0] !== round3(last[0]) || kept[1] !== round3(last[1])) keep.push([round3(last[0]), round3(last[1])]);
    keep.sort((a, b) => a[0] - b[0]);   // the tooltip interpolates in x
    api._series.push({ p: S.id, id: meta.id, n: meta.name, ex: meta.explain || null, col: o.color || PAL.ink, pts: keep });
    return api;
  };

  /* a named point of interest; explanations hang off these. Pass the data
     values in meta.xv / meta.yv so hover and panel can quote them exactly. */
  api.spot = function (S, meta, x, y, o = {}) {
    const cx = round3(S.X(x));
    const cy = round3(S.Y(y));
    const col = meta.col || o.color || PAL.ink;
    const r = o.r || 6;
    if (o.draw !== false && meta.draw !== false) {
      body += `<g class="ix-spot" data-s="${meta.id}" tabindex="0" role="button" aria-label="${meta.name.z}">`
        + `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${col}" stroke-width="2"/>`
        + `<circle cx="${cx}" cy="${cy}" r="${Math.round(r * 0.42 * 10) / 10}" fill="${col}"/>`
        + '</g>';
    }
    api._spots.push({
      p: S.id, id: meta.id, n: meta.name, ex: meta.explain || null,
      xv: meta.xv == null ? x : meta.xv,
      yv: meta.yv == null ? y : meta.yv,
      cx, cy, col
    });
    return api;
  };

  api.out = function () {
    const d = (api._marks ? `<defs>${api._marks}</defs>` : '');
    let side = '';
    if (api._panels.length || api._series.length || api._spots.length) {
      const meta = JSON.stringify({ p: api._panels, s: api._series, k: api._spots })
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      side = ` data-plot="${meta}"`;
    }
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img"${side} xmlns="http://www.w3.org/2000/svg">`
      + d + body + `</svg>`;
  };
  return api;
}

FIGS['d-ci'] = () => {

  const Y = (d) => base - d * 900;                      // density 0 .. 0.20

  const mu = 12.2, se = 19.7 / Math.sqrt(96), sdYear = 19.7;

  // axis
  c.line(80, base, 700, base, { stroke: PAL.soft, sw: 1.3 });
  c.arrow(700, base, 712, base, { stroke: PAL.soft, sw: 1.3 });
  [4, 12, 20].forEach((r) => {

  c.text(62, 190, { z: '機率密度', e: 'density' }, { size: 9.5, anchor: 'middle', fill: PAL.faint, transform: 'rotate(-90 62 190)' });

  // shaded 95% band under the sampling curve (201 samples)
  const lo = mu - 2 * se, hi = mu + 2 * se;
  const shade = [];
  for (let i = 0; i <= 200; i++) {
    const r = lo + (hi - lo) * i / 200;
    shade.push([X(r), Y(pdf(r, mu, se))]);
  }
  c.path(`M ${X(lo)} ${base} ` + shade.map((p) => `L ${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')
    + ` L ${X(hi)} ${base} Z`, { fill: PAL.goldL, opacity: 0.55 });

  // interaction: both densities live in (return, density) coordinates.
  const S = c.plot({
    x0: 90, x1: 690, y0: 90, y1: 270,
    xmin: 4, xmax: 20, ymin: 0, ymax: 0.2,
    labelX: { z: '年報酬率 Rₜ', e: 'annual return Rₜ' },
    labelY: { z: '機率密度', e: 'probability density' },
    unitX: '%', decX: 1, decY: 3
  });

  // single-year density (SD 19.7%) — same density scale, 201 samples
  const yearly = [];
  for (let i = 0; i <= 200; i++) {
    const r = 4 + 16 * i / 200;
    yearly.push([r, pdf(r, mu, sdYear)]);
  }
  c.series(S, {
    id: 'yearly', color: PAL.faint, sw: 1.6, dash: '5 4',
    name: { z: '單一年度報酬（σ = 19.7%）', e: 'one year’s return (σ = 19.7%)' },
    explain: {
      z: '虛線是「只取一年」的報酬分佈：σ = 19.7%，非常寬，橫跨 4% 到 20% 幾乎是平的。任何單一年度的 12.2% 都可能只是運氣，所以不能憑一年表現判斷投資好壞——這正是下面要改用平均的原因。',
      e: 'The dashed curve is the distribution of a single year’s return: σ = 19.7%, very wide, almost flat from 4% to 20%. One year at 12.2% may be pure luck, so a single year cannot judge an investment — which is why the average is used below.'
    }
  }, yearly);

  // sampling distribution of the mean (SE = 2.01%), 201 samples
  const curve = [];
  for (let i = 0; i <= 200; i++) {
    const r = 4 + 16 * i / 200;
    curve.push([r, pdf(r, mu, se)]);
  }
  c.series(S, {
    id: 'sample', color: PAL.navy, sw: 2.2,
    name: { z: '96 年均值的抽樣分佈（σ = SE）', e: 'sampling distribution of the 96-year mean (σ = SE)' },
    explain: {
      z: '實線是「96 年平均報酬」的分佈：σ = SE = 19.7% ÷ √96 = 2.0%。同一個均值 12.2%，分佈窄了約 10 倍——樣本平均比單一年度可靠得多，所以 95% 區間只有 12.2% ± 4%，而不是單年的 ±39%。',
      e: 'The solid curve is the distribution of the 96-year average return: σ = SE = 19.7% ÷ √96 = 2.0%. The mean is still 12.2% but the spread is about ten times narrower — an average is far more reliable than a single year, so the 95% interval is 12.2% ± 4%, not ±39%.'
    }
  }, curve);

  // interactive readings: mean and the two band edges
  c.spot(S, {
    id: 'mean', col: PAL.gold, xv: mu, yv: pdf(mu, mu, se), draw: false, marker: false,
    name: { z: '樣本均值 12.2%', e: 'sample mean 12.2%' },
    explain: {
      z: '96 年的平均年報酬 12.2%，就是這條抽樣分佈的中心。注意它是「估計值」：換一組 96 年樣本，中心會左右移動約 2 個百分點（SE）。',
      e: 'The 96-year average return is 12.2%, the centre of this sampling distribution. It is an estimate: another 96-year sample would shift the centre by about 2 percentage points (the SE).'
    }
  }, mu, pdf(mu, mu, se));
  [[lo, 'lo', '下界 8.2%', 'lower bound 8.2%'], [hi, 'hi', '上界 16.2%', 'upper bound 16.2%']].forEach((b) => {
    c.spot(S, {
      id: b[1], col: PAL.ink, xv: b[0], yv: pdf(b[0], mu, se),
      name: { z: b[2] + '（−2 SE）', e: b[3] + ' (−2 SE)' },
      explain: b[1] === 'lo' ? {
        z: '下界 = 12.2 − 2 × 2.0 = 8.2%：在 95% 的信心下，真正的長期平均不低於此。它不是「最差的一年」，而是「平均值的不確定範圍」——兩者常被混淆。',
        e: 'The lower bound is 12.2 − 2 × 2.0 = 8.2%: with 95% confidence the true long-run mean is above this. It is not the worst year, but the uncertainty of the average — the two are often confused.'
      } : {
        z: '上界 = 12.2 + 2 × 2.0 = 16.2%。區間寬度 ±4% 完全由 SE 決定：n 變 4 倍，SE 才減半，所以想窄一半要多 4 倍數據。',
        e: 'The upper bound is 12.2 + 2 × 2.0 = 16.2%. The ±4% width is set entirely by the SE: quadrupling n only halves the SE, so a twice-narrower interval needs four times the data.'
      }
    }, b[0], pdf(b[0], mu, se), { r: 3.8 });
  });

  // mean
  c.line(X(mu), base, X(mu), Y(pdf(mu, mu, se)) - 4, { stroke: PAL.gold, sw: 1.5, dash: '4 4' });
  c.circle(X(mu), Y(pdf(mu, mu, se)), 4.2, { fill: PAL.gold });
  c.text(X(mu), 82, { z: '12.2%', e: '12.2%' }, { size: 10.5, weight: 700, fill: PAL.gold, mono: true });

  // band edges
  [lo, hi].forEach((r) => {
    c.line(X(r), base, X(r), Y(pdf(r, mu, se)), { stroke: PAL.ink, sw: 1.1, dash: '3 3', opacity: 0.55 });
  });
  c.text(X(lo), 292, '8.2%', { size: 9.5, fill: PAL.ink, mono: true, weight: 700 });
  c.text(X(hi), 292, '16.2%', { size: 9.5, fill: PAL.ink, mono: true, weight: 700 });

  // 95% bracket
  c.line(X(lo), 306, X(hi), 306, { stroke: PAL.gold, sw: 1.5 });
  c.line(X(lo), 300, X(lo), 312, { stroke: PAL.gold, sw: 1.5 });
  c.line(X(hi), 300, X(hi), 312, { stroke: PAL.gold, sw: 1.5 });
  c.text((X(lo) + X(hi)) / 2, 324, { z: '95% CI = 12.2% ± 2 × 2.0%', e: '95% CI = 12.2% ± 2 × 2.0%' }, { size: 10, weight: 700, fill: '#7a5c1e' });

  // SE box
  c.rect(96, 88, 284, 56, { fill: PAL.cream, stroke: '#e6dcc2', rx: 9 });
  c.text(238, 108, { z: 'SE = 19.7% / √96 = 2.01% ≈ 2.0%', e: 'SE = 19.7% / √96 = 2.01% ≈ 2.0%' }, { size: 10.5, mono: true, fill: '#7a5c1e', weight: 600 });
  c.text(238, 130, { z: '12.2% ± 2(2.0%) → 8.2% ~ 16.2%', e: '12.2% ± 2(2.0%) → 8.2% ~ 16.2%' }, { size: 10.5, mono: true, fill: '#7a5c1e' });

  // right-hand labels + leader
  c.text(706, 116, { z: '實線：均值的抽樣分佈（σ = SE）', e: 'solid: sampling distribution of the mean (σ = SE)' }, { size: 9.5, anchor: 'end', fill: PAL.ink });
  c.text(706, 134, { z: '虛線：單一年度報酬（σ = 19.7%）', e: 'dashed: a single year’s return (σ = 19.7%)' }, { size: 9.5, anchor: 'end', fill: PAL.faint });
  c.arrow(600, 146, 638, 250, { stroke: PAL.faint, sw: 1.1 });

  c.text(380, 344, { z: 'n 越大 → SE = SD/√n 越小 → 區間越窄；樣本變 4 倍，寬度才減半', e: 'larger n → smaller SE = SD/√n → narrower interval; 4× the sample just halves it' },
    { size: 10, fill: PAL.faint });
  return c.out();
};

/* 9. 分母的選擇：÷ n（母體）還是 ÷ n−1（樣本）— 用 Security A 的五年報酬 */
function t1Divisor(N) {
  const n = Math.max(2, Math.min(5, N));
  const all = [2.3, 8.0, -3.0, 5.5, 4.1];
  const vals = all.slice(0, n);
  const mean = vals.reduce((a, b) => a + b, 0) / n;
  const dev = vals.map((v) => v - mean);
  const sq = dev.map((d) => d * d);
  const ss = sq.reduce((a, b) => a + b, 0);
  const varN = ss / n, varN1 = ss / (n - 1);
  const sdN = Math.sqrt(varN), sdN1 = Math.sqrt(varN1);
  const big = sq.indexOf(Math.max.apply(null, sq));

  const c = CV(740, 368);
  const base = 236, maxH = 120, maxSq = Math.max.apply(null, sq);

  /* left card: squared deviations */
  c.rect(24, 58, 330, 262, { fill: '#fff', stroke: PAL.line, rx: 12 });
  c.text(40, 84, { z: '① ' + n + ' 年的離差平方（%²）', e: '① squared deviations over ' + n + ' years (%²)' }, { size: 12, anchor: 'start', weight: 700, fill: PAL.navy });
  c.text(40, 104, { z: '平均 ' + mean.toFixed(2) + '%；Σ離差 ≈ 0', e: 'mean ' + mean.toFixed(2) + '%; Σdeviations ≈ 0' }, { size: 9, anchor: 'start', fill: PAL.soft });

  const cx = [76, 132, 188, 244, 300];
  sq.forEach((s2, i) => {
    const h = Math.max(s2 / maxSq * maxH, 3);
    c.rect(cx[i] - 17, base - h, 34, h, { fill: PAL.blueL, rx: 4 });
    c.rect(cx[i] - 17, base - h, 34, 3, { fill: PAL.blue, rx: 2 });
    // keep the value clear of the mean note when a tall bar sits on the left
    const inside = base - h - 6 < 116 && cx[i] < 180;
    c.text(cx[i], inside ? base - h + 16 : base - h - 6, s2.toFixed(2), { size: 9, fill: inside ? PAL.navy : PAL.blue, mono: true });
    c.text(cx[i], base + 14, vals[i].toFixed(1) + '%', { size: 9.5, fill: PAL.soft, mono: true });
    c.text(cx[i], base + 28, 'Y' + (i + 1), { size: 8.5, fill: PAL.faint, mono: true });
  });
  c.line(48, base, 320, base, { stroke: PAL.soft, sw: 1.2 });

  c.text(40, 292, { z: 'SS = ' + sq.map((v) => v.toFixed(2)).join(' + '), e: 'SS = ' + sq.map((v) => v.toFixed(2)).join(' + ') }, { size: 9.5, anchor: 'start', fill: PAL.ink, mono: true });
  c.text(40, 308, { z: '   = ' + ss.toFixed(2) + ' %²', e: '   = ' + ss.toFixed(2) + ' %²' }, { size: 9.5, anchor: 'start', fill: PAL.ink, mono: true, weight: 700 });

  /* right card: which divisor */
  c.rect(372, 58, 344, 262, { fill: '#fff', stroke: PAL.line, rx: 12 });
  c.text(388, 84, { z: '② 分母：÷ n 還是 ÷ n−1？', e: '② which divisor: n or n−1?' }, { size: 12, anchor: 'start', weight: 700, fill: PAL.navy });

  c.rect(388, 98, 312, 78, { fill: '#fdf2f1', stroke: '#eec7c2', rx: 9 });
  c.text(404, 120, { z: '÷ n = ' + n + '（當成母體）', e: '÷ n = ' + n + ' (treat as population)' }, { size: 11, anchor: 'start', weight: 700, fill: PAL.red });
  c.text(404, 140, { z: ss.toFixed(2) + ' ÷ ' + n + ' = ' + varN.toFixed(2) + ' %²', e: ss.toFixed(2) + ' ÷ ' + n + ' = ' + varN.toFixed(2) + ' %²' }, { size: 10.5, anchor: 'start', fill: PAL.ink, mono: true });
  c.text(404, 160, { z: 'SD = √' + varN.toFixed(2) + ' = ' + sdN.toFixed(2) + '% → 樣本題錯', e: 'SD = √' + varN.toFixed(2) + ' = ' + sdN.toFixed(2) + '% → wrong for a sample' }, { size: 10, anchor: 'start', fill: PAL.red });

  c.rect(388, 186, 312, 78, { fill: '#eef7f4', stroke: '#9fd3c6', rx: 9 });
  c.text(404, 208, { z: '÷ n−1 = ' + (n - 1) + '（樣本，正確）', e: '÷ n−1 = ' + (n - 1) + ' (sample — correct)' }, { size: 11, anchor: 'start', weight: 700, fill: PAL.green });
  c.text(404, 228, { z: ss.toFixed(2) + ' ÷ ' + (n - 1) + ' = ' + varN1.toFixed(2) + ' %²', e: ss.toFixed(2) + ' ÷ ' + (n - 1) + ' = ' + varN1.toFixed(2) + ' %²' }, { size: 10.5, anchor: 'start', fill: PAL.ink, mono: true });
  c.text(404, 248, { z: 'SD = √' + varN1.toFixed(2) + ' = ' + sdN1.toFixed(2) + '%', e: 'SD = √' + varN1.toFixed(2) + ' = ' + sdN1.toFixed(2) + '%' }, { size: 10.5, anchor: 'start', fill: PAL.green, mono: true, weight: 700 });

  c.text(388, 288, { z: n + ' 個離差只有 ' + (n - 1) + ' 個獨立（自由度 n−1）', e: 'only ' + (n - 1) + ' of the ' + n + ' deviations are free (df = n−1)' }, { size: 9.5, anchor: 'start', fill: PAL.soft });
  c.text(388, 306, { z: '用 n 會系統性低估風險', e: 'using n systematically understates risk' }, { size: 9.5, anchor: 'start', fill: PAL.soft });

  c.text(370, 348, { z: '題目問「樣本標準差」→ 一定用 n−1；問「母體」或「機率分佈」→ 用 n 或機率',
    e: 'a “sample” standard deviation always uses n−1; a “population” or “distribution” uses n or the probabilities' },
    { size: 10, fill: PAL.faint });

  /* interaction A: each bar top is (return, squared deviation) — bars stay
     categorical, so the panel maps year index 1..5 onto the five bar centres. */
  const P1 = c.plot({
    x0: 76, x1: 300, y0: base - maxH, y1: base,
    xmin: 1, xmax: 5, ymin: 0, ymax: maxSq,
    labelX: { z: '年度 Yᵢ', e: 'year Yᵢ' },
    labelY: { z: '離差平方 (%²)', e: 'squared deviation (%²)' },
    decX: 0, decY: 2
  });
  sq.forEach((s2, i) => {
    c.spot(P1, {
      id: 'y' + (i + 1), col: PAL.blue, xv: vals[i], yv: s2, draw: false, marker: false,
      name: { z: 'Y' + (i + 1) + '：R = ' + vals[i].toFixed(1) + '%，離差平方 ' + s2.toFixed(2) + ' %²', e: 'Y' + (i + 1) + ': R = ' + vals[i].toFixed(1) + '%, squared deviation ' + s2.toFixed(2) + ' %²' },
      explain: i === big ? {
        z: '最大的一年：R = ' + vals[i].toFixed(1) + '%，離差 ' + dev[i].toFixed(2) + ' 個百分點，平方後 ' + s2.toFixed(2) + ' %²，單獨就佔 SS 的 ' + (s2 / ss * 100).toFixed(0) + '%。平方把大離差放大：這也是變異數對極端值敏感的原因。',
        e: 'The biggest year: R = ' + vals[i].toFixed(1) + '%, a deviation of ' + dev[i].toFixed(2) + ' points, squared to ' + s2.toFixed(2) + ' %² — on its own ' + (s2 / ss * 100).toFixed(0) + '% of the SS. Squaring magnifies large deviations, which is why variance is sensitive to outliers.'
      } : i === 0 ? {
        z: '第一年 R = ' + vals[i].toFixed(1) + '%，離差 ' + dev[i].toFixed(2) + '，平方 ' + s2.toFixed(2) + ' %²。離差是「報酬 − 平均」，不是「報酬」本身；Σ離差 = 0，所以平方之後才不會互相抵消。',
        e: 'Year 1: R = ' + vals[i].toFixed(1) + '%, deviation ' + dev[i].toFixed(2) + ', squared to ' + s2.toFixed(2) + ' %². A deviation is return − mean, not the return itself; the deviations sum to zero, which is why they must be squared.'
      } : {
        z: 'Y' + (i + 1) + '：R = ' + vals[i].toFixed(1) + '%，離差 ' + dev[i].toFixed(2) + '，平方 ' + s2.toFixed(2) + ' %²。每個離差平方都是「距離平均多遠」的貢獻，全部加起來就是 SS。',
        e: 'Y' + (i + 1) + ': R = ' + vals[i].toFixed(1) + '%, deviation ' + dev[i].toFixed(2) + ', squared ' + s2.toFixed(2) + ' %². Each squared deviation contributes its own distance from the mean; together they make the SS.'
      }
    }, i + 1, s2);
  });

  /* interaction B: the two boxes are the two candidate divisors. The panel is
     fitted to those two readings so each spot sits inside its own box. */
  const P2 = c.plot({
    x0: 560, x1: 620, y0: 137, y1: 225,
    xmin: n, xmax: n - 1, ymin: varN1, ymax: varN,
    labelX: { z: '分母（÷n 或 ÷n−1）', e: 'divisor (n or n−1)' },
    labelY: { z: '變異數 (%²)', e: 'variance (%²)' },
    decX: 0, decY: 2
  });
  c.spot(P2, {
    id: 'dn', col: PAL.red, xv: n, yv: varN,
    name: { z: '÷ n = ' + n + '：' + varN.toFixed(2) + ' %²', e: '÷ n = ' + n + ': ' + varN.toFixed(2) + ' %²' },
    explain: {
      z: '把這 ' + n + ' 年當成「整個母體」時，分母是 n = ' + n + '：' + ss.toFixed(2) + ' ÷ ' + n + ' = ' + varN.toFixed(2) + ' %²，SD = ' + sdN.toFixed(2) + '%。只有當你手上真的有全部母體數據才這樣算；題目說「樣本」時這一步就是錯的——它系統性低估風險。',
      e: 'If these ' + n + ' years were the whole population, the divisor is n = ' + n + ': ' + ss.toFixed(2) + ' ÷ ' + n + ' = ' + varN.toFixed(2) + ' %² and SD = ' + sdN.toFixed(2) + '%. That is only right when you really hold every observation; for a sample this step is wrong and systematically understates risk.'
    }
  }, n, varN);
  c.spot(P2, {
    id: 'dn1', col: PAL.green, xv: n - 1, yv: varN1,
    name: { z: '÷ n−1 = ' + (n - 1) + '：' + varN1.toFixed(2) + ' %²', e: '÷ n−1 = ' + (n - 1) + ': ' + varN1.toFixed(2) + ' %²' },
    explain: {
      z: '樣本要用 n−1 = ' + (n - 1) + '：' + ss.toFixed(2) + ' ÷ ' + (n - 1) + ' = ' + varN1.toFixed(2) + ' %²，SD = ' + sdN1.toFixed(2) + '%。原因：平均本身是從同一組數據估出來的，n 個離差只剩 n−1 個自由度；除以較小的分母，剛好補回這個損失。',
      e: 'A sample uses n−1 = ' + (n - 1) + ': ' + ss.toFixed(2) + ' ÷ ' + (n - 1) + ' = ' + varN1.toFixed(2) + ' %² and SD = ' + sdN1.toFixed(2) + '%. The mean is itself estimated from the same data, so n deviations leave only n−1 degrees of freedom; dividing by the smaller number corrects for that loss.'
    }
  }, n - 1, varN1);
  return c.out();
}
FIGS['d-divisor'] = () => t1Divisor(PARAMS['d-divisor'].def.n);
PARAMS['d-divisor'] = {
  params: [{ k: 'n', z: '年期數 n', e: 'number of years n', min: 2, max: 5, step: 1, dec: 0, def: 5, unit: '年' }],
  def: { n: 5 },
  build: (v) => t1Divisor(v.n)
};

/* ============================================================
   figs-t2.js — Topic 2 diagrams
   ------------------------------------------------------------
   Rules used in this file
   · every curve comes from an explicit function, sampled ≥ 200 times;
   · points that matter (endpoints, minimum-variance weights, the σ = 0
     vertex, the ρ = ±1 ends) are solved analytically and *inserted* into
     the sample set, so nothing is located by eye;
   · data coordinates are fixed by the maths — only label offsets move;

/* ------------------------------------------------------------
   4. 相關係數家族：同一對資產 A(15%,10%)、B(30%,20%)，只改 ρ
   ------------------------------------------------------------ */
FIGS['d-corr'] = () => {
  const c = CV(740, 452);
  const X = (s) => 150 + s / 33 * 540;
  const Y = (e) => 320 - (e - 8) / 14 * 236;

  const sA = 15, eA = 10, sB = 30, eB = 20;
  const varA = sA * sA, varB = sB * sB;

  c.line(150, 320, 690, 320, { stroke: PAL.ink, sw: 1.3 });
  c.line(150, 84, 150, 320, { stroke: PAL.ink, sw: 1.3 });
  [0, 10, 20, 30].forEach((v) => {
    c.line(X(v), 320, X(v), 324, { stroke: PAL.ink, sw: 1.2 });
    c.text(X(v), 336, v + '%', { size: 9.6, fill: PAL.soft });
  });
  [10, 14, 18].forEach((v) => {
    c.line(146, Y(v), 150, Y(v), { stroke: PAL.ink, sw: 1.2 });
    c.text(142, Y(v) + 4, v + '%', { size: 9.6, fill: PAL.soft, anchor: 'end' });
  });
  c.text(420, 358, { z: '組合標準差 σₚ（%）', e: 'portfolio SD σₚ (%)' },
    { size: 10.5, fill: PAL.soft });
  c.text(150, 74, { z: 'E(Rₚ)（%）', e: 'E(Rₚ) (%)' },
    { size: 10.5, fill: PAL.soft, anchor: 'start' });

  /* 互動面板：x 讀 σₚ、y 讀 E(Rₚ) */
  const S = c.plot({
    x0: 150, x1: 690, y0: 84, y1: 320,
    xmin: 0, xmax: 33, ymin: 8, ymax: 22,
    labelX: { z: '組合標準差 σₚ（%）', e: 'portfolio SD σₚ (%)' },
    labelY: { z: 'E(Rₚ)（%）', e: 'E(Rₚ) (%)' },
    unitX: '%', unitY: '%', decX: 1, decY: 1
  });

  /* one locus per ρ: 400-point grid + analytically inserted key weights.
     The locus is not monotone in σ (it turns at the minimum-variance weight),
     so each curve is split there into two strictly-increasing-x branches. */
  const locus = (rho) => {
    const wMin = (varB - rho * sA * sB) / (varA + varB - 2 * rho * sA * sB);
    const set = new Set();
    for (let i = 0; i <= 400; i++) set.add(i / 400);
    [0, 1, wMin, 2 / 3].forEach((v) => {
      if (v >= 0 && v <= 1) set.add(Math.round(v * 1e6) / 1e6);
    });
    const ws = [...set].sort((a, b) => a - b);
    const arr = ws.map((w) => {
      const e = w * eA + (1 - w) * eB;
      const v = w * w * varA + (1 - w) * (1 - w) * varB + 2 * w * (1 - w) * rho * sA * sB;
      return { w: w, e: e, s: Math.sqrt(Math.max(v, 0)) };
    });
    let iMin = 0;
    arr.forEach((p, i) => { if (p.s < arr[iMin].s) iMin = i; });
    const data = (a) => a.map((p) => [p.s, p.e]);
    const out = { min: arr[iMin] };
    if (iMin === 0 || iMin === arr.length - 1) {
      out.one = data(arr).sort((a, b) => a[0] - b[0]);
    } else {
      out.a = data(arr.slice(0, iMin + 1)).reverse();   // σ descending → reverse
      out.b = data(arr.slice(iMin));
    }
    return out;
  };

  const curves = [
    { rho: 1, col: PAL.faint, sw: 2.2, id: 'corr-p1',
      name: { z: 'ρ=+1：完全正相關', e: 'ρ = +1: perfect positive correlation' },
      explain: { z: '兩檔資產完全同向，組合只能沿 A、B 的直線移動，沒有一點分散效益；σₚ 在 15% 與 30% 之間，取決於權重。',
        e: 'The two assets move exactly together, so every portfolio sits on the straight line between A and B: no diversification benefit at all. σₚ runs between 15% and 30% according to the weights.' } },
    { rho: 0.3, col: PAL.gold, sw: 2.6, id: 'corr-p03',
      name: { z: 'ρ=+0.3：一般情形', e: 'ρ = +0.3: the usual case' },
      explain: { z: '最接近真實股價的關係；曲線向左彎，最低變異數點的 σₚ≈14.6%，比全押 A 的 15% 更低——分散有效，但不徹底。',
        e: 'This is the closest to real share prices. The locus bends left and its minimum-variance point has σₚ ≈ 14.6%, below the 15% of an all-A portfolio: diversification works, but only partly.' } },
    { rho: 0, col: PAL.blue, sw: 2.2, id: 'corr-p0',
      name: { z: 'ρ=0：無線性相關', e: 'ρ = 0: no linear relation' },
      explain: { z: '零相關時最低點更左，σₚ≈13.4%；曲線仍從 A 出發到 B，但中間的「子彈」比 ρ=0.3 更鼓，代表同樣報酬下風險更低。',
        e: 'With zero correlation the minimum lies further left at σₚ ≈ 13.4%. The bullet is fuller than at ρ = 0.3, meaning lower risk for the same expected return.' } },
    { rho: -1, col: PAL.green, sw: 2.8, id: 'corr-pm1',
      name: { z: 'ρ=−1：完全負相關', e: 'ρ = −1: perfect negative correlation' },
      explain: { z: '兩資產完全反向，V 形折線在 σ=0 碰到縱軸：w_A=2/3、w_B=1/3 時風險完全抵銷，E(Rₚ)=13.33%。這是數學極端，實務上幾乎不存在。',
        e: 'The assets move exactly opposite, so the V-shaped locus touches the vertical axis at σ = 0: with w_A = 2/3 and w_B = 1/3 risk is cancelled entirely, at E(Rₚ) = 13.33%. This is a mathematical extreme, almost never seen in practice.' } }
  ];
  const mins = {};
  curves.forEach((cur) => {
    const L = locus(cur.rho);
    mins[cur.rho] = L.min;
    const meta = { id: cur.id, name: cur.name, explain: cur.explain };
    const opts = { color: cur.col, sw: cur.sw };
    if (L.one) c.series(S, meta, L.one, opts);
    else {
      c.series(S, Object.assign({}, meta, { id: cur.id + '-a' }), L.a, opts);
      c.series(S, Object.assign({}, meta, { id: cur.id + '-b' }), L.b, opts);
    }
  });

  /* minimum-variance points, solved analytically */
  [[0, PAL.blue], [0.3, PAL.gold]].forEach(([rho, col]) => {
    const m = mins[rho];
    c.circle(X(m.s), Y(m.e), 3.4, { fill: '#fff', stroke: col, sw: 1.8 });
    c.spot(S, {
      id: 'corr-min-' + rho, col: col,
      name: { z: 'ρ=' + (rho === 0 ? '0' : '0.3') + ' 的最低變異數點',
        e: 'minimum-variance point at ρ = ' + (rho === 0 ? '0' : '0.3') },
      explain: { z: '這是整條曲線最靠左的點：再怎麼調整權重，風險都不會更低。它對應的權重 w_A=' + T2P(m.w * 100, 1) + '，不是 50/50。',
        e: 'This is the leftmost point of the whole locus: no reweighting can reduce risk further. Its weight is w_A = ' + T2P(m.w * 100, 1) + ', not 50/50.' },
      xv: m.s, yv: m.e
    }, m.s, m.e, { draw: false });
  });

  /* endpoints */
  c.circle(X(sA), Y(eA), 5.2, { fill: PAL.ink, stroke: '#fff', sw: 1.6 });
  c.text(410, 298, { z: 'A（15%，10%）', e: 'A (15%, 10%)' },
    { size: 10, anchor: 'start', fill: PAL.ink, weight: 600 });
  c.spot(S, {
    id: 'corr-A', col: PAL.ink,
    name: { z: 'A：σ=15%，E(R)=10%', e: 'A: σ = 15%, E(R) = 10%' },
    explain: { z: '100% 押在 A：σₚ 就是 A 自己的 15%，E(Rₚ)=10%。四條曲線都從這裡出發——只有一檔資產，沒有東西可以分散。',
      e: '100% in A: σₚ equals A’s own 15% and E(Rₚ) = 10%. All four loci start here: with one asset there is nothing to diversify against.' },
    xv: sA, yv: eA
  }, sA, eA, { draw: false });
  c.circle(X(sB), Y(eB), 5.2, { fill: PAL.ink, stroke: '#fff', sw: 1.6 });
  c.text(628, 104, { z: 'B（30%，20%）', e: 'B (30%, 20%)' },
    { size: 10, anchor: 'end', fill: PAL.ink, weight: 600 });
  c.spot(S, {
    id: 'corr-B', col: PAL.ink,
    name: { z: 'B：σ=30%，E(R)=20%', e: 'B: σ = 30%, E(R) = 20%' },
    explain: { z: '100% 押在 B：σₚ=30%、E(Rₚ)=20%。四條曲線都在這裡結束；A 到 B 的路徑形狀完全由 ρ 決定。',
      e: '100% in B: σₚ = 30% and E(Rₚ) = 20%. Every locus ends here; the shape of the path from A to B is decided entirely by ρ.' },
    xv: sB, yv: eB
  }, sB, eB, { draw: false });

  /* σ = 0 vertex of the ρ = −1 locus */
  c.circle(X(0), Y(40 / 3), 5, { fill: '#fff', stroke: PAL.green, sw: 2 });
  c.guide(153, 234, 164, 256, PAL.green);
  c.text(168, 268, { z: 'σ = 0 頂點', e: 'σ = 0 vertex' },
    { size: 10, anchor: 'start', fill: PAL.green, weight: 600 });
  c.spot(S, {
    id: 'corr-zero', col: PAL.green,
    name: { z: 'σₚ=0：完全避險組合', e: 'σₚ = 0: the perfectly hedged portfolio' },
    explain: { z: 'ρ=−1 時，w_A=2/3 的組合把兩種風險完全抵銷，σₚ 真的等於 0；代價是 E(Rₚ) 只有 13.33%，低於 B 的 20%。零風險不是免費的。',
      e: 'At ρ = −1, a portfolio with w_A = 2/3 cancels the two risks exactly, so σₚ is truly zero. The price is an expected return of only 13.33%, below B’s 20%: zero risk is not free.' },
    xv: 0, yv: 40 / 3
  }, 0, 40 / 3, { draw: false });
  c.text(648, 240, { z: '○ = 最低變異數點（ρ=0 與 0.3）', e: '○ = minimum-variance point (ρ = 0 and 0.3)' },
    { size: 9.4, anchor: 'end', fill: PAL.soft });

  /* why only ρ = −1 */
  c.rect(176, 96, 256, 40, { fill: 'rgba(255,255,255,.94)', stroke: PAL.line, rx: 8 });
  c.text(304, 113, { z: '只有 ρ=−1 碰到 σ=0', e: 'only ρ = −1 reaches σ = 0' },
    { size: 9.8, weight: 600, fill: PAL.green });
  c.text(304, 129, { z: '其他 ρ 的交叉項抵不掉兩個變異數項', e: 'other ρ cannot cancel both variance terms' },
    { size: 9.2, fill: PAL.soft });

  /* legend */
  const leg = [
    { t: { z: 'ρ=+1：完全正相關（無效益）', e: 'ρ = +1: perfect positive (no benefit)' }, col: PAL.faint },
    { t: { z: 'ρ=+0.3：一般情形（部分效益）', e: 'ρ = +0.3: usual case (partial benefit)' }, col: PAL.gold },
    { t: { z: 'ρ=0：無線性關係（仍有效益）', e: 'ρ = 0: no linear relation (still a benefit)' }, col: PAL.blue },
    { t: { z: 'ρ=−1：完全負相關（σ=0 可達）', e: 'ρ = −1: perfect negative (σ = 0 attainable)' }, col: PAL.green }
  ];
  leg.forEach((l, i) => {
    const lx = i % 2 === 0 ? 104 : 404, ly = i < 2 ? 392 : 420;
    c.line(lx, ly, lx + 28, ly, { stroke: l.col, sw: 2.8 });
    c.text(lx + 36, ly + 4, l.t, { size: 9.6, anchor: 'start', fill: PAL.soft });
  });
  return c.out();
};

/* ------------------------------------------------------------
   5. 分散效果：σₚ(n) = √(400 + 1200/n)，20% 是市場風險地板
   ------------------------------------------------------------ */
function t2Diversify(n) {
  const c = CV(720, 360);
  const sig = (nn) => Math.sqrt(400 + 1200 / nn);
  const X = (nn) => 100 + Math.sqrt(nn / 50) * 576;
  const Y = (s) => 288 - (s - 18) / 24 * 216;
  const nNow = Math.max(1, Math.min(50, Math.round(n)));

  /* 互動面板：x 刻度是 √(n/50)，登記點用 t=√(n/50)；顯示值由 meta.xv 直接給 n */
  const PL = c.plot({
    x0: 100, x1: 676, y0: 72, y1: 288,
    xmin: 0, xmax: 1, ymin: 18, ymax: 42,
    labelX: { z: '股票數 n', e: 'number of stocks n' },
    labelY: { z: 'σₚ（%）', e: 'σₚ (%)' },
    unitY: '%', decX: 0, decY: 1
  });

  /* shaded = diversifiable band, between curve and 20% floor */
  const band = [];
  for (let k = 1; k <= 50.0001; k += 0.2) band.push([X(k), Y(sig(k))]);
  band.push([X(50), 270], [X(1), 270]);
  c.poly(band, { fill: 'rgba(176,141,62,.11)', stroke: 'none' });

  c.line(100, 288, 676, 288, { stroke: PAL.ink, sw: 1.3 });
  c.line(100, 72, 100, 288, { stroke: PAL.ink, sw: 1.3 });
  [20, 25, 30, 35, 40].forEach((v) => {
    c.line(96, Y(v), 100, Y(v), { stroke: PAL.ink, sw: 1.2 });
    c.text(92, Y(v) + 4, v + '%', { size: 9.6, fill: PAL.soft, anchor: 'end' });
  });
  [1, 5, 10, 20, 30, 50].forEach((k) => {
    c.line(X(k), 288, X(k), 292, { stroke: PAL.ink, sw: 1.2 });
    c.text(X(k), 302, String(k), { size: 9.6, fill: PAL.soft });
  });
  c.text(390, 328, { z: '組合中的股票數 n（√ 刻度）', e: 'number of stocks n (√ scale)' },
    { size: 10.5, fill: PAL.soft });
  c.text(104, 62, { z: 'σₚ（%）', e: 'σₚ (%)' }, { size: 10.5, fill: PAL.soft, anchor: 'start' });

  /* asymptote: the market-risk floor */
  c.line(100, 270, 676, 270, { stroke: PAL.red, sw: 1.6, dash: '7 5' });
  c.text(664, 284, { z: '市場風險 = 20%（n → ∞ 的下限）', e: 'market risk = 20% (n → ∞ floor)' },
    { size: 9.6, fill: PAL.red, anchor: 'end', weight: 600 });

  /* the curve: 1000 uniform samples (drawn, not registered: the x axis is √-scaled) */
  const pts = [];
  for (let i = 0; i <= 1000; i++) {
    const k = 1 + i / 1000 * 49;
    pts.push([X(k), Y(sig(k))]);
  }
  c.poly(pts, { stroke: PAL.navy, sw: 2.6 });

  /* band label */
  c.text(200, 244, { z: '可分散風險', e: 'diversifiable risk' },
    { size: 10, anchor: 'start', fill: '#8a6a1e', weight: 600 });
  c.text(200, 260, { z: '公司特有，加股票就清光', e: 'firm-specific; adding names clears it' },
    { size: 9.4, anchor: 'start', fill: '#8a6a1e' });

  /* n = 1 static marker */
  c.circle(X(1), Y(40), 5, { fill: PAL.navy, stroke: '#fff', sw: 1.6 });
  c.text(192, 82, { z: 'n=1：40%', e: 'n = 1: 40%' },
    { size: 9.8, anchor: 'start', fill: PAL.navy, weight: 600 });

  /* 沿曲線每 1 檔登記一個 spot；n 與 σ 都用真值，hover 讀得到 */
  const hoverN = [1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 18, 22, 26, 30, 35, 40, 45, 50];
  const curveEx = {
    z: 'σₚ(n)=√(400+1200/n)：400 是市場（系統）風險的變異數，1200/n 是公司特有風險的變異數。n 越大第二項越小，曲線下降但永遠停在 20% 地板——加股票只清得掉可分散的那一半。',
    e: 'σₚ(n) = √(400 + 1200/n): 400 is the variance of market (systematic) risk, 1200/n the variance of firm-specific risk. As n grows the second term shrinks, so the curve falls but never passes the 20% floor: adding names clears only the diversifiable half.'
  };
  hoverN.forEach((k) => {
    c.spot(PL, {
      id: 'div-n' + String(k).replace('.', '_'), col: k === 1 ? PAL.navy : PAL.gold,
      name: { z: 'n=' + k + '：σₚ=' + T2D(sig(k), 2) + '%', e: 'n = ' + k + ': σₚ = ' + T2D(sig(k), 2) + '%' },
      explain: curveEx, xv: k, yv: sig(k)
    }, Math.sqrt(k / 50), sig(k), { draw: false });
  });

  /* 滑桿選定的 n：標記、垂線、讀值 */
  const sNow = sig(nNow);
  const px = X(nNow), py = Y(sNow);
  if (nNow !== 1) {
    if (nNow >= 8) c.line(px, py, px, 288, { stroke: PAL.faint, sw: 1.1, dash: '3 4', opacity: 0.9 });
    c.circle(px, py, 5.2, { fill: PAL.gold, stroke: '#fff', sw: 1.8 });
  }
  if (nNow !== 1) {
    let lx = px + 12, ly = py - 10, anchor = 'start';
    if (nNow <= 3) { lx = px + 12; ly = py + 18; }
    else { lx = px + 12; ly = py - 10; }
    if (nNow >= 38) { lx = px - 12; ly = py - 10; anchor = 'end'; }
    c.text(lx, ly, { z: 'n=' + nNow + '：' + T2D(sNow, 1) + '%', e: 'n = ' + nNow + ': ' + T2D(sNow, 1) + '%' },
      { size: 9.8, anchor: anchor, fill: '#8a6a1e', weight: 600 });
  }
  c.text(360, 348, { z: '目前 n=' + nNow + '：σₚ=' + T2D(sNow, 1) + '%；離 20% 地板還有 ' + T2D(sNow - 20, 1) + ' 個百分點',
    e: 'current n = ' + nNow + ': σₚ = ' + T2D(sNow, 1) + '%; still ' + T2D(sNow - 20, 1) + ' points above the 20% floor' },
    { size: 9.6, fill: PAL.navy, weight: 600 });
  if (nNow !== 1) {
    c.spot(PL, {
      id: 'div-now', col: PAL.gold,
      name: { z: '持有 ' + nNow + ' 檔的組合', e: 'portfolio of ' + nNow + ' names' },
      explain: { z: '你現在持有 ' + nNow + ' 檔：σₚ=' + T2D(sNow, 1) + '%，離 20% 地板還有 ' + T2D(sNow - 20, 1) + ' 個百分點。那一截就是還沒分散掉的公司特有風險；再加股票只能把它壓小，壓不到 0。',
        e: 'You now hold ' + nNow + ' names: σₚ = ' + T2D(sNow, 1) + '%, still ' + T2D(sNow - 20, 1) + ' points above the 20% floor. That gap is the firm-specific risk not yet diversified away; more names shrink it but never to zero.' },
      xv: nNow, yv: sNow
    }, Math.sqrt(nNow / 50), sNow, { draw: false });
  }

  /* formula card */
  c.rect(300, 92, 352, 84, { fill: 'rgba(255,255,255,.94)', stroke: PAL.line, rx: 9 });
  c.text(476, 112, { z: '曲線：σₚ = √(400 + 1200/n)', e: 'curve: σₚ = √(400 + 1200/n)' },
    { size: 10, weight: 600, fill: PAL.ink });
  c.text(476, 132, { z: '虛線：n→∞ 的地板 20%（市場風險）', e: 'dashed: 20% floor as n→∞ (market risk)' },
    { size: 9.4, fill: PAL.soft });
  c.text(476, 152, { z: '兩線之間：可分散風險', e: 'between the two lines: diversifiable risk' },
    { size: 9.4, fill: PAL.soft });
  c.text(476, 168, { z: '1 隻 40% → 20 隻 21.4% → 50 隻 20.6%', e: '1 name 40% → 20 names 21.4% → 50 names 20.6%' },
    { size: 9.2, fill: PAL.soft });
  return c.out();
}

const T2_DIV_DEF = 20;
const T2_DIV = () => t2Diversify(T2_DIV_DEF);
FIGS['d-diversify'] = T2_DIV;
const T2_DIV_SPEC = {

  def: { n: T2_DIV_DEF },

};

  });
  [8, 12, 16, 20].forEach((e) => {
    c.line(100, Y(e), 104, Y(e), { stroke: PAL.ink, sw: 1.2 });

  c.text(394, 350, { z: '組合標準差 σₚ（%）', e: 'portfolio SD σₚ (%)' },

  c.text(108, 64, { z: 'E(Rₚ)（%）', e: 'E(Rₚ) (%)' },
    { size: 10.5, fill: PAL.soft, anchor: 'start' });

  /* the capital allocation line: E = 8 + (5/14)·σ, 240 samples */
  const cal = [];
  for (let i = 0; i <= 240; i++) {

    cal.push([s, 8 + 5 / 14 * s]);
  }
  c.series(S, {
